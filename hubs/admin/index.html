<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Hubs admin · MannaFish</title>
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Ken, 31 Oct: the back end for MannaFish Hubs. The places people are asking for (how many asked, which qualify at your number), the
     sponsors who want to give a Hub, places people suggest, and the open Hubs: which fish are prayed for there, and filling the pond
     ("On the way" when a run is ordered, "It's in" when it arrives: everyone who prayed for that fish there is emailed).
     A place becomes a Hub only when you make it one (after an agreement with the host); a sponsored place can skip the count.
     The key is MF_ADMIN_KEY in Netlify (or PROOF_KEY); it is kept on this device after the first time. -->
<style>
:root{--ink:#000;--ink2:#0b1620;--foam:#eaf0f0;--dim:#9fb2b6;--blue:#2a5fb0;--line:rgba(200,215,218,.18);--red:#c8423c;--gold:#f5d76e;--ok:#7fd3a0}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--foam);font:1rem/1.5 'Archivo',system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}header b{font-size:1.1rem}header a{color:var(--foam);font-size:.9rem}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}nav.tabs button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
main{max-width:900px;margin:0 auto;padding:16px}
h2{font-size:1rem;margin:22px 0 10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
input,select,textarea{font:inherit;color:var(--foam);background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
button{font:700 .9rem 'Archivo',sans-serif;border-radius:999px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--foam)}
button.ok{background:var(--blue);border-color:var(--blue);color:#fff}button.no{border-color:var(--red);color:#ffb3ae}button.in{border-color:var(--ok);color:var(--ok)}button.y{border-color:var(--gold);color:var(--gold)}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;background:var(--ink2)}.card.hit{border-color:var(--gold)}.card.shut{opacity:.6}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.grid .w{grid-column:1/-1}
label{font-size:.8rem;color:var(--dim);display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.big{font-size:1.15rem;font-weight:800}.meta{font-size:.85rem;color:var(--dim)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--gold)}
table{border-collapse:collapse;width:100%;font-size:.9rem;margin:6px 0}td,th{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}th{color:var(--dim);font-weight:600}td.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{border-radius:99px;padding:1px 8px;font-size:.75rem;font-weight:800;background:rgba(255,255,255,.1)}.pill.in,.pill.active,.pill.done{background:rgba(127,211,160,.15);color:var(--ok)}.pill.coming,.pill.talking,.pill.new{background:rgba(245,215,110,.15);color:var(--gold)}
#msg{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;padding:8px 12px;border-radius:10px;margin:0 0 10px}#msg:empty{display:none}
details summary{cursor:pointer;color:var(--dim);font-size:.9rem;margin-top:10px}
.empty{color:var(--dim);padding:10px 0}
</style>
</head>
<body>
<header><b>MannaFish Hubs</b><a href="/hubs/">Public page ›</a></header>
<main>
<div id="msg" role="status"></div>
<div id="keyBox" class="card"><label>Admin password<input id="k" type="password" autocomplete="current-password"></label><div class="row"><button class="ok" id="kGo" type="button">Open</button></div></div>
<div id="app" hidden>
  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
</div>
</main>
<script>
(function(){
  function $(i){ return document.getElementById(i); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var K=''; try{ K=localStorage.getItem('mf-admin-key')||''; }catch(e){}
  var D={stations:[],sponsors:[],suggestions:[],cfg:{voteGoal:50}}, TAB='ask';
  var MERCH=[['decal','Decals'],['card','Cards'],['shirt','Shirts'],['keychain','Key chains'],['mug','Mugs'],['cap','Caps']];
  var PL=[['coffee','☕ Coffee'],['store','🏪 Store'],['church','⛪ Church'],['books','📚 Books'],['food','🍽️ Food'],['other','📍 Other']], ICON={coffee:'☕',store:'🏪',church:'⛪',books:'📚',food:'🍽️',other:'📍'};
  var ST={proposed:'Asked for',talking:'Talking with them',active:'Hub',closed:'Closed'};
  function say(t){ $('msg').textContent=t||''; if(t) setTimeout(function(){ if($('msg').textContent===t) $('msg').textContent=''; },6000); }
  function api(b){ b.k=K; return fetch('/api/hubs/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw j; return j; }); }); }
  function load(){ return fetch('/api/hubs/admin?k='+encodeURIComponent(K),{cache:'no-store'}).then(function(r){ if(r.status===403) throw 403; return r.json(); })
    .then(function(j){ try{ localStorage.setItem('mf-admin-key',K); }catch(e){} D=j; $('keyBox').hidden=true; $('app').hidden=false; draw(); })
    .catch(function(e){ $('keyBox').hidden=false; $('app').hidden=true; if(e===403) say('That password did not work.'); else if(K) say('Could not open the Hubs.'); }); }
  function lname(x){ return esc(x.word)+(x.l&&x.l!=='en'?' ('+esc(x.l)+')':''); }
  function opt(L,v){ return L.map(function(o){ return '<option value="'+o[0]+'"'+(o[0]===v?' selected':'')+'>'+o[1]+'</option>'; }).join(''); }
  function editForm(s){ var any=s.id==='anywhere';
    return '<details><summary>Change</summary><div class="grid" style="margin-top:8px">'+(any?'':'<label>Name<input data-e="name" value="'+esc(s.name)+'"></label><label>Kind<select data-e="kind">'+opt(PL,s.kind)+'</select></label><label class="w">Address (the map point is found from it)<input data-e="address" value="'+esc(s.address)+'"></label>')
      +'<label class="w">Where to pick up (shown)<input data-e="where" value="'+esc(s.where)+'"></label><label class="w">Note (shown)<input data-e="note" value="'+esc(s.note)+'"></label>'
      +(any?'':'<label>Host’s email (gets the notices, not shown)<input data-e="owner" type="email" value="'+esc(s.owner)+'"></label><label>Sponsored by (shown as “sponsored”)<input data-e="sponsored" value="'+esc(s.sponsored)+'"></label><label>Website<input data-e="url" value="'+esc(s.url)+'"></label>')
      +'<label>Prayers to fill the pond<input data-e="threshold" type="number" min="3" value="'+(s.threshold||100)+'"></label>'
      +(any?'':'<label>Map point (lat, lng)<input data-e="ll" value="'+(s.lat!=null?s.lat+', '+s.lng:'')+'" placeholder="34.24, -77.87"></label>')+'</div>'
      +'<div class="row"><button type="button" class="ok" data-a="edit">Save</button>'+(any||s.status==='active'?'':'<button type="button" class="no" data-a="remove">Take off the list</button>')+'</div>'
      +(any?'':'<p class="meta">Link: <a href="/hubs/?hub='+esc(s.id)+'">/hubs/?hub='+esc(s.id)+'</a></p>')+'</details>'; }
  function askCard(s){ var G=D.cfg.voteGoal, v=s.votes||0;
    return '<div class="card'+(v>=G?' hit':'')+'" data-id="'+esc(s.id)+'"><div class="big">'+(ICON[s.kind]||'📍')+' '+esc(s.name)+' <span class="pill '+s.status+'">'+ST[s.status]+'</span>'+(s.sponsored?' <span class="pill done">sponsored: '+esc(s.sponsored)+'</span>':'')+'</div>'
      +'<div class="meta">'+esc(s.address||s.city)+(s.approx?' · map point approximate':'')+'</div><div class="bar"><i style="width:'+Math.min(100,Math.round(v*100/G))+'%"></i></div><div class="meta"><b>'+v+'</b> of '+G+' requests'+(v>=G?' · qualifies':'')+'</div>'
      +'<div class="row">'+(s.status==='proposed'?'<button type="button" class="y" data-a="st" data-v="talking">Talking with them</button>':'<button type="button" data-a="st" data-v="proposed">Back to asked for</button>')
      +'<button type="button" class="in" data-a="st" data-v="active">Agreement made: make it a Hub</button></div>'+editForm(s)+'</div>'; }
  function hubCard(s){ var th=s.threshold||100, t=s.total||0, any=s.id==='anywhere';
    return '<div class="card'+(t>=th?' hit':'')+(s.status==='closed'?' shut':'')+'" data-id="'+esc(s.id)+'"><div class="big">'+(any?'🌍':(ICON[s.kind]||'📍'))+' '+esc(s.name)+(s.status==='closed'?' <span class="pill">closed</span>':'')+(s.sponsored?' <span class="pill done">sponsored: '+esc(s.sponsored)+'</span>':'')+'</div>'
      +'<div class="meta">'+esc(s.address||s.where||'')+(s.owner?' · notices to '+esc(s.owner):'')+'</div>'
      +'<div class="bar"><i style="width:'+Math.min(100,Math.round(t*100/th))+'%"></i></div><div class="meta">'+t+' of '+th+' prayers'+(s.notified?' · you were emailed: ready to fill':'')+'</div>'
      +(s.top.length?'<table><tr><th>Fish prayed for</th><th class="n">Praying</th><th></th></tr>'+s.top.map(function(x,j){ return '<tr><td>'+lname(x)+'</td><td class="n">'+x.n+'</td><td style="text-align:right"><button type="button" data-a="pick" data-j="'+j+'">Fill ›</button></td></tr>'; }).join('')+'</table>':'<p class="meta">No prayers here yet.</p>')
      +((s.stock||[]).length?'<table><tr><th>In the pond</th><th>What</th><th class="n">How many</th><th></th></tr>'+s.stock.map(function(x,j){ return '<tr><td>'+lname(x)+'</td><td>'+esc(x.kind)+' <span class="pill '+x.status+'">'+(x.status==='in'?'here':'on the way')+'</span></td><td class="n">'+(x.qty||'')+'</td><td style="text-align:right">'
        +(x.status!=='in'?'<button type="button" class="in" data-a="arrived" data-j="'+j+'">It’s in</button> ':'')+'<button type="button" data-a="unstock" data-j="'+j+'">Take off</button></td></tr>'; }).join('')+'</table>':'')
      +'<details><summary>Fill the pond</summary><div class="grid" style="margin-top:8px"><label>Fish (M:GATHER, X:X001, Y:W19b …)<input data-f="fish" placeholder="M:GATHER"></label><label>Word<input data-f="word" placeholder="Gather"></label>'
      +'<label>Language<input data-f="l" value="en"></label><label>What<select data-f="kind">'+opt(MERCH,'decal')+'</select></label><label>How many<input data-f="qty" type="number" min="0" value="100"></label></div>'
      +'<div class="row"><button type="button" data-a="coming">On the way</button><button type="button" class="in" data-a="in">It’s in: tell everyone who prayed</button></div></details>'
      +editForm(s)+(any?'':'<div class="row">'+(s.status==='closed'?'<button type="button" data-a="st" data-v="active">Open it again</button>':'<button type="button" class="no" data-a="st" data-v="closed">Close this Hub</button>')+'</div>')+'</div>'; }
  function sponsorCard(r,i){ return '<div class="card" data-sp="'+i+'"><div class="big">'+esc(r.org||r.name)+' <span class="pill '+r.status+'">'+esc(r.status)+'</span>'+(r.anonymous?' <span class="pill">anonymous</span>':'')+'</div>'
      +'<div class="meta">'+esc(r.name)+' · <a href="mailto:'+esc(r.email)+'" style="color:#8fb6ff">'+esc(r.email)+'</a>'+(r.phone?' · '+esc(r.phone):'')+' · '+esc((r.at||'').slice(0,10))+'</div>'
      +'<p>For: <b>'+esc((r.places||[]).concat(r.place?[r.place]:[]).join(' · '))+'</b>'+(r.what&&r.what.length?'<br>What: '+esc(r.what.join(', ')):'')+'</p>'+(r.note?'<p class="meta">“'+esc(r.note)+'”</p>':'')
      +'<div class="row"><button type="button" class="y" data-a="sp" data-v="talking">Talking</button><button type="button" class="in" data-a="sp" data-v="done">Set up</button><button type="button" data-a="sp" data-v="new">New</button></div></div>'; }
  function sugCard(r,i){ return '<div class="card" data-sg="'+i+'"><div class="big">'+(ICON[r.kind]||'📍')+' '+esc(r.name)+'</div><div class="meta">'+esc(r.address)+' · from '+esc(r.by)+' · '+esc((r.at||'').slice(0,10))+'</div>'+(r.why?'<p class="meta">“'+esc(r.why)+'”</p>':'')
      +'<div class="row"><button type="button" class="ok" data-a="sg" data-v="add">Add to the list</button><button type="button" data-a="sg" data-v="dismiss">Dismiss</button></div></div>'; }
  function newForm(){ return '<div class="card"><div class="grid"><label>Name<input id="nName" placeholder="Drift Coffee"></label><label>Kind<select id="nKind">'+opt(PL,'coffee')+'</select></label>'
      +'<label class="w">Address<input id="nAddr" placeholder="221 N Front St, Wilmington, NC 28401"></label><label>Start as<select id="nStatus">'+opt([['proposed','Asked for (people can request it)'],['talking','Talking with them'],['active','A Hub now (agreement made)']],'proposed')+'</select></label>'
      +'<label>Host’s email (optional, not shown)<input id="nOwner" type="email"></label><label class="w">Where to pick up (optional, shown)<input id="nWhere" placeholder="Ask at the counter"></label></div>'
      +'<div class="row"><button class="ok" id="nGo" type="button">Add</button></div></div>'; }
  function draw(){ var S=D.stations, asked=S.filter(function(s){ return s.status==='proposed'||s.status==='talking'; }).sort(function(a,b){ return b.votes-a.votes; }), hubs=S.filter(function(s){ return s.status==='active'; }), shut=S.filter(function(s){ return s.status==='closed'; });
    var spNew=D.sponsors.filter(function(r){ return r.status!=='done'; }).length, T=[['ask','Asked for',asked.length],['hubs','Hubs',hubs.length],['sp','Sponsors',spNew],['sg','Suggested',D.suggestions.length],['add','Add a place',''],['set','Settings','']];
    $('tabs').innerHTML=T.map(function(t){ return '<button type="button" data-t="'+t[0]+'" aria-pressed="'+(TAB===t[0])+'">'+t[1]+(t[2]?' ('+t[2]+')':'')+'</button>'; }).join('');
    var h='';
    if(TAB==='ask') h='<p class="meta">Places people can ask for, most requests first. A place qualifies at '+D.cfg.voteGoal+' requests (Settings). It becomes a Hub only when you make it one.</p>'+(asked.map(askCard).join('')||'<p class="empty">Nothing on the list.</p>');
    if(TAB==='hubs') h=hubs.map(hubCard).join('')+(shut.length?'<h2>Closed</h2>'+shut.map(hubCard).join(''):'');
    if(TAB==='sp') h=D.sponsors.map(sponsorCard).join('')||'<p class="empty">No sponsors yet.</p>';
    if(TAB==='sg') h=D.suggestions.map(sugCard).join('')||'<p class="empty">No suggestions waiting.</p>';
    if(TAB==='add') h=newForm();
    if(TAB==='set') h='<div class="card"><label>Requests for a place to qualify as a Hub (you will be emailed once when a place reaches it)<input id="cfgGoal" type="number" min="1" value="'+D.cfg.voteGoal+'"></label><div class="row"><button class="ok" id="cfgGo" type="button">Save</button></div></div>';
    $('view').innerHTML=h; }
  $('tabs').addEventListener('click',function(e){ var b=e.target.closest('[data-t]'); if(b){ TAB=b.dataset.t; draw(); } });
  function done(j){ say(j&&j.told!=null?'Done. '+j.told+' '+(j.told===1?'person was':'people were')+' told it is in.':'Saved.'); return load(); }
  function fail(b){ return function(err){ if(b) b.disabled=false; say((err&&err.error)||'That did not work.'); }; }
  $('view').addEventListener('click',function(e){ var b=e.target.closest('[data-a]'), t=e.target.id;
    if(t==='nGo'){ var n={action:'create',name:$('nName').value.trim(),kind:$('nKind').value,address:$('nAddr').value.trim(),status:$('nStatus').value,owner:$('nOwner').value.trim(),where:$('nWhere').value.trim(),city:'Wilmington, NC'};
      if(!n.name){ say('Give it a name.'); return; } api(n).then(function(){ TAB=n.status==='active'?'hubs':'ask'; say('Added.'); load(); }).catch(fail()); return; }
    if(t==='cfgGo'){ api({action:'cfg',voteGoal:$('cfgGoal').value}).then(done).catch(fail()); return; }
    if(!b) return; var a=b.dataset.a;
    if(a==='sp'){ var r=D.sponsors[+b.closest('[data-sp]').dataset.sp]; b.disabled=true; api({action:'sponsorStatus',sid:r.id,status:b.dataset.v}).then(done).catch(fail(b)); return; }
    if(a==='sg'){ var g=D.suggestions[+b.closest('[data-sg]').dataset.sg]; b.disabled=true; api({action:'suggestion',sid:g.id,do:b.dataset.v}).then(done).catch(fail(b)); return; }
    var c=b.closest('[data-id]'), s=D.stations.filter(function(x){ return x.id===c.dataset.id; })[0], j=+b.dataset.j;
    function f(n){ var el=c.querySelector('[data-f='+n+']'); return el?el.value.trim():''; }
    if(a==='pick'){ var x=s.top[j], d=c.querySelectorAll('details')[0]; d.open=true; c.querySelector('[data-f=fish]').value=x.fish; c.querySelector('[data-f=word]').value=x.word; c.querySelector('[data-f=l]').value=x.l||'en'; c.querySelector('[data-f=fish]').scrollIntoView({block:'center'}); return; }
    var body={id:s.id};
    if(a==='coming'||a==='in'){ body.action='stock'; body.status=a; body.fish=f('fish'); body.word=f('word'); body.l=f('l')||'en'; body.kind=f('kind'); body.qty=f('qty');
      if(!/^[A-Z]:/.test(body.fish)){ say('Which fish? For example M:GATHER'); return; }
      if(a==='in'&&!confirm('Email everyone who prayed for '+(body.word||body.fish)+' at '+s.name+' that it is in?')) return; }
    else if(a==='arrived'){ var y=s.stock[j]; body={id:s.id,action:'stock',status:'in',fish:y.fish,word:y.word,l:y.l,kind:y.kind,qty:y.qty}; if(!confirm('Email everyone who prayed for '+y.word+' at '+s.name+' that it is in?')) return; }
    else if(a==='unstock'){ body.action='unstock'; body.i=j; }
    else if(a==='edit'){ body.action='edit'; [].forEach.call(c.querySelectorAll('[data-e]'),function(el){ body[el.dataset.e]=el.value.trim(); });
      if(body.ll!=null){ var m=body.ll.split(/[ ,]+/); if(m.length===2&&isFinite(m[0])&&isFinite(m[1])&&body.ll!==(s.lat!=null?s.lat+', '+s.lng:'')){ body.lat=m[0]; body.lng=m[1]; } delete body.ll; }
      if(body.address===(s.address||'')) delete body.address; }
    else if(a==='remove'){ if(!confirm('Take '+s.name+' off the list? Its requests are kept.')) return; body.action='remove'; }
    else if(a==='st'){ var v=b.dataset.v; if(v==='active'&&!confirm('Make '+s.name+' a MannaFish Hub? People can then pray for fish there.')) return; if(v==='closed'&&!confirm('Close '+s.name+'? People can no longer pray for fish there.')) return; body.action='status'; body.status=v; if(v==='active') TAB='hubs'; }
    b.disabled=true; api(body).then(done).catch(fail(b)); });
  $('kGo').addEventListener('click',function(){ K=$('k').value.trim(); load(); });
  if(K) load();
})();
</script>
</body>
</html>
