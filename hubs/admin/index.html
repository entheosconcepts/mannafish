<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Hubs admin · MannaFish</title>
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Ken, 31 Oct: the back end for MannaFish Hubs. The places people are asking for (how many asked, which qualify at your number), the
     sponsors who want to give a Hub, places people suggest, and the open Hubs: which fish are prayed for there, and filling the pond
     ("On the way" when a run is ordered, "It's in" when it arrives: everyone who prayed for that fish there is emailed).
     A place becomes a Hub only when you make it one (after an agreement with the host); a sponsored place can skip the count.
     📧 Emails (Ken, 3 Nov): the emails to each Hub's host (restock check, Catch of the Month or Quarter, the monthly note, welcome,
     and anything Ken writes, like new T-shirts), what goes out by itself, and the hosts' answers (/api/hub-mail).
     The key is MF_ADMIN_KEY in Netlify (or PROOF_KEY); it is kept on this device after the first time. -->
<style>
:root{--ink:#000;--ink2:#0b1620;--foam:#eaf0f0;--dim:#9fb2b6;--blue:#2a5fb0;--line:rgba(200,215,218,.18);--red:#c8423c;--gold:#f5d76e;--ok:#7fd3a0}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--foam);font:1rem/1.5 'Archivo',system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}header b{font-size:1.1rem}header a{color:var(--foam);font-size:.9rem}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}nav.tabs button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
main{max-width:900px;margin:0 auto;padding:16px}
h2{font-size:1rem;margin:22px 0 10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
input,select,textarea{font:inherit;color:var(--foam);background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
button{font:700 .9rem 'Archivo',sans-serif;border-radius:999px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--foam)}
button.ok{background:var(--blue);border-color:var(--blue);color:#fff}button.no{border-color:var(--red);color:#ffb3ae}button.in{border-color:var(--ok);color:var(--ok)}button.y{border-color:var(--gold);color:var(--gold)}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;background:var(--ink2)}.card.hit{border-color:var(--gold)}.card.shut{opacity:.6}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.grid .w{grid-column:1/-1}
label{font-size:.8rem;color:var(--dim);display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.big{font-size:1.15rem;font-weight:800}.meta{font-size:.85rem;color:var(--dim)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--gold)}
table{border-collapse:collapse;width:100%;font-size:.9rem;margin:6px 0}td,th{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}th{color:var(--dim);font-weight:600}td.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{border-radius:99px;padding:1px 8px;font-size:.75rem;font-weight:800;background:rgba(255,255,255,.1)}.pill.in,.pill.active,.pill.done{background:rgba(127,211,160,.15);color:var(--ok)}.pill.coming,.pill.talking,.pill.new{background:rgba(245,215,110,.15);color:var(--gold)}
#msg{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;padding:8px 12px;border-radius:10px;margin:0 0 10px}#msg:empty{display:none}
details summary{cursor:pointer;color:var(--dim);font-size:.9rem;margin-top:10px}
.empty{color:var(--dim);padding:10px 0}
.gv>span{font-size:.8rem;color:var(--dim)}.gv>div{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.gv label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--foam)}.gv input{width:auto}
</style>
</head>
<body>
<header><b>MannaFish Hubs</b><a href="/hubs/">Public page ›</a></header>
<main>
<div id="msg" role="status"></div>
<div id="keyBox" class="card"><label>Admin password<input id="k" type="password" autocomplete="current-password"></label><div class="row"><button class="ok" id="kGo" type="button">Open</button></div></div>
<div id="app" hidden>
  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
</div>
</main>
<script>
(function(){
  function $(i){ return document.getElementById(i); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var K=''; try{ K=localStorage.getItem('mf-admin-key')||''; }catch(e){}
  var D={stations:[],sponsors:[],suggestions:[],cfg:{voteGoal:50}}, TAB='ask';
  var MERCH=[['decal','Decals'],['card','Cards'],['shirt','T-shirts'],['beanie','Beanies'],['cap','Caps'],['drinkware','Drinkware'],['mug','Mugs'],['keychain','Key chains']];
  function givesBox(L,attr){ L=L||[]; return '<div class="w gv"><span>Gives away (people see this)</span><div>'+MERCH.map(function(m){ return '<label><input type="checkbox" '+attr+' value="'+m[0]+'"'+(L.indexOf(m[0])>=0?' checked':'')+'> '+m[1]+'</label>'; }).join('')+'</div></div>'; }
  var PL=[['coffee','☕ Coffee'],['store','🏪 Store'],['church','⛪ Church'],['books','📚 Books'],['food','🍽️ Food'],['other','📍 Other']], ICON={coffee:'☕',store:'🏪',church:'⛪',books:'📚',food:'🍽️',other:'📍'};
  var ST={proposed:'Asked for',talking:'Talking with them',active:'Hub',closed:'Closed'};
  function say(t){ $('msg').textContent=t||''; if(t) setTimeout(function(){ if($('msg').textContent===t) $('msg').textContent=''; },6000); }
  function api(b){ b.k=K; return fetch('/api/hubs/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw j; return j; }); }); }
  function load(){ return fetch('/api/hubs/admin?k='+encodeURIComponent(K),{cache:'no-store'}).then(function(r){ if(r.status===403) throw 403; return r.json(); })
    .then(function(j){ try{ localStorage.setItem('mf-admin-key',K); }catch(e){} D=j; $('keyBox').hidden=true; $('app').hidden=false; draw(); })
    .catch(function(e){ $('keyBox').hidden=false; $('app').hidden=true; if(e===403) say('That password did not work.'); else if(K) say('Could not open the Hubs.'); }); }
  function lname(x){ return esc(x.word)+(x.l&&x.l!=='en'?' ('+esc(x.l)+')':''); }
  function opt(L,v){ return L.map(function(o){ return '<option value="'+o[0]+'"'+(o[0]===v?' selected':'')+'>'+o[1]+'</option>'; }).join(''); }
  function editForm(s){ var any=s.id==='anywhere';
    return '<details><summary>Change</summary><div class="grid" style="margin-top:8px">'+(any?'':'<label>Name<input data-e="name" value="'+esc(s.name)+'"></label><label>Kind<select data-e="kind">'+opt(PL,s.kind)+'</select></label><label class="w">Address (the map point is found from it)<input data-e="address" value="'+esc(s.address)+'"></label>')
      +'<label class="w">Where to pick up (shown)<input data-e="where" value="'+esc(s.where)+'"></label><label class="w">Note (shown)<input data-e="note" value="'+esc(s.note)+'"></label>'
      +(any?'':'<label>Host’s email (gets the notices, not shown)<input data-e="owner" type="email" value="'+esc(s.owner)+'"></label><label>Sponsored by (shown as “sponsored”)<input data-e="sponsored" value="'+esc(s.sponsored)+'"></label><label>Website<input data-e="url" value="'+esc(s.url)+'"></label>')
      +'<label>Loves to fill the pond<input data-e="threshold" type="number" min="3" value="'+(s.threshold||100)+'"></label>'+(any?'':givesBox(s.gives,'data-g'))
      +(any?'':'<label>Map point (lat, lng)<input data-e="ll" value="'+(s.lat!=null?s.lat+', '+s.lng:'')+'" placeholder="34.24, -77.87"></label>')+'</div>'
      +'<div class="row"><button type="button" class="ok" data-a="edit">Save</button>'+(any||s.status==='active'?'':'<button type="button" class="no" data-a="remove">Take off the list</button>')+'</div>'
      +(any?'':'<p class="meta">Link: <a href="/hubs/?hub='+esc(s.id)+'">/hubs/?hub='+esc(s.id)+'</a></p>')+'</details>'; }
  function askCard(s){ var G=D.cfg.voteGoal, v=s.votes||0;
    return '<div class="card'+(v>=G?' hit':'')+'" data-id="'+esc(s.id)+'"><div class="big">'+(ICON[s.kind]||'📍')+' '+esc(s.name)+' <span class="pill '+s.status+'">'+ST[s.status]+'</span>'+(s.sponsored?' <span class="pill done">sponsored: '+esc(s.sponsored)+'</span>':'')+'</div>'
      +'<div class="meta">'+esc(s.address||s.city)+(s.approx?' · map point approximate':'')+'</div><div class="bar"><i style="width:'+Math.min(100,Math.round(v*100/G))+'%"></i></div><div class="meta"><b>'+v+'</b> of '+G+' requests'+(v>=G?' · qualifies':'')+'</div>'
      +'<div class="row">'+(s.status==='proposed'?'<button type="button" class="y" data-a="st" data-v="talking">Talking with them</button>':'<button type="button" data-a="st" data-v="proposed">Back to asked for</button>')
      +'<button type="button" class="in" data-a="st" data-v="active">Agreement made: make it a Hub</button></div>'+editForm(s)+'</div>'; }
  function hubCard(s){ var th=s.threshold||100, t=s.total||0, any=s.id==='anywhere';
    return '<div class="card'+(t>=th?' hit':'')+(s.status==='closed'?' shut':'')+'" data-id="'+esc(s.id)+'"><div class="big">'+(any?'🌍':(ICON[s.kind]||'📍'))+' '+esc(s.name)+(s.status==='closed'?' <span class="pill">closed</span>':'')+(s.sponsored?' <span class="pill done">sponsored: '+esc(s.sponsored)+'</span>':'')+'</div>'
      +'<div class="meta">'+esc(s.address||s.where||'')+(s.owner?' · notices to '+esc(s.owner):'')+'</div>'
      +'<div class="bar"><i style="width:'+Math.min(100,Math.round(t*100/th))+'%"></i></div><div class="meta">'+t+' of '+th+' loves'+(s.notified?' · you were emailed: ready to fill':'')+'</div>'+(s.gives&&s.gives.length?'<div class="meta">Gives away: '+esc(s.gives.join(', '))+'</div>':'')
      +(s.top.length?'<table><tr><th>Most-loved fish</th><th class="n">Loves</th><th></th></tr>'+s.top.map(function(x,j){ return '<tr><td>'+lname(x)+'</td><td class="n">'+x.n+'</td><td style="text-align:right"><button type="button" data-a="pick" data-j="'+j+'">Fill ›</button></td></tr>'; }).join('')+'</table>':'<p class="meta">No loves here yet.</p>')
      +((s.stock||[]).length?'<table><tr><th>In the pond</th><th>What</th><th class="n">How many</th><th></th></tr>'+s.stock.map(function(x,j){ return '<tr><td>'+lname(x)+'</td><td>'+esc(x.kind)+' <span class="pill '+x.status+'">'+(x.status==='in'?'here':'on the way')+'</span></td><td class="n">'+(x.qty||'')+'</td><td style="text-align:right">'
        +(x.status!=='in'?'<button type="button" class="in" data-a="arrived" data-j="'+j+'">It’s in</button> ':'')+'<button type="button" data-a="unstock" data-j="'+j+'">Take off</button></td></tr>'; }).join('')+'</table>':'')
      +'<details><summary>Fill the pond</summary><div class="grid" style="margin-top:8px"><label>Fish (M:GATHER, X:X001, Y:W19b …)<input data-f="fish" placeholder="M:GATHER"></label><label>Word<input data-f="word" placeholder="Gather"></label>'
      +'<label>Language<input data-f="l" value="en"></label><label>What<select data-f="kind">'+opt(MERCH,'decal')+'</select></label><label>How many<input data-f="qty" type="number" min="0" value="100"></label></div>'
      +'<div class="row"><button type="button" data-a="coming">On the way</button><button type="button" class="in" data-a="in">It’s in: tell everyone who loved it</button></div></details>'
      +editForm(s)+(any?'':'<div class="row">'+(s.status==='closed'?'<button type="button" data-a="st" data-v="active">Open it again</button>':'<button type="button" class="no" data-a="st" data-v="closed">Close this Hub</button>')+'</div>')+'</div>'; }
  function sponsorCard(r,i){ return '<div class="card" data-sp="'+i+'"><div class="big">'+esc(r.org||r.name)+' <span class="pill '+r.status+'">'+esc(r.status)+'</span>'+(r.anonymous?' <span class="pill">anonymous</span>':'')+'</div>'
      +'<div class="meta">'+esc(r.name)+' · <a href="mailto:'+esc(r.email)+'" style="color:#8fb6ff">'+esc(r.email)+'</a>'+(r.phone?' · '+esc(r.phone):'')+' · '+esc((r.at||'').slice(0,10))+'</div>'
      +'<p>For: <b>'+esc((r.places||[]).concat(r.place?[r.place]:[]).join(' · '))+'</b>'+(r.what&&r.what.length?'<br>What: '+esc(r.what.join(', ')):'')+'</p>'+(r.note?'<p class="meta">“'+esc(r.note)+'”</p>':'')
      +'<div class="row"><button type="button" class="y" data-a="sp" data-v="talking">Talking</button><button type="button" class="in" data-a="sp" data-v="done">Set up</button><button type="button" data-a="sp" data-v="new">New</button></div></div>'; }
  function sugCard(r,i){ return '<div class="card" data-sg="'+i+'"><div class="big">'+(ICON[r.kind]||'📍')+' '+esc(r.name)+'</div><div class="meta">'+esc(r.address)+' · from '+esc(r.by)+' · '+esc((r.at||'').slice(0,10))+'</div>'+(r.why?'<p class="meta">“'+esc(r.why)+'”</p>':'')
      +'<div class="row"><button type="button" class="ok" data-a="sg" data-v="add">Add to the list</button><button type="button" data-a="sg" data-v="dismiss">Dismiss</button></div></div>'; }
  function newForm(){ return '<div class="card"><div class="grid"><label>Name<input id="nName" placeholder="Drift Coffee"></label><label>Kind<select id="nKind">'+opt(PL,'coffee')+'</select></label>'
      +'<label class="w">Address<input id="nAddr" placeholder="221 N Front St, Wilmington, NC 28401"></label><label>Start as<select id="nStatus">'+opt([['proposed','Asked for (people can request it)'],['talking','Talking with them'],['active','A Hub now (agreement made)']],'proposed')+'</select></label>'
      +'<label>Host’s email (optional, not shown)<input id="nOwner" type="email"></label><label class="w">Where to pick up (optional, shown)<input id="nWhere" placeholder="Ask at the counter"></label>'+givesBox(['decal'],'data-ng')+'</div>'
      +'<div class="row"><button class="ok" id="nGo" type="button">Add</button></div></div>'; }
  function draw(){ var S=D.stations, asked=S.filter(function(s){ return s.status==='proposed'||s.status==='talking'; }).sort(function(a,b){ return b.votes-a.votes; }), hubs=S.filter(function(s){ return s.status==='active'; }), shut=S.filter(function(s){ return s.status==='closed'; });
    var spNew=D.sponsors.filter(function(r){ return r.status!=='done'; }).length, T=[['ask','Asked for',asked.length],['hubs','Hubs',hubs.length],['sp','Sponsors',spNew],['sg','Suggested',D.suggestions.length],['mail','📧 Emails',''],['add','Add a place',''],['set','Settings','']];
    $('tabs').innerHTML=T.map(function(t){ return '<button type="button" data-t="'+t[0]+'" aria-pressed="'+(TAB===t[0])+'">'+t[1]+(t[2]?' ('+t[2]+')':'')+'</button>'; }).join('');
    var h='';
    if(TAB==='ask') h='<p class="meta">Places people can ask for, most requests first. A place qualifies at '+D.cfg.voteGoal+' requests (Settings). It becomes a Hub only when you make it one.</p>'+(asked.map(askCard).join('')||'<p class="empty">Nothing on the list.</p>');
    if(TAB==='hubs') h=hubs.map(hubCard).join('')+(shut.length?'<h2>Closed</h2>'+shut.map(hubCard).join(''):'');
    if(TAB==='sp') h=D.sponsors.map(sponsorCard).join('')||'<p class="empty">No sponsors yet.</p>';
    if(TAB==='sg') h=D.suggestions.map(sugCard).join('')||'<p class="empty">No suggestions waiting.</p>';
    if(TAB==='add') h=newForm();
    if(TAB==='set') h='<div class="card"><label>Requests for a place to qualify as a Hub (you will be emailed once when a place reaches it)<input id="cfgGoal" type="number" min="1" value="'+D.cfg.voteGoal+'"></label><div class="row"><button class="ok" id="cfgGo" type="button">Save</button></div></div>';
    if(TAB==='mail') h='<div id="hm"><p class="meta">Opening…</p></div>';
    $('view').innerHTML=h; if(TAB==='mail') hmLoad(); }
  // ── Emails to Hub hosts (Ken, 3 Nov: "email campaigns for every hub that says, need a restock ... automatic email campaigns, check out
  // our new t-shirts, request a catch of the month, catch of the quarter"): send one now, who gets them, what is automatic, and the answers
  var HM=null, HMF={kind:'intro',period:'month',to:'all',ids:[],news:{},invite:''};
  var KN=[['intro','💌 Invitation: the free devotional, the vision, and “would you like to be a Hub?” (to places that are not Hubs yet)'],['restock','⚠️ Restock check: “How are the MannaFish?” (one tap: plenty, low, out)'],['catch','🐟 Choose your Catch of the Month or Quarter'],['monthly','📊 Your month as a MannaFish Hub'],['welcome','👋 Welcome, you are a MannaFish Hub'],['news','✍️ Write your own (news, new T-shirts, a season, a thank-you)']];
  var IDEAS=[['','Start from an idea…'],
    ['shirts',{subject:'New MannaFish T-shirts for your Hub',heading:'New MannaFish T-shirts are here',body:'We have new MannaFish T-shirts, free to give away at your Hub, like the fish.\n\nWould you like some? Reply with how many and which sizes, and we will send them.',button:'See the T-shirts',link:'https://manna-fish.com/'}],
    ['fish',{subject:'New MannaFish designs to choose from',heading:'New fish in the net',body:'We have added new MannaFish designs, each a word of Scripture.\n\nChoose the one you would like at your Hub next.',catch:true}],
    ['take2',{subject:'A reminder for your MannaFish display: Take 2',heading:'Take 2: one to keep, one to give',body:'Thank you for giving MannaFish away. A small reminder for your display: each person takes two, one to keep and one to give to someone else.\n\nIf you notice fish going faster than they should, just reply and let us know. We can send a new sign for your display.'}],
    ['christmas',{subject:'Christmas MannaFish for your Hub',heading:'For unto us a child is born',body:'Christmas is coming, and people are looking for hope. We would love to send Christmas MannaFish to your Hub to give away.\n\nWould you like some? Reply with how many you think you will need.',restock:true}],
    ['easter',{subject:'Easter MannaFish for your Hub',heading:'He is risen',body:'Easter is coming. We would love to send Easter MannaFish to your Hub to give away.\n\nWould you like some? Reply with how many you think you will need.',restock:true}],
    ['thanks',{subject:'Thank you from MannaFish',heading:'Thank you',body:'Thank you for being a MannaFish Hub. Every fish someone takes from your place is a word of Scripture going home with them.\n\n“So shall my word be that goeth forth out of my mouth: it shall not return unto me void” (Isaiah 55:11).'}],
    ['story',{subject:'Have you seen a MannaFish story at your Hub?',heading:'Tell us a fish story',body:'Has someone told you what a MannaFish meant to them? We would love to hear it.\n\nJust reply to this email. With their permission, we may share it (without names) to encourage others.'}],
    ['sponsor',{subject:'Know someone who would sponsor MannaFish?',heading:'Help MannaFish reach more people',body:'MannaFish are always free. They are paid for by sponsors: churches, businesses and people who want Scripture given away in their town.\n\nKnow a business or church that might sponsor fish for your Hub? Reply with their name and we will reach out.'}],
    ['devo',{subject:'A free daily devotional for your customers',heading:'A word a day, free',body:'Many people who take a MannaFish also sign up for the free MannaFish devotional: one word of Scripture each morning, by email or text.\n\nFeel free to tell your customers or members about it.',button:'See the devotional',link:'https://manna-fish.com/'}]];
  function hmApi(b){ b.k=K; return fetch('/api/hub-mail',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw j; return j; }); }); }
  function hmLoad(){ fetch('/api/hub-mail?k='+encodeURIComponent(K),{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){ HM=j; hmDraw(); }).catch(function(){ var v=$('hm'); if(v) v.innerHTML='<p class="empty">Could not open the emails.</p>'; }); }
  function day(t){ return t?new Date(t).toLocaleDateString([],{month:'short',day:'numeric'}):''; }
  var ANS={devo:'📖 Opened the devotional',yes:'🐟 Yes, wants to be a Hub',more:'💬 Wants to know more',no:'Not right now',ok:'✅ Plenty',low:'⚠️ Running low',out:'❌ All out',stop:'🔕 Stopped emails',start:'🔔 Started again'};
  function hmDraw(){ var v=$('hm'); if(!v||!HM) return; var C=HM.cfg, H=HM.hubs, open=H.filter(function(h){ return h.status==='active'; }), reach=open.filter(function(h){ return h.owner&&!h.mailOff; }).length, n=HMF.news, intro=HMF.kind==='intro', ask=H.filter(function(h){ return ['proposed','talking','invited'].indexOf(h.status)>=0&&h.owner&&!h.mailOff; }).length;
    var h=(HM.mail?'':'<div class="card hit">Email is not set up yet (BREVO_API_KEY in Netlify), so nothing can be sent.</div>')
      +'<h2>Send an email</h2><div class="card"><div class="grid">'
      +'<label class="w">Which email<select id="hmKind">'+KN.map(function(k){ return '<option value="'+k[0]+'"'+(k[0]===HMF.kind?' selected':'')+'>'+k[1]+'</option>'; }).join('')+'</select></label>'
      +(HMF.kind==='catch'||HMF.kind==='monthly'?'<label>The Catch of the<select id="hmPer"><option value="month"'+(HMF.period==='month'?' selected':'')+'>Month</option><option value="quarter"'+(HMF.period==='quarter'?' selected':'')+'>Quarter</option></select></label>':'')
      +(HMF.kind==='news'?'<label class="w">Start from an idea<select id="hmIdea">'+IDEAS.map(function(x){ return '<option value="'+x[0]+'">'+(x[0]?esc(x[1].subject):x[1])+'</option>'; }).join('')+'</select></label>'
        +'<label class="w">Subject<input id="hmSub" value="'+esc(n.subject||'')+'"></label><label class="w">Heading (big, at the top)<input id="hmHead" value="'+esc(n.heading||'')+'"></label>'
        +'<label class="w">Message (a blank line starts a new paragraph; it begins “Hi” and the host’s first name)<textarea id="hmBody" rows="7">'+esc(n.body||'')+'</textarea></label>'
        +'<label>Button words (optional)<input id="hmBtn" value="'+esc(n.button||'')+'" placeholder="See the T-shirts"></label><label>Button link<input id="hmLink" value="'+esc(n.link||'')+'" placeholder="https://manna-fish.com/…"></label>'
        +'<label class="w">Picture at the top (a link to an image, optional)<input id="hmImg" value="'+esc(n.image||'')+'" placeholder="https://…/shirts.jpg"></label>'
        +'<div class="w gv"><div><label><input type="checkbox" id="hmR"'+(n.restock?' checked':'')+'> Add a “⚠️ We need a restock” button</label><label><input type="checkbox" id="hmC"'+(n.catch?' checked':'')+'> Add a “🐟 Choose our Catch” button</label></div></div>':'')
      +(intro?'<label class="w">Send to<select id="hmTo"><option value="all"'+(HMF.to==='all'?' selected':'')+'>Every place on the Asked-for list with an email ('+ask+')</option><option value="pick"'+(HMF.to==='pick'?' selected':'')+'>Places I choose</option><option value="new"'+(HMF.to==='new'?' selected':'')+'>Only the new places I type below</option></select></label>'
        +'<label class="w">New places to invite (one per line: place, email, contact name). They are kept as “invited”, not shown on the public page until they say yes.<textarea id="hmInv" rows="4" placeholder="Drift Coffee, owner@driftcoffee.com, Sam Lee">'+esc(HMF.invite)+'</textarea></label>'
      :'<label class="w">Send to<select id="hmTo"><option value="all"'+(HMF.to==='all'?' selected':'')+'>Every open Hub ('+reach+' with a host email)</option><option value="pick"'+(HMF.to==='pick'?' selected':'')+'>Hubs I choose</option></select></label>')
      +(HMF.to==='pick'?'<div class="w gv"><div>'+H.filter(function(x){ return intro?x.status!=='active'&&x.status!=='closed':x.status==='active'; }).map(function(x){ return '<label><input type="checkbox" data-hmid="'+esc(x.id)+'"'+(HMF.ids.indexOf(x.id)>=0?' checked':'')+(x.owner?'':' disabled')+'> '+esc(x.name)+(x.owner?'':' (no email)')+(x.mailOff?' 🔕':'')+(x.introAt?' · invited '+day(x.introAt):'')+'</label>'; }).join('')+'</div></div>':'')
      +'</div><div class="row"><button type="button" id="hmPrev">👁 Preview</button><button type="button" id="hmTest">📧 Send me a test</button><button type="button" class="ok" id="hmSend">Send</button></div>'
      +'<iframe id="hmFrame" title="Preview" style="display:none;width:100%;height:560px;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:#fff"></iframe>'
      +'<p class="meta">Tests go to '+esc(HM.to)+'. Hosts who tapped “Stop these emails” (🔕) are skipped.</p></div>'
      +'<h2>Automatic</h2><div class="card"><div class="gv"><div>'
      +'<label><input type="checkbox" id="auR"'+(C.auto.restock?' checked':'')+'> ⚠️ Restock check every <input id="auD" type="number" min="3" value="'+C.restockDays+'" style="width:70px;padding:3px 6px"> days</label>'
      +'<label><input type="checkbox" id="auM"'+(C.auto.monthly?' checked':'')+'> 📊 Monthly note on the 1st, with the Catch</label>'
      +'<label><input type="checkbox" id="auW"'+(C.auto.welcome?' checked':'')+'> 👋 Welcome when a Hub opens</label></div></div>'
      +'<div class="row"><button type="button" class="ok" id="auGo">Save</button></div><p class="meta">Sent each morning about 9:40, only to open Hubs that have a host email.</p></div>'
      +'<h2>Hosts</h2>'+(H.length?H.map(function(x){ return '<div class="card" data-hm="'+esc(x.id)+'"><div class="big">'+esc(x.name)+' <span class="pill '+x.status+'">'+esc(x.status==='active'?'Hub':x.status==='invited'?'invited':x.status==='proposed'?'asked for':x.status)+'</span>'+(x.mailOff?' <span class="pill">🔕 stopped emails</span>':'')+'</div>'
        +'<div class="meta">'+(x.lastReply?'Last answer: '+ANS[x.lastReply.a]+' · '+day(x.lastReply.at)+' · ':'')+(x.nextRestock?'Next restock check: '+day(x.nextRestock):'')+'</div>'
        +'<div class="grid" style="margin-top:8px"><label>Host’s name<input data-h="hostName" value="'+esc(x.hostName)+'"></label><label>Host’s email<input data-h="owner" type="email" value="'+esc(x.owner)+'"></label>'
        +'<label>Catch<select data-h="catchEvery">'+opt([['month','Each month'],['quarter','Each quarter'],['off','Not asked']],x.catchEvery)+'</select></label><label>Restock check every (days; blank = '+C.restockDays+')<input data-h="restockDays" type="number" min="3" value="'+esc(x.restockDays)+'"></label>'
        +'<label class="w" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" data-h="mailOff" style="width:auto"'+(x.mailOff?' checked':'')+'> Don’t email this host</label></div>'
        +'<div class="row"><button type="button" data-hmsave="1">Save</button></div></div>'; }).join(''):'<p class="empty">No Hubs yet.</p>')
      +'<h2>Answers</h2><div class="card">'+(HM.replies.length?'<table><tr><th>Hub</th><th>Answer</th><th>When</th></tr>'+HM.replies.map(function(r){ return '<tr><td>'+esc(r.name)+'</td><td>'+(ANS[r.a]||esc(r.a))+'</td><td>'+day(r.at)+'</td></tr>'; }).join('')+'</table>':'<p class="empty">No answers yet.</p>')+'</div>'
      +'<h2>Catches chosen</h2><div class="card">'+(HM.picks.length?'<table><tr><th>Hub</th><th>Fish</th><th>For</th><th>Note</th></tr>'+HM.picks.map(function(p){ return '<tr><td>'+esc(p.name)+'</td><td><b>'+esc(p.title)+'</b> '+esc(p.ref||'')+'</td><td>'+esc(p.period)+'</td><td class="meta">'+esc(p.note||'')+'</td></tr>'; }).join('')+'</table>':'<p class="empty">No Catches chosen yet.</p>')+'</div>'
      +'<h2>Sent</h2><div class="card">'+(HM.log.length?'<table><tr><th>When</th><th>Email</th><th class="n">To</th></tr>'+HM.log.map(function(l){ return '<tr><td>'+day(l.at)+(l.auto?' <span class="pill">auto</span>':'')+'</td><td>'+esc(l.subject)+'</td><td class="n" title="'+esc((l.to||[]).map(function(t){ return t.name; }).join(', '))+'">'+(l.to||[]).length+'</td></tr>'; }).join('')+'</table>':'<p class="empty">Nothing sent yet.</p>')+'</div>';
    v.innerHTML=h; }
  function hmRead(){ HMF.kind=$('hmKind').value; if($('hmPer')) HMF.period=$('hmPer').value; HMF.to=$('hmTo').value;
    if($('hmSub')) HMF.news={subject:$('hmSub').value.trim(),heading:$('hmHead').value.trim(),body:$('hmBody').value,button:$('hmBtn').value.trim(),link:$('hmLink').value.trim(),image:$('hmImg').value.trim(),restock:$('hmR').checked,catch:$('hmC').checked};
    if($('hmInv')) HMF.invite=$('hmInv').value;
    if(HMF.to==='pick'&&document.querySelector('[data-hmid]')) HMF.ids=[].map.call(document.querySelectorAll('[data-hmid]:checked'),function(i){ return i.dataset.hmid; }); }
  function hmInvites(){ return (HMF.kind==='intro'?HMF.invite:'').split('\n').map(function(l){ var p=l.split(',').map(function(x){ return x.trim(); }), e=p.filter(function(x){ return /@/.test(x); })[0]||'';
      var rest=p.filter(function(x){ return x&&x!==e; }); return {name:rest[0]||'',email:e,contact:rest[1]||''}; }).filter(function(x){ return x.name&&x.email; }); }
  function hmBody(extra){ var b={kind:HMF.kind,period:HMF.period,ids:HMF.to==='all'?'all':HMF.to==='new'?[]:HMF.ids}; if(HMF.kind==='news') b.news=HMF.news; if(HMF.kind==='intro') b.invite=hmInvites(); for(var k in extra) b[k]=extra[k]; return b; }
  document.addEventListener('change',function(e){ var t=e.target; if(!$('hm')||!$('hm').contains(t)) return;
    if(t.id==='hmKind'||t.id==='hmTo'){ hmRead(); hmDraw(); }
    if(t.id==='hmIdea'){ var x=IDEAS.filter(function(i){ return i[0]===t.value; })[0]; if(x&&x[0]){ HMF.news=Object.assign({},x[1]); hmDraw(); } } });
  document.addEventListener('click',function(e){ var t=e.target, hm=$('hm'); if(!hm||!hm.contains(t)) return; var b=t.closest('button'); if(!b) return;
    if(b.id==='hmPrev'){ hmRead(); hmApi(hmBody({action:'preview'})).then(function(m){ var f=$('hmFrame'); f.style.display='block'; f.srcdoc='<p style="font:13px Arial;color:#555;margin:8px">Subject: <b>'+esc(m.subject)+'</b></p>'+m.html; }).catch(function(er){ say((er&&er.error)||'Could not preview.'); }); return; }
    if(b.id==='hmTest'){ hmRead(); b.disabled=true; hmApi(hmBody({action:'send',test:true})).then(function(j){ b.disabled=false; say('Test sent to '+j.to+'.'); }).catch(function(er){ b.disabled=false; say((er&&er.error)||'Could not send.'); }); return; }
    if(b.id==='hmSend'){ hmRead(); var intro=HMF.kind==='intro', inv=hmInvites().length;
      var cnt=(HMF.to==='all'?HM.hubs.filter(function(h){ return (intro?['proposed','talking','invited'].indexOf(h.status)>=0:h.status==='active')&&h.owner&&!h.mailOff; }).length:HMF.to==='new'?0:HMF.ids.length)+inv;
      if(!cnt){ say(intro?'No one to invite: type a place and email, or add emails to places on the Asked-for list.':'No Hub to send to: add a host email under Hosts.'); return; }
      if(!confirm('Send this to '+cnt+(intro?' place'+(cnt===1?'':'s'):' Hub host'+(cnt===1?'':'s'))+'?')) return; b.disabled=true;
      hmApi(hmBody({action:'send'})).then(function(j){ b.disabled=false; say('Sent to '+j.sent+(j.skipped&&j.skipped.length?' · skipped '+j.skipped.length+' ('+j.skipped.map(function(s){ return s.name+': '+s.why; }).join(', ')+')':'')+'.'); hmLoad(); })
        .catch(function(er){ b.disabled=false; say((er&&er.error)||'Could not send.'); }); return; }
    if(b.id==='auGo'){ hmApi({action:'cfg',auto:{restock:$('auR').checked,monthly:$('auM').checked,welcome:$('auW').checked},restockDays:$('auD').value}).then(function(){ say('Saved.'); hmLoad(); }).catch(function(er){ say((er&&er.error)||'Could not save.'); }); return; }
    if(b.dataset.hmsave){ var c=b.closest('[data-hm]'), body={action:'host',id:c.dataset.hm}; [].forEach.call(c.querySelectorAll('[data-h]'),function(el){ body[el.dataset.h]=el.type==='checkbox'?el.checked:el.value.trim(); });
      b.disabled=true; hmApi(body).then(function(){ say('Saved.'); hmLoad(); }).catch(function(er){ b.disabled=false; say((er&&er.error)||'Could not save.'); }); } });
  $('tabs').addEventListener('click',function(e){ var b=e.target.closest('[data-t]'); if(b){ TAB=b.dataset.t; draw(); } });
  function done(j){ say(j&&j.told!=null?'Done. '+j.told+' '+(j.told===1?'person was':'people were')+' emailed.':'Saved.'); return load(); }
  function fail(b){ return function(err){ if(b) b.disabled=false; say((err&&err.error)||'That did not work.'); }; }
  $('view').addEventListener('click',function(e){ var b=e.target.closest('[data-a]'), t=e.target.id;
    if(t==='nGo'){ var n={action:'create',name:$('nName').value.trim(),kind:$('nKind').value,address:$('nAddr').value.trim(),status:$('nStatus').value,owner:$('nOwner').value.trim(),where:$('nWhere').value.trim(),city:'Wilmington, NC',gives:[].map.call(document.querySelectorAll('[data-ng]:checked'),function(i){ return i.value; })};
      if(!n.name){ say('Give it a name.'); return; } api(n).then(function(){ TAB=n.status==='active'?'hubs':'ask'; say('Added.'); load(); }).catch(fail()); return; }
    if(t==='cfgGo'){ api({action:'cfg',voteGoal:$('cfgGoal').value}).then(done).catch(fail()); return; }
    if(!b) return; var a=b.dataset.a;
    if(a==='sp'){ var r=D.sponsors[+b.closest('[data-sp]').dataset.sp]; b.disabled=true; api({action:'sponsorStatus',sid:r.id,status:b.dataset.v}).then(done).catch(fail(b)); return; }
    if(a==='sg'){ var g=D.suggestions[+b.closest('[data-sg]').dataset.sg]; b.disabled=true; api({action:'suggestion',sid:g.id,do:b.dataset.v}).then(done).catch(fail(b)); return; }
    var c=b.closest('[data-id]'), s=D.stations.filter(function(x){ return x.id===c.dataset.id; })[0], j=+b.dataset.j;
    function f(n){ var el=c.querySelector('[data-f='+n+']'); return el?el.value.trim():''; }
    if(a==='pick'){ var x=s.top[j], d=c.querySelectorAll('details')[0]; d.open=true; c.querySelector('[data-f=fish]').value=x.fish; c.querySelector('[data-f=word]').value=x.word; c.querySelector('[data-f=l]').value=x.l||'en'; c.querySelector('[data-f=fish]').scrollIntoView({block:'center'}); return; }
    var body={id:s.id};
    if(a==='coming'||a==='in'){ body.action='stock'; body.status=a; body.fish=f('fish'); body.word=f('word'); body.l=f('l')||'en'; body.kind=f('kind'); body.qty=f('qty');
      if(!/^[A-Z]:/.test(body.fish)){ say('Which fish? For example M:GATHER'); return; }
      if(a==='in'&&!confirm('Email everyone who loved '+(body.word||body.fish)+' at '+s.name+' that it is in?')) return; }
    else if(a==='arrived'){ var y=s.stock[j]; body={id:s.id,action:'stock',status:'in',fish:y.fish,word:y.word,l:y.l,kind:y.kind,qty:y.qty}; if(!confirm('Email everyone who loved '+y.word+' at '+s.name+' that it is in?')) return; }
    else if(a==='unstock'){ body.action='unstock'; body.i=j; }
    else if(a==='edit'){ body.action='edit'; [].forEach.call(c.querySelectorAll('[data-e]'),function(el){ body[el.dataset.e]=el.value.trim(); }); if(c.querySelector('[data-g]')) body.gives=[].map.call(c.querySelectorAll('[data-g]:checked'),function(i){ return i.value; });
      if(body.ll!=null){ var m=body.ll.split(/[ ,]+/); if(m.length===2&&isFinite(m[0])&&isFinite(m[1])&&body.ll!==(s.lat!=null?s.lat+', '+s.lng:'')){ body.lat=m[0]; body.lng=m[1]; } delete body.ll; }
      if(body.address===(s.address||'')) delete body.address; }
    else if(a==='remove'){ if(!confirm('Take '+s.name+' off the list? Its requests are kept.')) return; body.action='remove'; }
    else if(a==='st'){ var v=b.dataset.v; if(v==='active'&&!confirm('Make '+s.name+' a MannaFish Hub? Everyone who asked for it is emailed that it is open, and people can love fish for it.')) return; if(v==='closed'&&!confirm('Close '+s.name+'? People can no longer love fish for it.')) return; body.action='status'; body.status=v; if(v==='active') TAB='hubs'; }
    b.disabled=true; api(body).then(done).catch(fail(b)); });
  $('kGo').addEventListener('click',function(){ K=$('k').value.trim(); load(); });
  if(K) load();
})();
</script>
