<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Choose your Catch · MannaFish</title>
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Ken, 3 Nov: "request a catch of the month, catch of the quarter". A Hub's host opens this from the button in their email (the link
     carries their Hub and a signed key), picks the MannaFish they want next, or "Surprise us", and Ken is emailed. -->
<style>
:root{--ink:#000;--ink2:#0b1620;--foam:#eaf0f0;--dim:#9fb2b6;--blue:#2a5fb0;--line:rgba(200,215,218,.18);--gold:#f5d76e}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--foam);font:1rem/1.5 'Archivo',system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:center;padding:14px 16px;border-bottom:1px solid var(--line)}header img{height:26px}
main{max-width:980px;margin:0 auto;padding:18px 16px 120px}
h1{font:800 1.6rem/1.2 'Archivo',sans-serif;margin:6px 0 4px;text-align:center}.sub{color:var(--dim);text-align:center;margin:0 0 14px}
input,textarea{font:inherit;color:var(--foam);background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px}
.f{border:2px solid var(--line);border-radius:14px;background:var(--ink2);padding:6px 6px 8px;text-align:center;cursor:pointer;color:inherit;font:inherit}
.f .i{aspect-ratio:2/1;background:#000;border-radius:9px;overflow:hidden}.f img{width:100%;height:100%;object-fit:contain;display:block}
.f b{display:block;margin-top:5px}.f small{color:var(--dim);font-size:.78rem}.f[aria-pressed=true]{border-color:var(--gold);background:#1d1a08}
.f.sur .i{display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.more{display:block;margin:16px auto 0;border:1px solid var(--line);background:none;color:var(--foam);border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0b1620;border-top:1px solid var(--line);padding:12px 16px max(12px,env(safe-area-inset-bottom))}
.bar div{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center}.bar span{flex:1;min-width:0}
.bar button{border:0;border-radius:999px;background:var(--blue);color:#fff;padding:13px 22px;font:800 1rem 'Archivo',sans-serif;cursor:pointer}.bar button[disabled]{opacity:.45}
.done{text-align:center;padding:40px 0}.done h1{color:var(--gold)}
.msg{color:var(--gold);text-align:center;font-weight:700}
</style>
</head>
<body>
<header><a href="/"><img src="/w/img/logo-email.png" alt="MannaFish"></a></header>
<main id="m"><p class="sub">Opening…</p></main>
<div class="bar" id="bar" hidden><div><span id="pick">Choose a fish</span><button type="button" id="go" disabled>Choose this</button></div></div>
<script>
(function(){
  var $=function(i){ return document.getElementById(i); }, Q=new URLSearchParams(location.search), H=Q.get('h')||'', T=Q.get('t')||'', P=Q.get('p')==='quarter'?'quarter':'month';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var ALL=[], SHOW=60, SEL=null, D=null;
  fetch('/api/hub-mail/catch?h='+encodeURIComponent(H)+'&t='+encodeURIComponent(T)+'&p='+P,{cache:'no-store'}).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw j; return j; }); })
    .then(function(j){ D=j; ALL=j.fish||[]; draw(); }).catch(function(e){ $('m').innerHTML='<h1>That link has expired</h1><p class="sub">Just reply to the email and we will take care of it.</p>'; });
  function list(){ var s=($('q')&&$('q').value||'').trim().toLowerCase(); return s?ALL.filter(function(f){ return (f.title+' '+f.ref).toLowerCase().indexOf(s)>=0; }):ALL; }
  function card(f){ return '<button type="button" class="f" data-k="'+esc(f.key)+'" aria-pressed="'+(SEL===f.key)+'"><div class="i"><img loading="lazy" src="'+esc(f.img)+'" alt=""></div><b>'+esc(f.title)+'</b><small>'+esc(f.ref)+'</small></button>'; }
  function grid(){ var L=list(); $('g').innerHTML=(($('q').value||'').trim()?'':'<button type="button" class="f sur" data-k="surprise" aria-pressed="'+(SEL==='surprise')+'"><div class="i">🎁</div><b>Surprise us</b><small>We pick one for the season</small></button>')
      +L.slice(0,SHOW).map(card).join(''); $('more').hidden=L.length<=SHOW; }
  function draw(){ $('m').innerHTML='<h1>Choose your Catch of '+esc(D.period.name)+'</h1><p class="sub">'+esc(D.hub.name)+': the MannaFish you would like next. We print it and send it, free to give away.</p>'
      +(D.picked?'<p class="msg">You chose <b>'+esc(D.picked.title)+'</b>. You can change it.</p>':'')
      +'<input id="q" type="search" placeholder="Find a word or a verse: Hope, Psalm 23 …" autocomplete="off"><div class="g" id="g"></div><button type="button" class="more" id="more">Show more</button>'
      +'<p style="margin-top:18px"><textarea id="note" rows="2" placeholder="Anything we should know? (optional)">'+esc(D.picked&&D.picked.note||'')+'</textarea></p>';
    $('bar').hidden=false; if(D.picked){ SEL=D.picked.fish; ui(); } grid();
    $('q').oninput=function(){ SHOW=60; grid(); }; $('more').onclick=function(){ SHOW+=60; grid(); }; }
  function ui(){ var f=SEL==='surprise'?{title:'Surprise us'}:ALL.filter(function(x){ return x.key===SEL; })[0]; $('pick').innerHTML=f?'Your Catch: <b>'+esc(f.title)+'</b>':'Choose a fish'; $('go').disabled=!f; }
  document.addEventListener('click',function(e){ var b=e.target.closest('.f'); if(!b) return; SEL=b.dataset.k; [].forEach.call(document.querySelectorAll('.f'),function(x){ x.setAttribute('aria-pressed',String(x.dataset.k===SEL)); }); ui(); });
  $('go').onclick=function(){ var btn=this; btn.disabled=true;
    fetch('/api/hub-mail/catch',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({h:H,t:T,p:P,fish:SEL,note:($('note')||{}).value||''})})
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw j; return j; }); })
      .then(function(){ var f=SEL==='surprise'?{title:'Surprise us'}:ALL.filter(function(x){ return x.key===SEL; })[0]; $('bar').hidden=true;
        $('m').innerHTML='<div class="done"><h1>Thank you!</h1><p>Your Catch of '+esc(D.period.name)+': <b>'+esc(f.title)+'</b>.</p><p class="sub">Ken has been told. We will let you know when it is on the way.</p></div>'; window.scrollTo(0,0); })
      .catch(function(e){ btn.disabled=false; alert((e&&e.error)||'That did not work. Please try again.'); }); };
})();
</script>
</body>
</html>
