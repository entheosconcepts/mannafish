<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Fish review · MannaFish</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;1,400&family=Archivo:wght@400;600;700;800&display=swap">
<!-- Ken, 7 Nov: "an admin page like [Go Fish] with all available fish so I can check a box to remove or a box to edit, and just tell you to fix the ones
     that have an edit button to standardize the format based on established rules for 2, 3 ... 9 letter words. No one uses this yet, so no password."
     Every fish (the 24, the 128 new fish, the designs, the 507 reading-plan fish). Marks are saved on the server (/api/fish-flags) and only mark: nothing is
     edited or removed until Ken tells Claude. -->
<style>
@font-face{font-family:'MFHobo';src:url(/fish-lang/hobo.woff2) format('woff2');font-display:block}
:root{--bg:#000;--card:#0b1620;--line:rgba(200,215,218,.18);--text:#eaf0f0;--dim:#9fb2b6;--blue:#2a5fb0;--blue2:#6f9be0;--gold:#f5d76e;--red:#e06a64}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 Archivo,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.94);border-bottom:1px solid var(--line);padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font:400 1.35rem/1 'MFHobo',cursive;color:#fff;text-decoration:none}.brand b{font-weight:400;color:#448fff}
h1{font:800 1rem Archivo,sans-serif;margin:0;flex:1;min-width:140px}
.btn{border:1px solid var(--line);background:var(--card);color:inherit;border-radius:999px;padding:8px 13px;font:800 .82rem Archivo,sans-serif;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;-webkit-overflow-scrolling:touch}.tabs button{flex:none;border:1px solid var(--line);background:none;color:var(--dim);border-radius:999px;padding:6px 11px;font:700 .8rem Archivo,sans-serif;cursor:pointer}
.tabs button[aria-pressed=true]{background:rgba(111,155,224,.18);border-color:var(--blue2);color:#fff}
.row2{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.row2 input[type=search]{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);color:inherit;border-radius:999px;padding:8px 13px;font:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg button{border:0;background:none;color:var(--dim);padding:7px 11px;font:700 .78rem Archivo,sans-serif;cursor:pointer}.seg button[aria-pressed=true]{background:rgba(111,155,224,.22);color:#fff}
.status{font-size:.82rem;color:var(--dim);min-height:1.2em;margin-top:4px}.status.ok{color:#7fd18b}.status.err{color:var(--red)}
main{padding:12px 10px 90px;max-width:1100px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 8px;text-align:center;min-width:0}
.c.fe{border-color:var(--gold);box-shadow:0 0 0 1px rgba(245,215,110,.35)}.c.fr{border-color:var(--red);box-shadow:0 0 0 1px rgba(224,106,100,.4);opacity:.75}
.thumb{display:block;width:100%;aspect-ratio:2/1;background:#000;border-radius:10px;border:0;padding:0;cursor:pointer;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.w{font:700 .95rem Archivo,sans-serif;margin:5px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.id{font-size:.68rem;color:var(--dim);letter-spacing:.06em}
.chips{display:flex;gap:5px;margin-top:6px}.chip{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 3px;font:700 .72rem Archivo,sans-serif;cursor:pointer;user-select:none;min-height:34px}
.chip input{width:17px;height:17px;margin:0;accent-color:var(--gold)}.chip.r input{accent-color:var(--red)}
.chip:has(input:checked){background:rgba(245,215,110,.16);border-color:var(--gold)}.chip.r:has(input:checked){background:rgba(224,106,100,.18);border-color:var(--red)}
.empty{color:var(--dim);text-align:center;padding:50px 0}
.lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:14px}.lb.on{display:flex}
.lb .in{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.lb .big{background:#000;border-radius:12px;aspect-ratio:2/1}.lb .big img{width:100%;height:100%;object-fit:contain;display:block}
.lb h2{font:400 1.8rem/1 'MFHobo',cursive;margin:10px 0 2px}.lb p{margin:4px 0;color:var(--dim);font-size:.9rem}.lb .v{font:italic 1rem/1.4 Spectral,serif;color:var(--text)}
.lb .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.lb .acts a{text-decoration:none;color:inherit}
</style>
</head>
<body>
<div class="top">
  <div class="row1"><a class="brand" href="/">Manna<b>Fish</b></a><h1>Fish review <span id="count" style="color:var(--dim);font-weight:600"></span></h1><button class="btn p" id="copy" type="button">📋 Copy my list</button></div>
  <div class="tabs" id="tabs" role="group" aria-label="Show"></div>
  <div class="row2"><input type="search" id="q" placeholder="Find a word, verse or ID" autocomplete="off"><span class="seg" role="group" aria-label="Which picture"><button type="button" data-m="saved" aria-pressed="true">As saved</button><button type="button" data-m="std" aria-pressed="false">As the standard draws it</button></span></div>
  <div class="status" id="st" role="status"></div>
</div>
<main><div class="grid" id="grid"></div><p class="empty" id="empty" hidden>No fish match.</p></main>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Fish"><div class="in" id="lbin"></div></div>
<script>
(function(){
  var $=function(i){ return document.getElementById(i); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var FISH=[], FL={}, FILTER='all', Q='', MODE='saved', byId={};
  var SETN={'24':'The 24','new':'New fish','design':'Designs','plan':'Plan fish'};
  function st(t,c){ $('st').textContent=t||''; $('st').className='status'+(c?' '+c:''); }
  function src(f){ if(MODE==='std'&&(f.set==='new'||f.set==='plan')) return '/api/fish-img?k='+encodeURIComponent(f.id)+'&fmt=svg'; return f.img; }
  function editLink(f){ return f.set==='24'?'/edit/':'/edit/?find='+encodeURIComponent(f.id)+'&set='+(f.id.charAt(0)==='D'?'daily':'new'); }
  function counts(){ var c={all:FISH.length,'24':0,new:0,design:0,plan:0,edit:0,remove:0};
    FISH.forEach(function(f){ c[f.set]++; var m=FL[f.id]; if(m&&m.edit) c.edit++; if(m&&m.remove) c.remove++; }); return c; }
  function tabs(){ var c=counts(), T=[['all','All'],['24','The 24'],['new','New fish'],['design','Designs'],['plan','Plan fish'],['edit','✏ Edit'],['remove','🗑 Remove']];
    $('tabs').innerHTML=T.map(function(t){ return '<button type="button" data-t="'+t[0]+'" aria-pressed="'+(FILTER===t[0])+'">'+t[1]+' '+c[t[0]]+'</button>'; }).join('');
    $('count').textContent='· '+c.edit+' to edit · '+c.remove+' to remove'; }
  function shown(){ var q=Q.trim().toLowerCase(); return FISH.filter(function(f){ var m=FL[f.id]||{};
      if(FILTER==='edit'&&!m.edit) return false; if(FILTER==='remove'&&!m.remove) return false; if(FILTER!=='all'&&FILTER!=='edit'&&FILTER!=='remove'&&f.set!==FILTER) return false;
      return !q||(f.word+' '+f.ref+' '+f.id+' '+(f.top||'')+' '+(f.bot||'')).toLowerCase().indexOf(q)>=0; }); }
  function card(f){ var m=FL[f.id]||{};
    return '<div class="c'+(m.edit?' fe':'')+(m.remove?' fr':'')+'" data-id="'+esc(f.id)+'"><button class="thumb" type="button" data-open="1" aria-label="Look at '+esc(f.word)+'"><img loading="lazy" decoding="async" alt="" src="'+esc(src(f))+'" data-f="'+esc(f.img)+'"></button>'
      +'<div class="w">'+esc(f.word)+'</div><div class="id">'+esc(f.id)+' · '+esc(f.ref)+'</div>'
      +'<div class="chips"><label class="chip"><input type="checkbox" data-k="edit"'+(m.edit?' checked':'')+'> ✏ Edit</label><label class="chip r"><input type="checkbox" data-k="remove"'+(m.remove?' checked':'')+'> 🗑 Remove</label></div></div>'; }
  function draw(){ tabs(); var a=shown(); $('empty').hidden=a.length>0; $('grid').innerHTML=a.map(card).join(''); }
  // a fish picture that cannot be drawn by the server falls back to the saved one
  document.addEventListener('error',function(e){ var i=e.target; if(i&&i.tagName==='IMG'&&i.dataset.f&&i.getAttribute('src')!==i.dataset.f){ i.src=i.dataset.f; } },true);
  function save(id,k,v){ var m=FL[id]||(FL[id]={}); if(v) m[k]=true; else delete m[k]; if(!m.edit&&!m.remove) delete FL[id];
    var body={id:id}; body[k]=!!v; st('Saving…');
    fetch('/api/fish-flags',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){ FL=j.flags||{}; st('Saved ✓','ok'); tabs(); }).catch(function(){ st('Could not save that mark. Check your connection and tap it again.','err'); }); }
  function mark(el){ var c=el.closest('.c'); if(!c) return; var id=c.dataset.id, k=el.dataset.k, v=el.checked; c.classList.toggle(k==='edit'?'fe':'fr',v); save(id,k,v); var lbm=$('lb').querySelector('[data-lbid="'+id+'"]'); if(lbm){ lbm.querySelectorAll('input[data-k]').forEach(function(x){ if(x.dataset.k===k) x.checked=v; }); } }
  $('grid').addEventListener('change',function(e){ if(e.target.matches('input[data-k]')) mark(e.target); });
  $('grid').addEventListener('click',function(e){ var b=e.target.closest('[data-open]'); if(!b) return; look(b.closest('.c').dataset.id); });
  function look(id){ var f=byId[id], m=FL[id]||{};
    $('lbin').innerHTML='<div data-lbid="'+esc(id)+'"><div class="big"><img alt="" src="'+esc(src(f))+'" data-f="'+esc(f.img)+'"></div><h2>'+esc(f.word)+'</h2><p>'+esc(f.id)+' · '+esc(SETN[f.set])+' · '+esc(f.ref)+'</p>'+(f.verse?'<p class="v">“'+esc(f.verse)+'”</p>':'')
      +'<div class="chips"><label class="chip"><input type="checkbox" data-k="edit"'+(m.edit?' checked':'')+'> ✏ Edit</label><label class="chip r"><input type="checkbox" data-k="remove"'+(m.remove?' checked':'')+'> 🗑 Remove</label></div>'
      +'<div class="acts"><a class="btn" href="'+esc(editLink(f))+'" target="_blank" rel="noopener">Open in the edit sheet</a><a class="btn" href="/fish/?id='+esc(f.id)+'" target="_blank" rel="noopener">Open the fish page</a><button class="btn" type="button" data-x="1">Close</button></div></div>';
    $('lb').classList.add('on'); }
  $('lb').addEventListener('click',function(e){ if(e.target===$('lb')||e.target.closest('[data-x]')){ $('lb').classList.remove('on'); draw(); return; }
    if(e.target.matches('input[data-k]')){ var id=e.target.closest('[data-lbid]').dataset.lbid, k=e.target.dataset.k, v=e.target.checked; save(id,k,v); } });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&$('lb').classList.contains('on')){ $('lb').classList.remove('on'); draw(); } });
  $('tabs').addEventListener('click',function(e){ var b=e.target.closest('[data-t]'); if(!b) return; FILTER=b.dataset.t; draw(); });
  $('q').addEventListener('input',function(){ Q=this.value; draw(); });
  document.querySelector('.seg').addEventListener('click',function(e){ var b=e.target.closest('[data-m]'); if(!b) return; MODE=b.dataset.m; [].forEach.call(this.children,function(x){ x.setAttribute('aria-pressed',String(x===b)); }); draw(); });
  $('copy').addEventListener('click',function(){
    var line=function(f){ return f.id+' '+f.word+(f.set==='24'?' (the 24)':''); }, E=FISH.filter(function(f){ return (FL[f.id]||{}).edit; }), R=FISH.filter(function(f){ return (FL[f.id]||{}).remove; });
    var t='MannaFish fish review: '+E.length+' to edit, '+R.length+' to remove\n\nEDIT (fix the format by the 2 to 9 letter rules): '+(E.length?'\n'+E.map(line).join('\n'):'none')+'\n\nREMOVE: '+(R.length?'\n'+R.map(line).join('\n'):'none');
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){ st('Copied. Paste it to Claude.','ok'); },function(){ window.prompt('Copy this and paste it to Claude:',t); }); });
  Promise.all([fetch('/fish/catch.json').then(function(r){ return r.json(); }),fetch('/api/fish-flags').then(function(r){ return r.ok?r.json():{flags:{}}; }).catch(function(){ return {flags:{}}; })]).then(function(a){
    var C=a[0]; FL=a[1].flags||{}; var seen={};
    C.core.forEach(function(c){ FISH.push({id:c.k,word:c.title,ref:c.ref,set:'24',img:'/fish/en/'+c.k+'.svg'}); seen[c.k]=1; });
    Object.keys(C.fish).forEach(function(id){ var x=C.fish[id]; if(seen[id]) return; FISH.push({id:id,word:x.title,ref:x.ref,top:x.top,bot:x.bottom,verse:x.verse,set:id.charAt(0)==='W'?'new':id.charAt(0)==='X'?'design':'plan',img:'/fish/'+id+'.svg'}); });
    FISH.forEach(function(f){ byId[f.id]=f; }); draw(); st(FISH.length+' fish. Tick ✏ Edit to have a fish fixed by the standard, 🗑 Remove to take it out. Nothing changes until you tell Claude.'); })
  .catch(function(){ st('The fish list could not load. Please reload.','err'); });
})();
</script>
</body>
</html>
