<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today’s MannaFish</title>
<meta name="description" content="A MannaFish: a word, the verse it comes from, and the chapter to read.">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;1,400&family=Archivo:wght@400;700;800&display=swap">
<!-- Ken, 1 Nov: "I want all of them available": every fish now comes round in the daily email, and the ones outside the 24 open here,
     /fish/?id=W01a: the fish, its verse, the chapter to read, 🧺 Love it for a Hub, and share it. From /fish/catch.json (tools/fish/catch.py). -->
<style>
@font-face{font-family:'MFHobo';src:url(/fish-lang/hobo.woff2) format('woff2');font-display:block}
:root{--bg:#000;--card:#0b1620;--line:rgba(200,215,218,.18);--text:#eaf0f0;--dim:#9fb2b6;--blue:#2a5fb0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Archivo,system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line)}
.brand{font:400 1.45rem/1 'MFHobo',cursive;color:#fff;text-decoration:none}.brand b{font-weight:400;color:#448fff}header a.d{margin-left:auto;color:#8fb6ff;font-size:.92rem}
main{max-width:720px;margin:0 auto;padding:18px 16px 60px;text-align:center}
.k{font:800 .74rem Archivo,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#6f9bff;margin:6px 0 10px}
.fish{position:relative;width:100%;aspect-ratio:2/1;background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden}.fish svg{position:absolute;inset:0;width:100%;height:100%}
h1{font:400 2.6rem/1 'MFHobo',cursive;margin:16px 0 6px}
blockquote{font:italic 1.25rem/1.5 Spectral,Georgia,serif;margin:10px auto 6px;max-width:600px}
.ref{color:var(--dim);font-weight:700}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 0}
.row a,.row button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:11px 16px;font:800 .95rem Archivo,sans-serif;text-decoration:none;cursor:pointer}
.row .p{background:var(--blue);border-color:var(--blue)}
.empty{color:var(--dim);padding:40px 0}
.flip{display:grid;perspective:1600px;cursor:pointer;outline:none}.fc{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .6s;align-self:start}
.bk{transform:rotateY(180deg);background:#000;border:1px solid var(--line);border-radius:16px;padding:16px 14px;min-height:100%;cursor:default}.flip.on .fr{transform:rotateY(-180deg)}.flip.on .bk{transform:rotateY(0)}
.turn{margin:12px auto 0;display:block;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:9px 16px;font:800 .9rem Archivo,sans-serif;cursor:pointer}
.sw{font:400 2.4rem/1 'MFHobo',cursive;margin:4px 0 12px}.og{border:1px solid rgba(200,215,218,.35);border-radius:12px;padding:10px 12px;margin:0 auto 14px;max-width:520px}
.og .lg{font:800 .7rem Archivo,sans-serif;letter-spacing:.16em;color:#8fb3ff}.og .ow{font:400 2rem/1.3 'SBL Hebrew','Times New Roman',serif;margin:2px 0}.og .tr{color:var(--dim);font-size:.9rem}.og .def{font:italic .95rem/1.45 Spectral,Georgia,serif;margin:8px 0 0}
.hq{font:800 .82rem Archivo,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:6px 0 8px}.xr{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.xr a{border:1px solid var(--line);border-radius:999px;padding:6px 11px;color:#8fb3ff;text-decoration:none;font-weight:700;font-size:.88rem}
.deep{margin:14px auto 0;display:block;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font:800 .85rem Archivo,sans-serif;cursor:pointer}#deepOut{text-align:left;margin-top:10px}
h2{font:400 1.6rem 'MFHobo',cursive;margin:28px 0 10px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 10px}.tb button,.tb a{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:9px 14px;font:800 .9rem Archivo,sans-serif;text-decoration:none;cursor:pointer}
.c.sab{border-color:rgba(245,215,110,.45)}
.c>a{display:block;text-decoration:none;color:inherit}.ed{display:flex;gap:4px;justify-content:center;margin-top:6px}.ed a,.ed button{border:1px solid var(--line);background:none;color:var(--dim);border-radius:999px;padding:3px 8px;font:700 .72rem Archivo,sans-serif;text-decoration:none;cursor:pointer}
@media print{header,.tb,.ed{display:none!important}body{background:#fff;color:#000}main{max-width:none;padding:0}.g{grid-template-columns:repeat(4,1fr)}.c{break-inside:avoid;border-color:#bbb;background:#fff}.c b,.c small,h1,h2,blockquote,.k,.ref{color:#000}}
.c{display:block;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 6px 8px}.c img{display:block;width:100%;aspect-ratio:2/1;object-fit:contain;background:#000;border-radius:8px}.c b{display:block;font:400 1.15rem 'MFHobo',cursive;margin-top:4px}.c small{color:var(--dim);font-size:.75rem}
</style>
</head>
<body>
<header><a class="brand" href="/">Manna<b>Fish</b></a><a class="d" href="/?devo=1">Today’s devotional</a></header>
<main id="m"><p class="empty">Finding the fish…</p></main>
<script src="/fish-lang/basket.js" defer></script>
<script src="/fish-lang/feedback.js" defer></script>
<script src="/fish-lang/deep.js"></script>
<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var id=(new URLSearchParams(location.search).get('id')||'').replace(/[^A-Za-z0-9_-]/g,''), M=document.getElementById('m');
  // no fish named: the 153 (Ken, 1 Nov: "I want to see all 153 fish"), John 21:11 -- the 24 devotional fish, then the 129 in the Go Fish net
  //
  //Why 153 (Ken, 2 Nov): the net held 153 fish and did not tear (John 21:11). The breath of the Holy Spirit (John 20:22, "he breathed
  //on them, and saith unto them, Receive ye the Holy Ghost") answers Genesis 2:7, when God breathed into man the breath of life.
  //Peter, who denied Jesus, is restored by the fire ("Feed my sheep", John 21:15-17), and the commission renews God's first command,
  //increase and multiply (Genesis 1:28). Now the Holy Spirit keeps the net from tearing and the jars from leaking (the widow's oil,
  //2 Kings 4): we are no longer broken vessels that cannot hold the oil; in Christ we are made whole. The Kingdom is like a net cast
  //on the right side, gathering every kind of fish (Matthew 13:47).
  // ?year=1: 365 action fish, one for every day of the year (Ken, 2 Nov), from plan/year365.json (tools/year365): each reading day's
  // fish and each Sabbath's, printable, with ✏️ Edit and 💬 Change like the 153
  if(new URLSearchParams(location.search).get('year')){ document.title='365 action fish · MannaFish'; fetch('/plan/year365.json').then(function(r){ return r.json(); }).then(function(Y){
      var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], h='<div class="tb"><button type="button" onclick="print()">🖨 Print this list</button><a href="/plan/">📅 Bible in a Year</a><a href="/fish/">The 153</a></div><div class="k">Bible in a Year</div><h1>365 action fish</h1><p class="ref">One for every day: six reading days and a Sabbath each week. Tap a fish to open it.</p>', wk=0;
      Y.days.forEach(function(d){ if(d.week!==wk){ if(wk) h+='</div>'; wk=d.week; h+='<h2>'+(d.kind==='last'?'Day 365':'Week '+wk)+'</h2><div class="g">'; }
        var set=/^D/.test(d.k)?'daily':/^W/.test(d.k)?'new':'';
        h+='<div class="c'+(d.kind==='sabbath'?' sab':'')+'"><a href="'+d.href+'"><img loading="lazy" src="'+d.svg+'" alt=""><b>'+esc(d.word)+'</b><small>Day '+d.day+' · '+(d.kind==='sabbath'?'Sabbath':d.kind==='last'?'The last day':DN[d.dow])+' · '+esc(d.ref)+'</small></a>'
          +'<span class="ed"><a href="/edit/?find='+encodeURIComponent(d.word)+(set?'&set='+set:'&code=en')+'">✏️ Edit</a><button type="button" data-req="'+esc(d.word)+'" data-ref="'+esc(d.ref)+'">💬 Change</button></span></div>'; });
      M.innerHTML=h+'</div>'; }).catch(function(){ M.innerHTML='<p class="empty">Couldn’t open the year just now.</p>'; });
    M.addEventListener('click',function(e){ var b=e.target.closest('[data-req]'); if(!b) return; if(window.MFfeedback) MFfeedback.open({kind:'design',feature:'The fish',fish:b.dataset.req+' · '+b.dataset.ref}); });
    return; }
  if(!id){ document.title='The 153 · MannaFish'; Promise.all([fetch('/fish/catch.json').then(function(r){ return r.json(); }),fetch('/fish/series.json').then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; })]).then(function(z){ var C=z[0], U=null; if(z[1]&&z[1].use){ U={}; z[1].use.forEach(function(k){ U[k]=1; }); }   /* Ken, 8 Nov: only the action fish are shown */
      if(U){ C.net=C.net.filter(function(k){ return U[k]; }); C.designs=(C.designs||[]).filter(function(k){ return U[k]; }); }
      // Ken, 1 Nov: "a list of the fish designs as a printable or digital version where I might be able to edit the design or request changes":
      // 🖨 prints the list; on each fish ✏️ opens it on the edit sheet (/edit/), 💬 sends a change request (feedback, design)
      var card=function(src,href,w,ref,set){ return '<div class="c"><a href="'+href+'"><img loading="lazy" src="'+src+'" alt=""><b>'+esc(w)+'</b><small>'+esc(ref)+'</small></a>'
        +'<span class="ed">'+(set==='none'?'':'<a href="/edit/?find='+encodeURIComponent(w)+(set?'&set='+set:'&code=en')+'" title="Change the design on the edit sheet">✏️ Edit</a>')+'<button type="button" data-req="'+esc(w)+'" data-ref="'+esc(ref)+'" title="Ask for a change">💬 Change</button></span></div>'; };
      M.innerHTML='<div class="tb"><button type="button" onclick="print()">🖨 Print this list</button><a href="/edit/">✏️ Open the edit sheet</a><a href="/fish/?year=1">📅 365 action fish</a></div><div class="k">John 21:11</div><h1>The 153</h1><blockquote>“…full of great fishes, an hundred and fifty and three: and for all there were so many, yet was not the net broken.”</blockquote>'
        +'<h2>The 24 devotional fish</h2><div class="g">'+C.core.map(function(x){ return card('/fish/en/'+x.k+'.svg','/?w='+x.k.toLowerCase(),x.title,x.ref); }).join('')+'</div>'
        +'<h2>The other '+C.net.length+'</h2><div class="g">'+C.net.map(function(k){ var f=C.fish[k]; return f?card('/fish/'+k+'.svg','/fish/?id='+k,f.title,f.ref,/^D/.test(k)?'daily':'new'):''; }).join('')+'</div>'
        +(C.designs&&C.designs.length?'<h2>New designs</h2><p class="ref">Outside the 153</p><div class="g">'+C.designs.map(function(k){ var f=C.fish[k]; return f?card('/fish/'+k+'.svg','/fish/?id='+k,f.title,f.ref,/^D/.test(k)?'daily':'none'):''; }).join('')+'</div>':'')
        +'<p class="ref" style="margin-top:20px">'+(C.core.length+C.net.length)+' fish · every word in its own verse</p>'; })
    .catch(function(){ M.innerHTML='<p class="empty">Couldn’t open the net just now.</p>'; });
    M.addEventListener('click',function(e){ var b=e.target.closest('[data-req]'); if(!b) return; if(window.MFfeedback) MFfeedback.open({kind:'design',feature:'The fish',fish:b.dataset.req+' · '+b.dataset.ref}); });
    return; }
  // Ken, 3 Nov: every fish lives on the Today page -- a fish's own address goes there (?page=1 keeps this page, for the edit sheet's links)
  if(!/[?&]page=1/.test(location.search)){ location.replace('/?fish='+encodeURIComponent(id)+(/[?&]devo=1/.test(location.search)?'&devo=1':'')+(/[?&]flip=1/.test(location.search)?'&flip=1':'')); return; }
  Promise.all([fetch('/fish/catch.json').then(function(r){ return r.json(); }),fetch('/fish/'+id+'.svg').then(function(r){ if(!r.ok) throw 0; return r.text(); })]).then(function(a){
    var f=a[0].fish[id]; if(!f){ M.innerHTML='<p class="empty">This fish swam away. <a href="/">Today’s MannaFish</a></p>'; return; }
    document.title=f.title+' · MannaFish';
    var bid=(/^W/.test(id)?'Y:':/^X/.test(id)?'X:':'D:')+id;
    // Ken, 2 Nov: "on the desktop ... a picture of today's fish, but it doesn't flip" -- every fish turns over to its word study, like
    // the 24: the Hebrew or Greek word behind it (from the KJV's own alignment), what it means, Scriptures to look up, and Go deeper
    M.innerHTML='<div class="k">Today’s MannaFish</div><div class="flip" id="flip" role="button" tabindex="0" aria-label="Turn the fish over"><div class="fc fr"><div class="fish">'+a[1]+'</div></div><div class="fc bk" id="bk"><p class="ref">Opening the word study…</p></div></div>'
      +'<button type="button" class="turn" id="turn">↻ Turn it over: the word study</button><h1>'+esc(f.title)+'</h1>'
      +'<blockquote>“'+esc(f.verse)+'”</blockquote><div class="ref">'+esc(f.ref)+' ('+esc(f.ver||'KJV')+')</div>'
      +'<div class="row"><a class="p" href="/bible/?r='+encodeURIComponent(f.ref)+'">📖 Read the chapter</a><button type="button" id="love">🧺 Love</button><button type="button" id="share">↗ Share</button></div>'
      +'<div class="row"><a href="/?devo=1">Today’s devotional</a><a href="/hubs/">MannaFish Hubs</a></div>';
    var s=M.querySelector('.fish svg'); if(s) s.removeAttribute('style');
    var turned=false, built=false; function turn(){ turned=!turned; document.getElementById('flip').classList.toggle('on',turned); document.getElementById('turn').textContent=turned?'↻ Turn it back: the fish':'↻ Turn it over: the word study'; if(turned&&!built){ built=true; study(f); } }
    document.getElementById('flip').addEventListener('click',function(e){ if(e.target.closest('a,button')) return; turn(); });
    document.getElementById('flip').addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); turn(); } });
    document.getElementById('turn').onclick=turn; if(/[?&]flip=1/.test(location.search)) turn();
    document.getElementById('love').onclick=function(){ if(window.MFbasket) MFbasket.add({id:bid,word:f.title,ref:f.ref,svg:'/fish/'+id+'.svg'}); };
    document.getElementById('share').onclick=function(){ var t='“'+f.verse+'” '+f.ref, u=location.href; if(navigator.share) navigator.share({title:'MannaFish · '+f.title,text:t,url:u}).catch(function(){}); else if(navigator.clipboard) navigator.clipboard.writeText(t+' '+u); };
  }).catch(function(){ M.innerHTML='<p class="empty">Couldn’t find that fish. <a href="/">Today’s MannaFish</a></p>'; });
  // the back of a fish: built from the Bible files the site already has (fish-lang/bible: kjv, orig, lex, xref)
  function J(u){ return fetch(u).then(function(r){ if(!r.ok) throw 0; return r.json(); }); }
  function study(f){ var bk=document.getElementById('bk'), BOOKS=window.MFdeep?MFdeep.books:null, m=/^(.+?)\s+(\d+):(\d+)/.exec(f.ref||'');
    if(!BOOKS||!m){ bk.innerHTML='<p class="ref">The word study isn’t ready for this fish yet.</p>'; return; }
    var b=BOOKS.indexOf(m[1]), c=+m[2], v=+m[3], fn=m[1].replace(/ /g,'_'), ot=b<39, L=ot?{n:'Hebrew',l:'he',d:'rtl'}:{n:'Greek',l:'el',d:'ltr'};
    var w=String(f.title||'').toLowerCase(), base=w.replace(/e$/,'');
    Promise.all([J('/fish-lang/bible/kjv/'+fn+'-'+c+'.json').catch(function(){ return null; }),J('/fish-lang/bible/orig/'+fn+'-'+c+'.json').catch(function(){ return null; }),J('/fish-lang/bible/xref/'+fn+'.json').catch(function(){ return {}; })]).then(function(x){
      var text=x[0]&&x[0].t?x[0].t[v-1]||'':'', o=x[1]&&x[1].v?x[1].v[String(v)]:null, ow=null;
      if(o&&text){ var re=/[A-Za-z]+(?:'[A-Za-z]+)?/g, t, j=0; while((t=re.exec(text))){ var tl=t[0].toLowerCase(); if(!ow&&(tl===w||(base.length>=3&&tl.indexOf(base)===0))){ var i=o.a[j]; if(i!=null&&i>=0) ow=o.w[i]; } j++; } }
      var xr=(x[2][c+':'+v]||[]).slice(0,6), BK=function(r){ return BOOKS[r[0]]+' '+r[1]+':'+r[2]+(r[4]?'–'+r[4]:''); };
      var h='<div class="sw">'+esc(f.title)+'</div>';
      if(ow){ var sn=String(ow[3]).replace(/^([HG])0*(\d+).*$/,'$1$2');
        h+='<div class="og"><span class="lg">'+L.n+'</span><div class="ow" lang="'+L.l+'" dir="'+L.d+'">'+esc(String(ow[0]).replace(/[¶,.;:·]+$/,''))+'</div><div class="tr"><i>'+esc(ow[1])+'</i> · “'+esc(String(ow[2]).replace(/[<>¿\[\]]/g,'').replace(/\s+/g,' ').trim())+'” · Strong’s '+esc(sn)+'</div><p class="def" id="def"></p></div>'; }
      else h+='<p class="ref">This word has no '+L.n+' word of its own in the verse (the translators added it).</p>';
      h+='<div class="hq">Still hungry? Look up these Scriptures</div><div class="xr">'+(xr.length?xr.map(function(r){ var rf=BK(r); return '<a href="/bible/?r='+encodeURIComponent(rf)+'">'+esc(rf)+'</a>'; }).join(''):'<span class="ref">None listed for this verse</span>')+'</div>'
        +(ow?'<button type="button" class="deep" id="deep">Go deeper into the '+L.n+'</button><div id="deepOut"></div>':'');
      bk.innerHTML=h;
      if(ow){ var st=String(ow[3]), mm=/^([HG])(\d+)/.exec(st);
        if(mm) J('/fish-lang/bible/lex/'+mm[1]+Math.floor(+mm[2]/250)+'.json').then(function(d){ var e=d[st]||d[st.replace(/[A-Za-z]$/,'')]; if(e&&e.d){ var t=String(e.d); document.getElementById('def').textContent=t.length>240?t.slice(0,238).replace(/\s+\S*$/,'')+' …':t; } }).catch(function(){});
        document.getElementById('deep').onclick=function(){ var out=document.getElementById('deepOut'); if(out.innerHTML){ out.innerHTML=''; return; } out.innerHTML='<p class="ref">…</p>'; MFdeep.show(out,st,{}); }; }
    }).catch(function(){ bk.innerHTML='<p class="ref">Couldn’t open the word study just now.</p>'; }); }
})();
</script>
</body>
</html>
