<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MannaFish Ride</title>
<meta name="description" content="For drivers: talk, and your rider reads it on their phone or a back-seat screen, in their own language. They answer, and you hear it in yours.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Ken, 3 Nov: "an idea for Uber drivers ... they speak and it is written on a remote iPad or mobile device". Ride mode: the
     driver's phone listens, hands free, and translates; the rider scans a QR code (their own phone, or an iPad on the headrest)
     and reads every word big, in their language, and can have it said aloud. The rider answers by talking or typing, and the
     driver's phone says it out loud in the driver's language, so the driver never has to read while driving. Also for a deaf or
     hard-of-hearing rider in the same language: live captions. The lines pass through /api/ride; the hearing, translating and
     voices are the Translator's (/api/hear, /api/translate, /api/say). -->
<style>
:root{--ink:#000;--ink2:#0b1620;--foam:#eaf0f0;--dim:#9fb2b6;--blue:#2a5fb0;--blue2:#6f9be0;--line:rgba(200,215,218,.16);--red:#c8423c;--gold:#f5d76e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--foam)}
body{font:1rem/1.5 'Archivo',system-ui,sans-serif;display:flex;flex-direction:column;min-height:100dvh}
button,select,input{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.top a.back{font:600 .82rem 'Archivo',sans-serif;text-decoration:none;color:var(--foam);border:1px solid var(--line);border-radius:999px;padding:7px 12px;white-space:nowrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--foam);font-weight:800}.brand img{height:24px;width:auto;display:block}
.top .r{min-width:70px;text-align:right;font-size:.8rem;color:var(--dim)}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
h1{font:800 1.6rem/1.2 'Archivo',sans-serif;margin:6px 0 0;text-align:center}
.sub{color:var(--dim);text-align:center;margin:0}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:16px}
.pick{display:grid;gap:12px}
.pick button{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:1px solid var(--line);background:var(--ink2);border-radius:18px;padding:18px;cursor:pointer}
.pick button .ic{font-size:2rem}.pick button b{display:block;font-size:1.15rem}.pick button small{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.l{font-weight:700;font-size:.9rem;color:var(--dim)}
select,input[type=text]{border:1px solid var(--line);background:#000;border-radius:12px;padding:11px 12px;min-width:0}
select{flex:1}
.btn{border:0;border-radius:999px;background:var(--blue);color:#fff;padding:13px 20px;font-weight:800;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--foam)}
.btn.red{background:var(--red)}
.btn.big{width:100%;padding:16px;font-size:1.1rem}
.btn[disabled]{opacity:.5}
.code{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.qr{width:170px;height:170px;background:#fff;border-radius:14px;padding:8px}.qr svg,.qr img{width:100%;height:100%;display:block}
.code b{display:block;font:800 2.1rem/1 'Archivo',monospace;letter-spacing:.12em;color:#fff}.code small{color:var(--dim)}
@media (max-width:460px){.code{grid-template-columns:1fr;justify-items:center;text-align:center}.qr{width:200px;height:200px}}
.who{font-weight:700}.who.ok{color:#8ddca4}
.mic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;min-height:130px;border:0;border-radius:24px;background:var(--blue);color:#fff;font-weight:800;font-size:1.2rem;cursor:pointer}
.mic svg{width:44px;height:44px}.mic.on{background:#1f7a4d}.mic.on.work{background:#6b5a12}.mic.off{background:#333b44}
.mic small{font-weight:600;font-size:.85rem;opacity:.9}
.log{display:flex;flex-direction:column;gap:8px}
.ln{border-radius:14px;padding:10px 12px;background:var(--ink2);border:1px solid var(--line)}
.ln.me{border-color:rgba(42,95,176,.5)}.ln .o{color:var(--dim);font-size:.85rem}.ln .t{font-weight:700}
.ln .lb{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue2)}
.note{font-size:.85rem;color:var(--dim);text-align:center;margin:0}
.status{min-height:1.4em;text-align:center;color:var(--gold);font-weight:700}
/* the rider's screen: the words, big */
body.rider main{max-width:980px}
.caps{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;min-height:42vh}
.cap{opacity:.55;font-size:calc(var(--cs,1) * 1.25rem);line-height:1.35}
.cap.now{opacity:1;font-size:calc(var(--cs,1) * 2rem);font-weight:700}
.cap.me:last-child{opacity:.9}
.cap .o{display:block;font-size:.5em;font-weight:500;color:var(--dim);margin-top:4px}
.cap.me{color:var(--blue2);text-align:right}
.cap.me .o{text-align:right}
.wait{color:var(--dim);text-align:center;font-size:1.2rem;margin:auto 0}
.bar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}
.bar .mic{min-height:76px;flex-direction:row;font-size:1.05rem}.bar .mic svg{width:30px;height:30px}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tools button,.tools select{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 12px;font-size:.85rem;font-weight:700;cursor:pointer;flex:none}
.tools button[aria-pressed=true]{background:var(--blue);border-color:var(--blue)}
.typebox{display:flex;gap:8px}.typebox input{flex:1}
.end{text-align:center}.end .fish{display:block;max-width:420px;margin:12px auto;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:2/1}.end .fish img{width:100%;height:100%;object-fit:contain}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="/translate/">&larr; <span id="backLab">Translator</span></a>
  <a class="brand" href="/"><img src="/w/img/logo-email.png" alt="MannaFish" width="104" height="24"><span>Ride</span></a>
  <span class="r" id="topR"></span>
</header>
<main id="main"></main>
<script>
(function(){
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function get(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
  function put(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function sget(k){ try{ return sessionStorage.getItem(k)||''; }catch(e){ return ''; } }
  function sput(k,v){ try{ if(v) sessionStorage.setItem(k,v); else sessionStorage.removeItem(k); }catch(e){} }
  // the Translator's languages, each in its own words and in English
  var L={en:'English',es:'Español',tl:'Tagalog',zh:'中文',hi:'हिन्दी',el:'Ελληνικά',de:'Deutsch',ko:'한국어',he:'עברית',ar:'العربية',ru:'Русский',tr:'Türkçe',
    fr:'Français',pt:'Português',ht:'Kreyòl ayisyen',vi:'Tiếng Việt',ja:'日本語',it:'Italiano',pl:'Polski',uk:'Українська',fa:'فارسی',ur:'اردو',sw:'Kiswahili'};
  var EN={es:'Spanish',tl:'Tagalog',zh:'Chinese',hi:'Hindi',el:'Greek',de:'German',ko:'Korean',he:'Hebrew',ar:'Arabic',ru:'Russian',tr:'Turkish',
    fr:'French',pt:'Portuguese',ht:'Haitian Creole',vi:'Vietnamese',ja:'Japanese',it:'Italian',pl:'Polish',uk:'Ukrainian',fa:'Persian',ur:'Urdu',sw:'Swahili'};
  var RTL=/^(he|ar|fa|ur)$/;
  function full(c){ return L[c]?(L[c]+(EN[c]&&EN[c]!==L[c]?' – '+EN[c]:'')):c; }
  function opts(v){ return Object.keys(L).map(function(c){ return '<option value="'+c+'"'+(c===v?' selected':'')+'>'+esc(full(c))+'</option>'; }).join(''); }
  function guess(){ var n=String(navigator.language||'en').toLowerCase(); if(/^(fil|tl)/.test(n)) return 'tl'; n=n.slice(0,2); return L[n]?n:'en'; }
  // the rider's screen, in English or Spanish; the words themselves come in any of the languages
  var UI={en:{lang:'Your language',aloud:'🔊 Read it aloud',start:'Start',wait:'Your driver’s words will show here.',talk:'Tap to answer',stop:'Tap when done',
      type:'Type an answer',send:'Send',hear:'Listening…',work:'Translating…',bigger:'A+',end:'Thank you for riding. God bless you!',fish:'Today’s MannaFish, a word to carry with you',
      join:'Join a ride',code:'The code on the driver’s screen',go:'Join',bad:'That code was not found. Check it with your driver.',mic:'The microphone is not available. You can type instead.',joined:'Connected to your driver',lost:'Reconnecting…'},
    es:{lang:'Tu idioma',aloud:'🔊 Leerlo en voz alta',start:'Empezar',wait:'Las palabras de tu conductor aparecerán aquí.',talk:'Toca para responder',stop:'Toca al terminar',
      type:'Escribe una respuesta',send:'Enviar',hear:'Escuchando…',work:'Traduciendo…',bigger:'A+',end:'Gracias por viajar. ¡Dios te bendiga!',fish:'El MannaFish de hoy, una palabra para llevar contigo',
      join:'Unirse a un viaje',code:'El código en la pantalla del conductor',go:'Unirse',bad:'No se encontró ese código. Confírmalo con tu conductor.',mic:'El micrófono no está disponible. Puedes escribir.',joined:'Conectado con tu conductor',lost:'Reconectando…'}};
  function U(l){ return UI[l]||UI.en; }

  // ── speaking: the Translator's voices, one player (phones only play after a tap)
  var player=new Audio(), unlocked=false, SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  var IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
  function unlock(){ if(unlocked) return; unlocked=true; try{ player.src=SILENT; var p=player.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  function say(text,lang,cb){ var fin=false, done=function(){ if(fin) return; fin=true; if(cb) cb(); };
    var dev=function(){ done(); };   /* the natural voice could not play: end quietly, never the phone's own voice */
    try{ player.pause(); player.src='/api/say?t='+encodeURIComponent(text)+'&l='+encodeURIComponent(lang)+'&v='+encodeURIComponent((get('mf-voice','thunder')==='device'?'sage':get('mf-voice','thunder')));
      player.defaultPlaybackRate=player.playbackRate=([0.75,1,1.25,1.5,1.75].indexOf(+get('mf-speed','1.25'))>=0?+get('mf-speed','1.25'):1.25); player.onended=done; player.onerror=function(){ if(!fin) dev(); }; var p=player.play(); if(p&&p.catch) p.catch(function(){ if(!fin) dev(); }); }catch(e){ dev(); } }
  var WL=null;
  function wake(on){ try{ if(on&&!WL&&navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){ WL=l; l.addEventListener('release',function(){ WL=null; }); }).catch(function(){}); if(!on&&WL){ WL.release(); WL=null; } }catch(e){} }
  document.addEventListener('visibilitychange',function(){ if(!document.hidden&&RIDE.c){ wake(true); pollNow(); } });

  // ── hearing: a recording for each thing said, ended by a pause (the Translator's way)
  var MIC={stream:null,ctx:null,an:null,buf:null,rec:null,floor:0.01,state:'off',tick:null,t:0,spoke:0,quiet:0,once:false,onAudio:null,onState:null};
  function mime(){ var c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus']; for(var i=0;i<c.length;i++) if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(c[i])) return c[i]; return ''; }
  function live(){ return MIC.stream&&MIC.stream.getAudioTracks().some(function(t){ return t.readyState==='live'; }); }
  function getMic(){ if(live()) return Promise.resolve(MIC.stream);
    return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(function(st){ MIC.stream=st;
      try{ MIC.ctx=MIC.ctx||new (window.AudioContext||window.webkitAudioContext)(); var src=MIC.ctx.createMediaStreamSource(st); MIC.an=MIC.ctx.createAnalyser(); MIC.an.fftSize=1024; src.connect(MIC.an); MIC.buf=new Uint8Array(MIC.an.fftSize); }catch(e){ MIC.an=null; }
      return st; }); }
  function micOff(){ if(MIC.stream){ MIC.stream.getTracks().forEach(function(t){ t.stop(); }); MIC.stream=null; MIC.an=null; } }
  function level(){ if(!MIC.an) return 0.05; if(MIC.ctx.state==='suspended') MIC.ctx.resume(); MIC.an.getByteTimeDomainData(MIC.buf); var s=0; for(var i=0;i<MIC.buf.length;i++){ var x=(MIC.buf[i]-128)/128; s+=x*x; } return Math.sqrt(s/MIC.buf.length); }
  function recStart(){ var m=mime(), r, parts=[]; try{ r=m?new MediaRecorder(MIC.stream,{mimeType:m}):new MediaRecorder(MIC.stream); }catch(e){ r=new MediaRecorder(MIC.stream); }
    var type=(r.mimeType||m||'audio/webm').split(';')[0]; r.ondataavailable=function(e){ if(e.data&&e.data.size) parts.push(e.data); };
    r.onstop=function(){ if(r._keep&&parts.length&&MIC.onAudio) MIC.onAudio(new Blob(parts,{type:type}),type); }; MIC.rec=r; r.start(); MIC.t=Date.now(); MIC.spoke=0; MIC.quiet=0; }
  function recStop(keep){ var r=MIC.rec; if(!r) return; MIC.rec=null; r._keep=keep; if(r.state!=='inactive') r.stop(); }
  function setState(s){ MIC.state=s; if(MIC.onState) MIC.onState(s); }
  function listen(){ if(MIC.state==='off') return; if(!live()){ getMic().then(function(){ if(MIC.state!=='off') listen(); }).catch(function(){ micStop(); if(MIC.onState) MIC.onState('nomic'); }); return; }
    recStart(); setState('listen'); }
  function tick(){ if(MIC.state!=='listen') return; var v=level(), loud=v>Math.max(0.03,MIC.floor*3); if(!loud) MIC.floor=MIC.floor*0.97+v*0.03;
    if(loud){ MIC.spoke+=100; MIC.quiet=0; } else MIC.quiet+=100; var held=Date.now()-MIC.t;
    if(MIC.spoke>=300&&(MIC.quiet>=1300||held>40000)){ setState('work'); recStop(true); return; }
    if(!MIC.spoke&&held>12000){ if(MIC.once){ micStop(); return; } recStop(false); recStart(); }
    if(MIC.spoke&&MIC.spoke<300&&MIC.quiet>=1500) MIC.spoke=0; }
  function micStart(once){ if(!navigator.mediaDevices||!window.MediaRecorder){ if(MIC.onState) MIC.onState('nomic'); return; }
    MIC.once=!!once; setState('start'); clearInterval(MIC.tick); MIC.tick=setInterval(tick,100); listen(); }
  function micStop(){ clearInterval(MIC.tick); recStop(false); micOff(); setState('off'); }
  // done with one thing said: listen again (the driver), or stop (the rider answers once each tap)
  function micNext(){ if(MIC.state==='off') return; if(MIC.once){ micStop(); return; } setTimeout(function(){ if(MIC.state!=='off'&&MIC.state!=='pause') listen(); },250); }
  // something said aloud: the mic stops first, so it does not hear itself (an iPhone then plays through its loud speaker)
  function sayAloud(text,lang,cb){ var was=MIC.state; if(was==='listen'){ recStop(false); setState('pause'); if(IOS) micOff(); }
    say(text,lang,function(){ if(was==='listen'&&MIC.state==='pause'){ setState('work'); micNext(); } if(cb) cb(); }); }
  function hear(blob,type,from,to){ var q='lang='+from+(to&&to!==from?'&to='+to:'');
    return fetch('/api/hear?'+q,{method:'POST',headers:{'content-type':type},body:blob}).then(function(r){ if(!r.ok) throw r.status; return r.json(); })
      .then(function(j){ var said=String(j.text||'').trim(); if(!said) return null; if(!to||to===from) return {said:said,tr:''};
        if(j.tr&&j.tr.text) return {said:said,tr:j.tr.text}; return trans(said,from,to).then(function(t){ return {said:said,tr:t}; }); }); }
  function trans(text,from,to){ return fetch('/api/translate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:text,from:from,to:to})})
      .then(function(r){ return r.ok?r.json():{}; }).then(function(j){ return j.text||''; }).catch(function(){ return ''; }); }

  // ── the ride: a code, and the lines passed between the two screens
  var RIDE={c:'',me:'',them:'',last:0,q:Promise.resolve(),pt:null,quiet:0,mine:'en',theirs:'',on:false};
  function newCode(){ var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', a=new Uint8Array(6), s=''; (window.crypto||{getRandomValues:function(x){ for(var i=0;i<x.length;i++) x[i]=Math.random()*256; return x; }}).getRandomValues(a); for(var i=0;i<6;i++) s+=A[a[i]%A.length]; return s; }
  function send(m){ var body=JSON.stringify({c:RIDE.c,s:RIDE.me,m:m}); RIDE.q=RIDE.q.then(function(){ return fetch('/api/ride',{method:'POST',headers:{'content-type':'application/json'},body:body}).catch(function(){}); }); return RIDE.q; }
  function pollNow(){ clearTimeout(RIDE.pt); poll(); }
  function poll(){ if(!RIDE.on) return;
    fetch('/api/ride?c='+RIDE.c+'&s='+RIDE.them+'&after='+RIDE.last,{cache:'no-store'}).then(function(r){ return r.ok?r.json():{list:[]}; }).then(function(j){ lostUI(false);
        (j.list||[]).forEach(function(m){ if(m.i<=RIDE.last) return; RIDE.last=m.i; onLine(m); }); RIDE.quiet=(j.list||[]).length?0:RIDE.quiet+1; next(); })
      .catch(function(){ lostUI(true); next(); });
    function next(){ clearTimeout(RIDE.pt); if(RIDE.on) RIDE.pt=setTimeout(poll,document.hidden?5000:RIDE.quiet>60?2500:1000); } }
  function lostUI(on){ var e=$('lost'); if(e) e.hidden=!on; }
  function onLine(m){ if(RIDE.me==='d') driverLine(m); else riderLine(m); }

  // ── the driver
  function driverPick(){ RIDE.me=''; $('main').innerHTML='<h1>Ride</h1><p class="sub">Talk, and your rider reads it on their phone or a back-seat screen, in their own language. They answer, and you hear it in yours.</p>'
    +'<div class="pick"><button type="button" id="pD"><span class="ic">🚗</span><span><b>I’m the driver</b><small>Show a code your rider scans</small></span></button>'
    +'<button type="button" id="pR"><span class="ic">🧑</span><span><b>I’m the rider</b><small>Type the code from the driver’s screen</small></span></button></div>'
    +'<p class="note">For a rider who speaks another language, and for a deaf or hard-of-hearing rider (live captions in the same language).</p>';
    $('pD').onclick=function(){ unlock(); driverStart(); }; $('pR').onclick=function(){ riderCode(); }; }
  function driverStart(){ var saved=sget('mf-ride-d'); RIDE.c=saved||newCode(); sput('mf-ride-d',RIDE.c); RIDE.me='d'; RIDE.them='r'; RIDE.last=0;
    RIDE.mine=get('mf-ride-mine','')||(get('mf-tr-pair','').split(',')[0])||guess(); if(!L[RIDE.mine]) RIDE.mine='en'; RIDE.theirs=''; RIDE.on=true;
    var link=location.origin+'/ride/?j='+RIDE.c;
    $('main').innerHTML='<div class="card"><div class="code"><div class="qr" id="qr"><img alt="QR code for this ride" src="/api/ride?qr='+RIDE.c+'"></div>'
      +'<div><small>Your rider scans this, or opens <span style="color:var(--foam);font-weight:700">'+esc(location.host)+'/ride</span> and types</small><b id="dCode">'+RIDE.c+'</b>'
      +'<div class="row" style="margin-top:10px"><button type="button" class="btn ghost" id="dShare">📤 Send the link</button><button type="button" class="btn ghost" id="dHide">Hide the code</button></div></div></div></div>'
      +'<div class="row"><label class="l" for="dLang">I speak</label><select id="dLang">'+opts(RIDE.mine)+'</select></div>'
      +'<p class="who" id="who">Waiting for your rider to scan…</p>'
      +'<button type="button" class="mic off" id="dMic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg><span id="dMicL">Start listening</span><small id="dMicS">Then just talk. Your rider’s answers are said out loud.</small></button>'
      +'<p class="status" id="status"></p><p class="note" id="lost" hidden>Reconnecting…</p>'
      +'<div class="log" id="log"></div>'
      +'<p class="note">Keep this page on the screen while you talk: phones stop the microphone when you switch apps. Eyes on the road: it listens and speaks, so there is nothing to read.</p>'
      +'<button type="button" class="btn red big" id="dEnd">End ride</button>';
    $('topR').textContent='Driver';
    $('dLang').onchange=function(){ RIDE.mine=this.value; put('mf-ride-mine',RIDE.mine); send({t:'hi',l:RIDE.mine}); };
    $('dShare').onclick=function(){ if(navigator.share) navigator.share({title:'MannaFish Ride',url:link}).catch(function(){}); else { try{ navigator.clipboard.writeText(link); $('status').textContent='Link copied'; }catch(e){} } };
    $('dHide').onclick=function(){ var c=document.querySelector('.code'); var h=!c.classList.contains('min'); c.classList.toggle('min',h); $('qr').hidden=h; this.textContent=h?'Show the code':'Hide the code'; };
    $('dMic').onclick=function(){ unlock(); if(MIC.state==='off'){ wake(true); micStart(false); } else micStop(); };
    $('dEnd').onclick=function(){ if(!confirm('End this ride?')) return; send({t:'bye'}); micStop(); RIDE.on=false; sput('mf-ride-d',''); wake(false); $('topR').textContent=''; driverPick(); };
    MIC.onState=function(s){ var b=$('dMic'); if(!b) return; b.className='mic'+(s==='off'?' off':s==='nomic'?' off':' on')+(s==='work'||s==='pause'?' work':'');
      $('dMicL').textContent=s==='off'?'Start listening':s==='nomic'?'The microphone is not available':s==='work'?'Translating…':s==='pause'?'🔊 Your rider says…':'Listening… tap to pause';
      $('dMicS').textContent=s==='off'?'Then just talk. Your rider’s answers are said out loud.':s==='nomic'?'Allow the microphone for this site, then tap again.':RIDE.theirs?'To '+full(RIDE.theirs):'Your rider has not joined yet'; };
    MIC.onAudio=function(blob,type){ var to=RIDE.theirs||RIDE.mine;
      hear(blob,type,RIDE.mine,to).then(function(o){ if(o){ send({t:'say',said:o.said,sl:RIDE.mine,tr:o.tr,tl:to}); logLine('me',o.said,o.tr); } micNext(); })
        .catch(function(){ $('status').textContent='Not heard. Say it again.'; micNext(); }); };
    send({t:'hi',l:RIDE.mine}); poll(); wake(true); }
  function logLine(who,said,tr){ var g=$('log'); if(!g) return; var d=document.createElement('div'); d.className='ln '+who;
    d.innerHTML='<div class="lb">'+(who==='me'?'You':'Rider')+'</div><div class="t">'+esc(who==='me'?said:(tr||said))+'</div>'+((who==='me'?tr:(tr?said:''))?'<div class="o">'+esc(who==='me'?tr:said)+'</div>':'');
    g.insertBefore(d,g.firstChild); while(g.children.length>12) g.removeChild(g.lastChild); }
  function driverLine(m){ if(m.t==='hi'&&m.l){ var first=!RIDE.theirs; RIDE.theirs=m.l; $('who').textContent='✓ Rider connected · '+full(m.l)+(m.l===RIDE.mine?' (captions)':''); $('who').className='who ok';
      if(first&&!$('qr').hidden) $('dHide').click(); if(MIC.onState) MIC.onState(MIC.state); return; }
    if(m.t==='say'){ var text=m.tr||m.said; logLine('them',m.said,m.tr); if(text) sayAloud(text,m.tl||RIDE.mine); return; }
    if(m.t==='bye'){ $('who').textContent='Your rider closed their screen'; $('who').className='who'; } }

  // ── the rider (their phone, or an iPad on the headrest)
  function riderCode(){ $('main').innerHTML='<h1>'+esc(U(guess()).join)+'</h1><div class="card"><label class="l" for="rCode">'+esc(U(guess()).code)+'</label>'
      +'<div class="typebox" style="margin-top:8px"><input type="text" id="rCode" maxlength="6" autocapitalize="characters" autocomplete="off" style="font-size:1.6rem;letter-spacing:.15em;text-transform:uppercase"><button type="button" class="btn" id="rGo">'+esc(U(guess()).go)+'</button></div><p class="status" id="status"></p></div>';
    $('rCode').focus(); var go=function(){ var c=$('rCode').value.toUpperCase().replace(/[^A-Z0-9]/g,''); if(!/^[A-HJ-NP-Z2-9]{6}$/.test(c)){ $('status').textContent=U(guess()).bad; return; } location.href='/ride/?j='+c; };
    $('rGo').onclick=go; $('rCode').onkeydown=function(e){ if(e.key==='Enter') go(); }; }
  function riderJoin(c){ RIDE.c=c; RIDE.me='r'; RIDE.them='d'; RIDE.mine=get('mf-ride-rider','')||guess(); if(!L[RIDE.mine]) RIDE.mine='en'; document.body.classList.add('rider');
    var T=U(RIDE.mine); $('topR').textContent=c; $('backLab').textContent='MannaFish'; document.querySelector('.top a.back').href='/';
    $('main').innerHTML='<div class="card"><label class="l" for="rLang">'+esc(T.lang)+'</label><div class="row" style="margin-top:8px"><select id="rLang">'+opts(RIDE.mine)+'</select></div>'
      +'<div class="row" style="margin-top:12px"><label class="row"><input type="checkbox" id="rAloud" checked style="width:22px;height:22px"> <span>'+esc(T.aloud)+'</span></label></div>'
      +'<button type="button" class="btn big" id="rStart" style="margin-top:14px">'+esc(T.start)+'</button></div>';
    $('rLang').onchange=function(){ RIDE.mine=this.value; put('mf-ride-rider',RIDE.mine); riderJoin(c); };
    $('rStart').onclick=function(){ unlock(); RIDE.aloud=$('rAloud').checked; riderLive(); }; }
  function riderLive(){ var T=U(RIDE.mine); RIDE.on=true; RIDE.last=0;
    $('main').innerHTML='<div class="tools"><select id="rLang2" aria-label="'+esc(T.lang)+'">'+opts(RIDE.mine)+'</select><button type="button" id="rAl" aria-pressed="'+!!RIDE.aloud+'">'+esc(T.aloud)+'</button><button type="button" id="rBig">'+esc(T.bigger)+'</button></div>'
      +'<p class="note" id="lost" hidden>'+esc(T.lost)+'</p>'
      +'<div class="caps" id="caps" aria-live="polite" lang="'+RIDE.mine+'" dir="'+(RTL.test(RIDE.mine)?'rtl':'auto')+'"><p class="wait" id="rWait">'+esc(T.wait)+'</p></div>'
      +'<p class="status" id="status"></p>'
      +'<div class="bar"><button type="button" class="mic" id="rMic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg><span id="rMicL">'+esc(T.talk)+'</span></button>'
      +'<button type="button" class="btn ghost" id="rKb" aria-label="'+esc(T.type)+'">⌨</button></div>'
      +'<div class="typebox" id="rType" hidden><input type="text" id="rIn" placeholder="'+esc(T.type)+'" autocomplete="off"><button type="button" class="btn" id="rSend">'+esc(T.send)+'</button></div>';
    var cs=+get('mf-ride-cs',1)||1; $('caps').style.setProperty('--cs',cs);
    $('rBig').onclick=function(){ cs=cs>=1.6?0.8:Math.round((cs+0.2)*10)/10; put('mf-ride-cs',cs); $('caps').style.setProperty('--cs',cs); };
    $('rAl').onclick=function(){ RIDE.aloud=!RIDE.aloud; this.setAttribute('aria-pressed',String(RIDE.aloud)); if(!RIDE.aloud){ try{ player.pause(); }catch(e){} } };
    $('rLang2').onchange=function(){ RIDE.mine=this.value; put('mf-ride-rider',RIDE.mine); send({t:'hi',l:RIDE.mine}); riderLive(); };
    $('rKb').onclick=function(){ $('rType').hidden=!$('rType').hidden; if(!$('rType').hidden) $('rIn').focus(); };
    var sendText=function(){ var t=$('rIn').value.trim(); if(!t) return; $('rIn').value=''; riderSays(t); };
    $('rSend').onclick=sendText; $('rIn').onkeydown=function(e){ if(e.key==='Enter') sendText(); };
    MIC.onState=function(s){ var b=$('rMic'); if(!b) return; b.className='mic'+(s==='listen'||s==='start'?' on':s==='work'?' on work':'');
      $('rMicL').textContent=s==='listen'||s==='start'?T.stop:s==='work'?T.work:T.talk; if(s==='nomic'){ $('status').textContent=T.mic; $('rType').hidden=false; } };
    $('rMic').onclick=function(){ unlock(); if(MIC.state==='listen'){ setState('work'); recStop(true); return; } if(MIC.state==='off') micStart(true); };
    MIC.onAudio=function(blob,type){ var to=RIDE.theirs||RIDE.mine;
      hear(blob,type,RIDE.mine,to).then(function(o){ if(o){ send({t:'say',said:o.said,sl:RIDE.mine,tr:o.tr,tl:to}); capLine('me',o.said,''); } micNext(); })
        .catch(function(){ $('status').textContent='…'; micNext(); }); };
    send({t:'hi',l:RIDE.mine}); poll(); wake(true); }
  function riderSays(t){ var to=RIDE.theirs||RIDE.mine; capLine('me',t,'');
    (to===RIDE.mine?Promise.resolve(''):trans(t,RIDE.mine,to)).then(function(tr){ send({t:'say',said:t,sl:RIDE.mine,tr:tr,tl:to}); }); }
  function capLine(who,big,small){ var g=$('caps'); if(!g) return; var w=$('rWait'); if(w) w.remove(); var d=document.createElement('div'); d.className='cap'+(who==='me'?' me':' now'); if(who!=='me') [].forEach.call(g.querySelectorAll('.cap.now'),function(x){ x.classList.remove('now'); });
    d.innerHTML=esc(big)+(small?'<span class="o">'+esc(small)+'</span>':''); g.appendChild(d); while(g.children.length>6) g.removeChild(g.firstChild); d.scrollIntoView({block:'end',behavior:'smooth'}); }
  function riderLine(m){ var T=U(RIDE.mine);
    if(m.t==='hi'&&m.l){ RIDE.theirs=m.l; $('status').textContent='✓ '+T.joined; setTimeout(function(){ if($('status')&&$('status').textContent==='✓ '+T.joined) $('status').textContent=''; },3000); return; }
    if(m.t==='say'){ var mineTr=m.tl===RIDE.mine&&m.tr, big=mineTr?m.tr:m.said;
      // the driver spoke before this language was chosen (or changed): the words are translated here
      if(!mineTr&&m.sl&&m.sl!==RIDE.mine){ trans(m.said,m.sl,RIDE.mine).then(function(t){ capLine('them',t||m.said,t?m.said:''); if(t&&RIDE.aloud) sayAloud(t,RIDE.mine); }); return; }
      capLine('them',big,mineTr?m.said:''); if(RIDE.aloud&&big) sayAloud(big,RIDE.mine); return; }
    if(m.t==='bye'){ RIDE.on=false; micStop(); wake(false); clearTimeout(RIDE.pt);
      $('main').innerHTML='<div class="end"><h1>'+esc(T.end)+'</h1><p class="sub">'+esc(T.fish)+'</p><a class="fish" href="/" id="rFish"><img alt="Today’s MannaFish" id="rFishImg"></a><a class="btn big" href="/">MannaFish</a></div>';
      fetch('/api/ride?today=1').then(function(r){ return r.ok?r.json():null; }).then(function(f){ if(f&&f.img){ $('rFishImg').src=f.img; $('rFishImg').alt=f.title+' · '+f.ref; $('rFish').href=f.url; } else $('rFish').hidden=true; }).catch(function(){ $('rFish').hidden=true; }); } }

  var j=(new URLSearchParams(location.search).get('j')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(/^[A-HJ-NP-Z2-9]{6}$/.test(j)) riderJoin(j); else if(new URLSearchParams(location.search).get('join')) riderCode(); else if(sget('mf-ride-d')) driverStart(); else driverPick();
})();
</script>
</body>
</html>
