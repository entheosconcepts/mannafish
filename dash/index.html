<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MannaFish · My dashboard</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Spectral:ital,wght@0,400;1,400&family=Archivo:wght@400;600;700;800&display=swap">
<script src="/fish-lang/tabbar.js" defer></script>
<script src="/fish-lang/account.js" defer></script>
<!-- Ken, 13 Nov: "let the user select what's on their dashboard, like my dashboard (the CRM's tiles): an icon for the Bible, the memory game, the prayer list, or the options
     under the three dots ... maybe even a priority list and a calendar they can use with reminders". The ✕ in the Bible app comes here. What is on the dashboard, the
     priority list and the calendar are kept on the phone (mf-dash, mf-prio) and with the account when signed in (fish-lang/account.js BLOBS dash, prio). -->
<style>
@font-face{font-family:'MFHobo';src:url(/fish-lang/hobo.woff2) format('woff2');font-display:block}
:root{--bg:#05080b;--card:#0e1116;--card2:#161a21;--line:rgba(200,215,218,.16);--text:#eaf0f0;--dim:#9fb2b6;--blue:#2a5fb0;--blue2:#448ff1;--gold:#f5d76e;--ok:#7fd18b;color-scheme:dark}
:root[data-mode=light]{--bg:#f7f5ef;--card:#fff;--card2:#ece9df;--line:rgba(30,40,50,.16);--text:#1c2228;--dim:#5b6670;--blue:#2a5fb0;--blue2:#2a5fb0;--gold:#a87b00;--ok:#2f8a3c;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.5 'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 0 4px}
.brand{font:400 1.6rem/1 'MFHobo',cursive;text-decoration:none;color:#fff}.brand b{font-weight:400;color:var(--blue2)}:root[data-mode=light] .brand{color:#14181d}
.ib{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--text);text-decoration:none}
h1{font:600 1.9rem/1.15 'Fraunces',Georgia,serif;text-align:center;margin:18px 0 2px}.sub{text-align:center;color:var(--dim);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;margin:12px 0 18px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;padding:12px 8px;border:1px solid var(--line);background:var(--card);border-radius:16px;color:var(--text);text-decoration:none;text-align:center;cursor:pointer;font:700 .85rem/1.2 Archivo,sans-serif}
.tile:hover{background:var(--card2);border-color:var(--blue2)}.tile .ic{font-size:2rem;line-height:1}
.tile .x,.tile .mv{display:none;position:absolute;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:.8rem;cursor:pointer;align-items:center;justify-content:center;padding:0}
.edit .tile .x{display:flex;top:-8px;right:-8px}.edit .tile .mv.l{display:flex;bottom:-8px;left:-8px}.edit .tile .mv.r{display:flex;bottom:-8px;right:-8px}
.edit .tile{border-style:dashed;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.edit .panel h2{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.hd{color:var(--dim)}.panel.over,.tile.over{outline:2px solid var(--blue2);outline-offset:2px}.ghost{position:fixed;z-index:90;pointer-events:none;opacity:.88;box-shadow:0 14px 34px -8px rgba(0,0,0,.7);transform:scale(1.04)}.tile.lift,.panel.lift{opacity:.35}.tile.add{border-style:dashed;color:var(--blue2)}
.bar2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 6px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin:6px 0 30px}
.panel{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px 14px 16px}.panel h2{margin:0 0 8px;font:600 1.15rem 'Fraunces',Georgia,serif}
.add{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}.add input[type=text]{flex:1;min-width:200px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 11px}.add input[type=date],.add input[type=time]{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 8px;color-scheme:inherit}
.add button{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer}
.it{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line)}.it.done span{text-decoration:line-through;opacity:.5}.it input{width:20px;height:20px;flex:none}.it span{flex:1}.it small{color:var(--dim);white-space:nowrap}.it button{border:0;background:none;color:var(--dim);cursor:pointer;font-size:1rem;padding:2px 6px}
.empty{color:var(--dim);text-align:center;padding:14px 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal b{font:700 .7rem Archivo;color:var(--dim)}
.cal button{border:1px solid transparent;background:none;border-radius:10px;padding:7px 0;cursor:pointer;position:relative}.cal button.today{border-color:var(--blue2)}.cal button.sel{background:var(--blue);color:#fff}.cal button i{position:absolute;bottom:2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold)}
.cn{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}.cn b{font:600 1rem 'Fraunces',serif}
.pick{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}.pick[hidden]{display:none}
.pick .in{width:min(560px,100%);max-height:80vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px;margin:0}
.pick .row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 4px;cursor:pointer}.pick .row .ic{font-size:1.5rem}
body.mftabbed{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="brand" href="/">Manna<b>Fish</b></a><span><button type="button" class="ib" id="modeB" aria-label="Light or dark">&#9728;&#xFE0E;</button></span></div>
  <h1 id="hi">Hello</h1><p class="sub">Your MannaFish, the way you want it. <span id="hint" style="display:none">Press and drag an icon or a section’s title to move it.</span></p>
  <div class="bar2"><button type="button" class="ib" id="editB">&#9998;&#xFE0E; Edit my dashboard</button></div>
  <div class="grid" id="grid"></div>
  <div class="panels" id="panels"></div>
</div>
<div class="pick" id="pick" hidden><div class="in" id="pickIn"></div></div>
<script>
(function(){
  var $=function(i){ return document.getElementById(i); };
  function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){} return null; }
  function get(k,d){ try{ var v=JSON.parse(ls(k)||'null'); return v==null?d:v; }catch(e){ return d; } }
  function put(k,v){ ls(k,JSON.stringify(v)); if(window.MFacct&&MFacct.touch) try{ MFacct.touch(k==='mf-dash'?'dash':'prio'); }catch(e){} }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  if(ls('mf-mode')==='light') document.documentElement.setAttribute('data-mode','light');
  $('modeB').addEventListener('click',function(){ var l=document.documentElement.getAttribute('data-mode')!=='light'; if(l) document.documentElement.setAttribute('data-mode','light'); else document.documentElement.removeAttribute('data-mode'); ls('mf-mode',l?'light':'dark'); });
  // everything a person can put on their dashboard
  var ALL=[['bible','✝️','The Bible','/bible/'],['today','🐟','Today’s MannaFish','/?today=1'],['gofish','🎣','Go Fish','/?today=1&do=gofish'],['memory','🃏','Memory game','/go/'],
    ['pray','🕊️','Time with God','/pray/'],['prayers','🙏','My prayers','/you/#pr'],['plans','📖','Bible in a Year','/plan/'],['favs','🧺','My favorite fish','/?today=1&do=favs'],
    ['notes','📝','My notes','/you/#no'],['hl','🖍️','My highlights','/you/#hl'],['translate','💬','Translator','/translate/'],['hubs','📍','MannaFish Hubs','/hubs/'],
    ['stories','🐠','Fish stories','/?today=1&do=stories'],['vision','▶️','The vision','/?today=1&do=vision'],['tour','✨','Take a tour','/?today=1&do=tour'],['me','⚙️','Settings','/you/#st'],
    ['prio','✅','Priority list','#prio'],['cal','📅','Calendar','#cal']];
  var DEF=['bible','today','gofish','memory','pray','prayers','plans','prio','cal','me'];
  var EDIT=false;
  function mine(){ var a=get('mf-dash',null); a=Array.isArray(a)?a.filter(function(id){ return ALL.some(function(t){ return t[0]===id; }); }):null; return a&&a.length?a:DEF.slice(); }
  function tile(id){ return ALL.filter(function(t){ return t[0]===id; })[0]; }
  function draw(){ var M=mine(); document.body.classList.toggle('edit',EDIT); $('editB').textContent=EDIT?'✓ Done':'✎ Edit my dashboard'; $('hint').style.display=EDIT?'inline':'none';
    $('grid').innerHTML=M.map(function(id,i){ var t=tile(id); var inner='<span class="ic">'+t[1]+'</span><span>'+esc(t[2])+'</span>'+(EDIT?'<button type="button" class="x" data-x="'+id+'" aria-label="Take off">✕</button>'+(i>0?'<button type="button" class="mv l" data-m="'+i+'" data-d="-1" aria-label="Move left">◀</button>':'')+(i<M.length-1?'<button type="button" class="mv r" data-m="'+i+'" data-d="1" aria-label="Move right">▶</button>':''):'');
      return /^#/.test(t[3])?'<div class="tile" data-id="'+id+'" role="button" tabindex="0" data-go="'+t[3]+'">'+inner+'</div>':'<a class="tile" data-id="'+id+'" href="'+t[3]+'" draggable="false">'+inner+'</a>'; }).join('')+(EDIT?'<div class="tile add" role="button" tabindex="0" data-add="1"><span class="ic">＋</span><span>Add</span></div>':'');
    panels(M); }
  $('grid').addEventListener('click',function(e){ var x=e.target.closest('[data-x]'), m=e.target.closest('[data-m]'), a=e.target.closest('[data-add]'), g=e.target.closest('[data-go]');
    if(x){ e.preventDefault(); put('mf-dash',mine().filter(function(id){ return id!==x.dataset.x; })); draw(); return; }
    if(m){ e.preventDefault(); var M=mine(), i=+m.dataset.m, j=i+(+m.dataset.d), t=M[i]; M[i]=M[j]; M[j]=t; put('mf-dash',M); draw(); return; }
    if(a){ var have=mine(), left=ALL.filter(function(t){ return have.indexOf(t[0])<0; });
      $('pickIn').innerHTML='<h2 style="margin:4px 4px 8px;font:600 1.2rem Fraunces,serif">Add to my dashboard</h2>'+(left.length?left.map(function(t){ return '<button type="button" class="row" data-pick="'+t[0]+'"><span class="ic">'+t[1]+'</span><b>'+esc(t[2])+'</b></button>'; }).join(''):'<p class="empty">Everything is already on your dashboard.</p>')+'<button type="button" class="ib" style="margin:10px 4px 0" data-pick="">Close</button>'; $('pick').hidden=false; return; }
    if(g&&!EDIT){ var el=$(g.dataset.go.slice(1)+'P'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); } });
  $('pick').addEventListener('click',function(e){ var p=e.target.closest('[data-pick]'); if(e.target===$('pick')||(p&&p.dataset.pick==='')){ $('pick').hidden=true; return; } if(p){ var M=mine(); M.push(p.dataset.pick); put('mf-dash',M); $('pick').hidden=true; draw(); } });
  $('editB').addEventListener('click',function(){ EDIT=!EDIT; draw(); });
  /* Ken, 13 Nov: "make it easy for users to shift icons or move sections around": in edit mode press a tile (or a section's heading) and drag it; it is placed where you let go */
  (function(){ var D=null;
    function itemAt(x,y,kind){ var els=document.elementsFromPoint(x,y); for(var i=0;i<els.length;i++){ var e=els[i].closest&&els[i].closest(kind); if(e&&e.dataset.id&&!e.classList.contains('ghost')) return e; } return null; }
    document.addEventListener('pointerdown',function(e){ if(!EDIT||e.button>0) return; if(e.target.closest('button,input,a.x')) return;
      var kind=null, el=e.target.closest('.tile[data-id]'); if(el) kind='.tile'; else { var h=e.target.closest('.panel h2'); if(h){ el=h.closest('.panel'); kind='.panel'; } }
      if(!el) return; D={el:el,kind:kind,x:e.clientX,y:e.clientY,on:false,id:el.dataset.id,over:null}; });
    document.addEventListener('pointermove',function(e){ if(!D) return;
      if(!D.on){ if(Math.abs(e.clientX-D.x)+Math.abs(e.clientY-D.y)<8) return; D.on=true; var r=D.el.getBoundingClientRect(); D.g=D.el.cloneNode(true); D.g.className=D.el.className+' ghost'; D.g.style.width=r.width+'px'; D.g.style.height=r.height+'px'; D.dx=e.clientX-r.left; D.dy=e.clientY-r.top; document.body.appendChild(D.g); D.el.classList.add('lift'); }
      e.preventDefault(); D.g.style.left=(e.clientX-D.dx)+'px'; D.g.style.top=(e.clientY-D.dy)+'px';
      var t=itemAt(e.clientX,e.clientY,D.kind); if(D.over&&D.over!==t) D.over.classList.remove('over'); D.over=t&&t!==D.el?t:null; if(D.over) D.over.classList.add('over');
      D.cy=e.clientY; if(!D.sc) D.sc=setInterval(function(){ if(!D) return; if(D.cy>innerHeight-80) scrollBy(0,16); else if(D.cy<80) scrollBy(0,-16); },16); },{passive:false});
    function end(){ if(!D) return; var d=D; D=null; clearInterval(d.sc); if(d.g) d.g.remove(); d.el.classList.remove('lift'); if(d.over) d.over.classList.remove('over'); if(!d.on||!d.over) return;
      var M=mine(), ids=[].map.call(document.querySelectorAll(d.kind==='.tile'?'#grid .tile[data-id]':'#panels .panel[data-id]'),function(x){ return x.dataset.id; });
      var from=ids.indexOf(d.id), to=ids.indexOf(d.over.dataset.id); if(from<0||to<0) return; ids.splice(to,0,ids.splice(from,1)[0]);
      if(d.kind==='.tile') M=ids; else { var slots=[]; M.forEach(function(id,i){ if(ids.indexOf(id)>=0) slots.push(i); }); slots.forEach(function(si,k){ M[si]=ids[k]; }); }
      put('mf-dash',M); draw(); }
    document.addEventListener('pointerup',end); document.addEventListener('pointercancel',end);
    document.addEventListener('click',function(e){ if(EDIT&&e.target.closest('.tile[data-id]')&&!e.target.closest('button')) e.preventDefault(); },true); })();
  // ── the priority list and the calendar share one list (mf-prio): {id, t, done, date: 'YYYY-MM-DD', time: 'HH:MM'}
  function items(){ var a=get('mf-prio',[]); return Array.isArray(a)?a:[]; }
  function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  var CM=new Date(), SEL=today();
  function panels(M){ var P={};
    if(M.indexOf('prio')>=0) P.prio='<div class="panel" data-id="prio" id="prioP"><h2>'+(EDIT?'<span class="hd">⠿</span> ':'')+'✅ Priority list</h2><form class="add" id="pF"><input type="text" id="pT" maxlength="120" placeholder="What matters most today?"><input type="date" id="pD" aria-label="Date (optional)"><input type="time" id="pH" aria-label="Time (optional)"><button type="submit">Add</button></form><div id="pL"></div></div>';
    if(M.indexOf('cal')>=0) P.cal='<div class="panel" data-id="cal" id="calP"><h2>'+(EDIT?'<span class="hd">⠿</span> ':'')+'📅 Calendar</h2><div class="cn"><button type="button" class="ib" id="cPrev">‹</button><b id="cTitle"></b><button type="button" class="ib" id="cNext">›</button></div><div class="cal" id="cG"></div><form class="add" id="cF" style="margin-top:10px"><input type="text" id="cT" maxlength="120" placeholder="Add a reminder for the selected day"><input type="time" id="cH" aria-label="Time"><button type="submit">Add</button></form><div id="cL"></div><p class="empty" style="padding:6px 0 0;font-size:.8rem">Reminders show here and buzz while MannaFish is open. Reminders when the app is closed need a notification service, which is not on yet.</p></div>';
    var h=M.filter(function(id){ return P[id]; }).map(function(id){ return P[id]; }).join('');
    $('panels').innerHTML=h; if(M.indexOf('prio')>=0) prio(); if(M.indexOf('cal')>=0) cal(); }
  function row(x,why){ return '<div class="it'+(x.done?' done':'')+'" data-id="'+x.id+'"><input type="checkbox" data-t="1"'+(x.done?' checked':'')+' aria-label="Done"><span>'+esc(x.t)+'</span><small>'+esc((x.date&&why!=='day'?x.date.slice(5)+' ':'')+(x.time||''))+'</small>'+(why==='prio'?'<button type="button" data-up="1" aria-label="Move up">▲</button>':'')+'<button type="button" data-del="1" aria-label="Delete">✕</button></div>'; }
  function prio(){ var a=items(); $('pL').innerHTML=a.length?a.map(function(x){ return row(x,'prio'); }).join(''):'<p class="empty">Nothing yet. Put the most important thing first, and use ▲ to move something to the top.</p>'; }
  function cal(){ var y=CM.getFullYear(), m=CM.getMonth(), first=new Date(y,m,1).getDay(), n=new Date(y,m+1,0).getDate(), a=items(), has={};
    a.forEach(function(x){ if(x.date) has[x.date]=1; });
    $('cTitle').textContent=CM.toLocaleDateString(undefined,{month:'long',year:'numeric'});
    var h='SMTWTFS'.split('').map(function(d){ return '<b>'+d+'</b>'; }).join(''); for(var i=0;i<first;i++) h+='<span></span>';
    for(var d=1;d<=n;d++){ var k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); h+='<button type="button" data-d="'+k+'" class="'+(k===today()?'today ':'')+(k===SEL?'sel':'')+'">'+d+(has[k]?'<i></i>':'')+'</button>'; }
    $('cG').innerHTML=h; var day=a.filter(function(x){ return x.date===SEL; }).sort(function(p,q){ return String(p.time||'').localeCompare(String(q.time||'')); });
    $('cL').innerHTML=day.length?day.map(function(x){ return row(x,'day'); }).join(''):'<p class="empty">Nothing on '+esc(SEL)+'.</p>'; }
  function save(a){ put('mf-prio',a); prio&&($('pL')&&prio()); ($('cG')&&cal()); upcoming(); schedule(); }
  function add(t,date,time){ t=String(t||'').trim(); if(!t) return; var a=items(); a.push({id:'i'+Date.now()+Math.floor(Math.random()*99),t:t.slice(0,120),done:false,date:date||'',time:time||''}); save(a); }
  document.addEventListener('submit',function(e){ e.preventDefault(); if(e.target.id==='pF'){ add($('pT').value,$('pD').value,$('pH').value); $('pT').value=''; } else if(e.target.id==='cF'){ add($('cT').value,SEL,$('cH').value); $('cT').value=''; } });
  document.addEventListener('click',function(e){ var d=e.target.closest('#cG [data-d]'); if(d){ SEL=d.dataset.d; cal(); return; }
    if(e.target.id==='cPrev'){ CM=new Date(CM.getFullYear(),CM.getMonth()-1,1); cal(); return; } if(e.target.id==='cNext'){ CM=new Date(CM.getFullYear(),CM.getMonth()+1,1); cal(); return; }
    var r=e.target.closest('.it'); if(!r) return; var a=items(), i=a.findIndex(function(x){ return x.id===r.dataset.id; }); if(i<0) return;
    if(e.target.dataset.del){ a.splice(i,1); save(a); } else if(e.target.dataset.up){ var x=a.splice(i,1)[0]; a.unshift(x); save(a); } });
  document.addEventListener('change',function(e){ if(!e.target.dataset||!e.target.dataset.t) return; var r=e.target.closest('.it'), a=items(), x=a.filter(function(y){ return y.id===r.dataset.id; })[0]; if(x){ x.done=e.target.checked; save(a); } });
  // what is coming up today, shown under the greeting
  function upcoming(){ var a=items().filter(function(x){ return !x.done&&x.date===today(); }); var s=$('sub2'); if(!s){ s=document.createElement('p'); s.id='sub2'; s.className='sub'; s.style.cssText='margin-top:-8px;color:var(--gold)'; $('hi').parentNode.insertBefore(s,$('hi').nextSibling.nextSibling); }
    s.textContent=a.length?'Today: '+a.map(function(x){ return (x.time?x.time+' ':'')+x.t; }).join(' · '):''; }
  // while the page is open, a reminder with a time buzzes (a browser notification, if allowed) when it comes due
  var TM=[]; function schedule(){ TM.forEach(clearTimeout); TM=[]; var now=Date.now();
    items().forEach(function(x){ if(x.done||!x.date||!x.time) return; var at=new Date(x.date+'T'+x.time).getTime(); if(!(at>now)||at-now>2147483000) return;
      TM.push(setTimeout(function(){ try{ if(window.Notification&&Notification.permission==='granted') new Notification('MannaFish',{body:x.t}); else alert(x.t); }catch(e){} },at-now)); });
    try{ if(window.Notification&&Notification.permission==='default'&&items().some(function(x){ return x.time&&!x.done; })) Notification.requestPermission(); }catch(e){} }
  function greet(){ var h=new Date().getHours(), g=h<12?'Good morning':h<18?'Good afternoon':'Good evening', me=window.MFacct&&MFacct.me&&MFacct.me(), n=me&&(me.name||(me.email||'').split('@')[0]); $('hi').textContent=g+(n?', '+n:'')+' 👋'; }
  greet(); draw(); upcoming(); schedule();
  window.addEventListener('load',function(){ setTimeout(function(){ greet(); if(window.MFacct&&MFacct.on) MFacct.on(function(){ greet(); draw(); upcoming(); schedule(); }); },600); });
})();
</script>
</body>
</html>
