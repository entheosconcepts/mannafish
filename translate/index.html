<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MannaFish Translator</title>
<meta name="description" content="A translator for sharing Jesus with anyone in their own language. Tap the microphone, speak, and hear it in the other language.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/translate/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<!-- Ken, 9 Oct: the MannaFish Translator on its own page -- "really easy to use ... someone can speak in Spanish, and if
     one speaks in English it translates to Spanish, real quick". One big microphone hears either language and answers
     in the other, out loud; small English / Español buttons when you want to say which. Black, blue and white. -->
<style>
:root{--ink:#000;--ink2:#0b1620;--foam:#eaf0f0;--dim:#9fb2b6;--blue:#2a5fb0;--blue2:#6f9be0;--line:rgba(200,215,218,.16);--red:#c8423c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--foam)}
body{font:1rem/1.5 'Archivo',system-ui,sans-serif;display:flex;flex-direction:column;min-height:100dvh}
button,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.top a.back{font:600 .82rem 'Archivo',sans-serif;text-decoration:none;color:var(--foam);border:1px solid var(--line);border-radius:999px;padding:7px 12px;white-space:nowrap}
.top .brand{display:flex;flex-direction:column;align-items:center;text-decoration:none;min-width:0}
.top .brand img{height:26px;width:auto;display:block}
.top .brand span{font:700 .62rem 'Archivo',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--blue2);margin-top:2px}
.top select{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 8px;font-size:.78rem;max-width:118px}
.pair{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px 6px}
.pair select{flex:0 1 160px;min-width:0;background:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-weight:700;text-align:center}
.pair button{width:40px;height:40px;border-radius:50%;border:1px solid var(--blue);background:transparent;cursor:pointer;font-size:1.1rem;flex:none}
select option{background:var(--ink2);color:var(--foam)}
.sub{margin:0;padding:0 18px 6px;text-align:center;font-size:.82rem;color:var(--dim)}
main{flex:1;overflow-y:auto;padding:8px 14px 16px;display:flex;flex-direction:column;gap:12px}
.empty{margin:auto;text-align:center;color:var(--dim);max-width:420px;padding:20px}
.empty b{display:block;color:var(--foam);font-size:1.15rem;margin-bottom:6px}
.turn{max-width:88%;border-radius:18px;padding:10px 14px 8px;border:1px solid var(--line);background:var(--ink2)}
.turn.a{align-self:flex-start;border-bottom-left-radius:6px}
.turn.b{align-self:flex-end;border-bottom-right-radius:6px;background:#0e2244;border-color:rgba(42,95,176,.55)}
.turn .said{font-size:.84rem;color:var(--dim)}
.turn .said i{font-style:normal;font-weight:700;color:var(--blue2);margin-inline-end:4px}
.turn .tr{font:600 1.3rem/1.35 'Spectral',Georgia,serif;margin:4px 0 6px;word-break:break-word}
.turn .acts{display:flex;gap:6px;flex-wrap:wrap}
.turn .acts button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 10px;font-size:.78rem;font-weight:600;cursor:pointer}
.turn.wait .tr{color:var(--dim);font-style:italic}
.turn.err{border-color:var(--red)}
.status{min-height:22px;text-align:center;font-size:.86rem;color:var(--blue2);padding:0 14px}
.controls{border-top:1px solid var(--line);padding:12px 12px max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{border:1px solid var(--blue);background:transparent;border-radius:999px;padding:12px 8px;font-weight:700;font-size:.9rem;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side.on{background:var(--red);border-color:var(--red)}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--blue);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 10px 30px -8px rgba(42,95,176,.8)}
.mic svg{width:34px;height:34px}
.mic span{font:800 .7rem 'Archivo',sans-serif;letter-spacing:.04em}
.mic.on{background:var(--red);box-shadow:0 0 0 0 rgba(200,66,60,.6);animation:pulse 1.2s infinite}
.mic.busy{opacity:.6}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,66,60,.6)}70%{box-shadow:0 0 0 18px rgba(200,66,60,0)}100%{box-shadow:0 0 0 0 rgba(200,66,60,0)}}
.tools{display:flex;justify-content:center;gap:8px;padding:8px 14px 0;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:600;cursor:pointer}
.typebox{display:flex;gap:8px;padding:8px 14px 0}
.typebox[hidden]{display:none}
.typebox input{flex:1;min-width:0;background:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:10px 14px;color:var(--foam);font:inherit}
.typebox button{border:0;background:var(--blue);color:#fff;border-radius:999px;padding:0 16px;font-weight:700;cursor:pointer}
.sheet{position:fixed;inset:auto 0 0 0;max-height:70dvh;overflow-y:auto;background:var(--ink2);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 14px max(18px,env(safe-area-inset-bottom));z-index:20;box-shadow:0 -20px 50px -10px #000}
.sheet[hidden]{display:none}
.sheet h3{margin:12px 0 6px;font:700 .72rem 'Archivo',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--blue2)}
.sheet .ph{display:block;width:100%;text-align:start;border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 12px;margin:0 0 6px;cursor:pointer}
.sheet .ph small{display:block;color:var(--dim)}
.sheet .x{float:right;border:1px solid var(--line);background:transparent;border-radius:50%;width:32px;height:32px;cursor:pointer}
.show{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.show[hidden]{display:none}
.show .big{font:600 clamp(1.8rem,8vw,3.4rem)/1.25 'Spectral',Georgia,serif;max-width:900px;word-break:break-word}
.show .big.flip{transform:rotate(180deg)}
.show .row{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));display:flex;gap:10px}
.show .row button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer}
[dir=rtl]{text-align:right}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="/" id="back">&larr; <span id="backLab">Devotional</span></a>
  <a class="brand" href="/"><img src="/w/img/logo-email.png" alt="MannaFish" width="112" height="26"><span id="brandSub">Translator</span></a>
  <select id="voice" aria-label="Voice"></select>
</header>
<div class="pair">
  <select id="la" aria-label="Your language"></select>
  <button type="button" id="swap" aria-label="Swap languages">&#8644;</button>
  <select id="lb" aria-label="Their language"></select>
</div>
<p class="sub" id="sub">A translator for sharing Jesus with anyone in their own language</p>
<main id="convo" aria-live="polite"><div class="empty" id="empty"><b id="emptyH">Tap the microphone and speak.</b><span id="emptyT"></span></div></main>
<div class="status" id="status"></div>
<div class="tools"><button type="button" id="phBtn"></button><button type="button" id="kbBtn"></button><button type="button" id="clrBtn"></button></div>
<div class="typebox" id="typebox" hidden><input id="typeIn" autocomplete="off"><button type="button" id="typeGo">&#10148;</button></div>
<div class="controls">
  <button type="button" class="side" id="micA"></button>
  <button type="button" class="mic" id="mic" aria-label="Tap to talk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg><span id="micLab">Tap to talk</span></button>
  <button type="button" class="side" id="micB"></button>
</div>
<div class="sheet" id="sheet" hidden><button type="button" class="x" id="sheetX" aria-label="Close">&times;</button><div id="sheetBody"></div></div>
<div class="show" id="show" hidden><div class="big" id="showT"></div><div class="row"><button type="button" id="showFlip">&#8635;</button><button type="button" id="showPlay">&#128266;</button><button type="button" id="showX">&times;</button></div></div>
<script>
(function(){
  var $=function(id){ return document.getElementById(id); };
  var L={en:'English',es:'Español',tl:'Tagalog',zh:'中文',hi:'हिन्दी',el:'Ελληνικά',de:'Deutsch',ko:'한국어',he:'עברית'};
  var CODE={en:'en-US',es:'es-US',tl:'fil-PH',zh:'zh-CN',hi:'hi-IN',el:'el-GR',de:'de-DE',ko:'ko-KR',he:'he-IL'};
  var VOICES=[['sage','Sage'],['nova','Nova'],['coral','Coral'],['shimmer','Shimmer'],['alloy','Alloy'],['ash','Ash'],['ballad','Ballad'],['echo','Echo'],['fable','Fable'],['onyx','Onyx'],['verse','Verse'],['device','Device voice']];
  var UI={en:{back:'Devotional',sub:'A translator for sharing Jesus with anyone in their own language',brand:'Translator',talk:'Tap to talk',stop:'Tap to stop',
      eh:'Tap the microphone and speak.',et:'Speak in either language. It hears which one, shows the words in the other, and says them out loud. Use the side buttons to say which language you will speak.',
      ph:'💬 Phrases',kb:'⌨ Type',clr:'Clear',listen:'Listening… tap when you are done',hearing:'Hearing…',trans:'Translating…',again:'🔊 Again',show:'Show them',
      none:'Didn’t catch that. Tap and try again.',mic:'Please allow the microphone to talk.',fail:'Could not translate right now. Please try again.',busy:'Many requests just now; wait a minute.',
      key:'Live translation is not turned on yet.',ready:'Ready-made phrases',verses:'Verses',typ:'Type in either language…',flip:'Turn',close:'Close',voice:'Voice'},
    es:{back:'Devocional',sub:'Un traductor para compartir a Jesús con cualquiera en su propio idioma',brand:'Traductor',talk:'Toca para hablar',stop:'Toca para parar',
      eh:'Toca el micrófono y habla.',et:'Habla en cualquiera de los dos idiomas. Reconoce cuál es, muestra las palabras en el otro y las dice en voz alta. Usa los botones de los lados para elegir el idioma.',
      ph:'💬 Frases',kb:'⌨ Escribir',clr:'Borrar',listen:'Escuchando… toca al terminar',hearing:'Oyendo…',trans:'Traduciendo…',again:'🔊 Otra vez',show:'Mostrarle',
      none:'No se oyó bien. Toca y vuelve a intentarlo.',mic:'Permite el micrófono para hablar.',fail:'No se pudo traducir ahora. Inténtalo otra vez.',busy:'Muchas solicitudes; espera un minuto.',
      key:'La traducción en vivo aún no está activada.',ready:'Frases listas',verses:'Versículos',typ:'Escribe en cualquiera de los dos idiomas…',flip:'Girar',close:'Cerrar',voice:'Voz'}};
  function get(k,d){ try{ return localStorage.getItem(k)||d; }catch(e){ return d; } }
  function put(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  var site=get('mf-lang','en'); if(!L[site]) site='en';
  var pair=(get('mf-tr-pair','')||'').split(','); if(!(L[pair[0]]&&L[pair[1]]&&pair[0]!==pair[1])) pair=[site, site==='en'?'es':'en'];
  var T=UI[pair[0]]||UI[site]||UI.en;
  function fill(sel,v){ sel.innerHTML=Object.keys(L).map(function(c){ return '<option value="'+c+'"'+(c===v?' selected':'')+'>'+L[c]+'</option>'; }).join(''); }
  function labels(){ T=UI[pair[0]]||UI.en; document.documentElement.lang=pair[0];
    $('backLab').textContent=T.back; $('brandSub').textContent=T.brand; $('sub').textContent=T.sub; if($('emptyH')){ $('emptyH').textContent=T.eh; $('emptyT').textContent=T.et; }
    $('phBtn').textContent=T.ph; $('kbBtn').textContent=T.kb; $('clrBtn').textContent=T.clr; $('typeIn').placeholder=T.typ; $('voice').setAttribute('aria-label',T.voice);
    $('micA').textContent='🎤 '+L[pair[0]]; $('micB').textContent='🎤 '+L[pair[1]]; if(!rec) $('micLab').textContent=T.talk; }
  fill($('la'),pair[0]); fill($('lb'),pair[1]);
  $('voice').innerHTML=VOICES.map(function(v){ return '<option value="'+v[0]+'">'+v[1]+'</option>'; }).join(''); $('voice').value=get('mf-voice','sage');
  $('voice').addEventListener('change',function(){ put('mf-voice',this.value); });
  function setPair(a,b){ if(a===b) b=(a==='en'?'es':'en'); pair=[a,b]; put('mf-tr-pair',pair.join(',')); fill($('la'),a); fill($('lb'),b); labels(); }
  $('la').addEventListener('change',function(){ setPair(this.value,pair[1]===this.value?pair[0]:pair[1]); });
  $('lb').addEventListener('change',function(){ setPair(pair[0]===this.value?pair[1]:pair[0],this.value); });
  $('swap').addEventListener('click',function(){ setPair(pair[1],pair[0]); });
  function status(t){ $('status').textContent=t||''; }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function post(path,body){ return fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}); }
  function errMsg(r){ return r&&r.json?r.json().then(function(j){ return j.error==='key'||j.error==='nokey'?T.key:j.error==='busy'?T.busy:T.fail; },function(){ return T.fail; }):Promise.resolve(T.fail); }

  // ── speaking: one audio player, unlocked by the first tap, so phones let it play the answers
  var player=new Audio(), unlocked=false, SILENT='data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
  function unlock(){ if(unlocked) return; unlocked=true; try{ player.src=SILENT; var p=player.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  function say(text,lang,btn){ var v=get('mf-voice','sage'); if(btn) btn.disabled=true; var done=function(){ if(btn) btn.disabled=false; };
    var dev=function(){ if(!window.speechSynthesis){ done(); return; } speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text); u.lang=CODE[lang]||lang; u.rate=.95;
      var vs=speechSynthesis.getVoices().filter(function(x){ return (x.lang||'').toLowerCase().indexOf(lang==='tl'?'fil':lang)===0; }); if(vs[0]) u.voice=vs[0]; u.onend=done; u.onerror=done; speechSynthesis.speak(u); };
    if(v==='device'){ dev(); return; }
    post('/api/say',{text:text,lang:lang,voice:v}).then(function(r){ if(!r.ok) throw 0; return r.blob(); }).then(function(b){
      player.pause(); player.src=URL.createObjectURL(b); player.onended=done; var p=player.play(); if(p&&p.catch) p.catch(function(){ done(); dev(); }); }).catch(function(){ done(); dev(); }); }

  // ── the conversation
  function addTurn(side){ var e=$('empty'); if(e) e.remove(); var d=document.createElement('div'); d.className='turn '+side+' wait';
    d.innerHTML='<div class="said"></div><div class="tr">…</div><div class="acts" hidden></div>'; $('convo').appendChild(d); d.scrollIntoView({block:'end',behavior:'smooth'}); return d; }
  function fillTurn(d,said,saidLang,tr,trLang){ d.classList.remove('wait'); d.classList.toggle('a',saidLang===pair[0]); d.classList.toggle('b',saidLang!==pair[0]);
    d.querySelector('.said').innerHTML='<i>'+esc(L[saidLang]||'')+'</i>'+esc(said); d.querySelector('.said').setAttribute('lang',saidLang);
    var t=d.querySelector('.tr'); t.textContent=tr; t.setAttribute('lang',trLang); t.dir=trLang==='he'?'rtl':'auto';
    var a=d.querySelector('.acts'); a.hidden=false; a.innerHTML='<button type="button" data-a="say">'+T.again+'</button><button type="button" data-a="show">'+T.show+'</button>';
    d._tr=tr; d._lang=trLang; d.scrollIntoView({block:'end',behavior:'smooth'}); say(tr,trLang,a.querySelector('[data-a=say]')); }
  function failTurn(d,msg){ d.classList.remove('wait'); d.classList.add('err'); d.querySelector('.tr').textContent=msg; }
  $('convo').addEventListener('click',function(e){ var b=e.target.closest('button[data-a]'), d=e.target.closest('.turn'); if(!b||!d) return; unlock();
    if(b.dataset.a==='say') say(d._tr,d._lang,b); else showThem(d._tr,d._lang); });
  // words in one of the two languages (or a chosen one) -> the other, shown and said
  function translate(text,from,d){ status(T.trans);
    var body=from?{text:text,from:from,to:from===pair[0]?pair[1]:pair[0]}:{text:text,pair:pair};
    post('/api/translate',body).then(function(r){ if(!r.ok) return errMsg(r).then(function(m){ throw m; }); return r.json(); })
      .then(function(j){ status(''); var fr=j.from||from, to=j.to||body.to; fillTurn(d,text,fr,j.text,to); })
      .catch(function(m){ status(''); failTurn(d,typeof m==='string'?m:T.fail); }); }

  // ── the microphone: tap, speak, and it stops by itself after a short pause (or tap again)
  var rec=null, stream=null, chunks=[], force=null, vad=null, ctx=null;
  function mime(){ var c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus']; for(var i=0;i<c.length;i++) if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(c[i])) return c[i]; return ''; }
  function uiRec(on){ $('mic').classList.toggle('on',on&&!force); $('micA').classList.toggle('on',on&&force===pair[0]); $('micB').classList.toggle('on',on&&force===pair[1]);
    $('micLab').textContent=on?T.stop:T.talk; }
  function stopRec(){ if(rec&&rec.state!=='inactive') rec.stop(); }
  function start(lang){ unlock(); if(rec){ stopRec(); return; }
    if(!navigator.mediaDevices||!window.MediaRecorder){ status(T.mic); return; }
    force=lang||null;
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(s){ stream=s; chunks=[];
      var m=mime(); rec=m?new MediaRecorder(s,{mimeType:m}):new MediaRecorder(s);
      rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
      rec.onstop=function(){ var type=(rec.mimeType||m||'audio/webm').split(';')[0], blob=new Blob(chunks,{type:type}); clearInterval(vad); if(ctx){ try{ ctx.close(); }catch(e){} ctx=null; }
        stream.getTracks().forEach(function(t){ t.stop(); }); rec=null; uiRec(false); send(blob,type,force); };
      rec.start(); uiRec(true); status(T.listen); listenForPause(s); })
    .catch(function(){ status(T.mic); }); }
  // stop after about 1.3 seconds of quiet once someone has spoken (or 8 seconds of nothing, or 45 seconds in all)
  function listenForPause(s){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); var src=ctx.createMediaStreamSource(s), an=ctx.createAnalyser(); an.fftSize=1024; src.connect(an);
      var buf=new Uint8Array(an.fftSize), t0=Date.now(), spoke=false, quiet=0;
      vad=setInterval(function(){ an.getByteTimeDomainData(buf); var sum=0; for(var i=0;i<buf.length;i++){ var x=(buf[i]-128)/128; sum+=x*x; } var rms=Math.sqrt(sum/buf.length);
        if(rms>0.035){ spoke=true; quiet=0; } else quiet+=100;
        if((spoke&&quiet>1300) || (!spoke&&Date.now()-t0>8000) || Date.now()-t0>45000) stopRec(); },100); }catch(e){} }
  function send(blob,type,lang){ if(!blob.size){ status(T.none); return; } status(T.hearing);
    var d=addTurn(lang&&lang!==pair[0]?'b':'a');
    fetch('/api/hear'+(lang?'?lang='+lang:''),{method:'POST',headers:{'content-type':type},body:blob})
      .then(function(r){ if(!r.ok) return errMsg(r).then(function(m){ throw m; }); return r.json(); })
      .then(function(j){ if(!j.text){ d.remove(); status(T.none); return; } d.querySelector('.said').textContent=j.text; translate(j.text,lang,d); })
      .catch(function(m){ status(''); failTurn(d,typeof m==='string'?m:T.fail); }); }
  $('mic').addEventListener('click',function(){ start(null); });
  $('micA').addEventListener('click',function(){ start(pair[0]); });
  $('micB').addEventListener('click',function(){ start(pair[1]); });

  // ── typing instead of speaking
  $('kbBtn').addEventListener('click',function(){ var tb=$('typebox'); tb.hidden=!tb.hidden; if(!tb.hidden) $('typeIn').focus(); });
  function typed(){ var t=$('typeIn').value.trim(); if(!t) return; unlock(); $('typeIn').value=''; translate(t,null,addTurn('a')); }
  $('typeGo').addEventListener('click',typed); $('typeIn').addEventListener('keydown',function(e){ if(e.key==='Enter') typed(); });
  $('clrBtn').addEventListener('click',function(){ $('convo').innerHTML='<div class="empty" id="empty"><b id="emptyH"></b><span id="emptyT"></span></div>'; labels(); });

  // ── ready-made phrases and verses (already translated, so they work even offline from the translation service)
  var TONGUE=null;
  function phrases(){ var b=$('sheetBody'), a=pair[0], z=pair[1];
    var row=function(t,id){ return t&&t[z]?'<button type="button" class="ph" data-id="'+id+'">'+esc(t[z])+'<small>'+esc(t[a]||t.en)+'</small></button>':''; };
    b.innerHTML='<h3>'+T.ready+'</h3>'+TONGUE.phrases.map(function(p){ return row(p.t,p.id); }).join('')+'<h3>'+T.verses+'</h3>'+TONGUE.verses.map(function(v){ return row(v.t,v.id); }).join('');
    $('sheet').hidden=false; }
  $('phBtn').addEventListener('click',function(){ unlock(); if(TONGUE){ phrases(); return; }
    fetch('/fish-lang/tongue.json').then(function(r){ return r.json(); }).then(function(j){ TONGUE=j; phrases(); }).catch(function(){ status(T.fail); }); });
  $('sheetX').addEventListener('click',function(){ $('sheet').hidden=true; });
  $('sheetBody').addEventListener('click',function(e){ var b=e.target.closest('.ph'); if(!b) return; var id=b.dataset.id, it=TONGUE.phrases.concat(TONGUE.verses).filter(function(x){ return x.id===id; })[0]; if(!it) return;
    $('sheet').hidden=true; var d=addTurn('a'); fillTurn(d,it.t[pair[0]]||it.t.en,pair[0],it.t[pair[1]],pair[1]); });

  // ── "Show them": the words large, and turned round for someone across the table
  var showing=null;
  function showThem(t,l){ showing={t:t,l:l}; $('showT').textContent=t; $('showT').setAttribute('lang',l); $('showT').dir=l==='he'?'rtl':'auto'; $('showT').classList.remove('flip'); $('show').hidden=false; }
  $('showFlip').addEventListener('click',function(){ $('showT').classList.toggle('flip'); });
  $('showPlay').addEventListener('click',function(){ if(showing) say(showing.t,showing.l,this); });
  $('showX').addEventListener('click',function(){ $('show').hidden=true; });
  labels();
})();
</script>
