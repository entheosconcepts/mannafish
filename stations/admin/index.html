<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Stations admin · MannaFish</title>
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Ken, 31 Oct: MannaFish Stations. Add a Station (Ken approves each one), set its number (100 unless changed), see which fish people
     are praying for there, and fill its pond: "On the way" when a run is ordered for it, "It's in" when it arrives, which emails
     everyone who prayed for that fish there and starts that fish's count again. The key is MF_ADMIN_KEY (or PROOF_KEY). -->
<style>
:root{--ink:#000;--ink2:#0b1620;--foam:#eaf0f0;--dim:#9fb2b6;--blue:#2a5fb0;--line:rgba(200,215,218,.18);--red:#c8423c;--gold:#f5d76e;--ok:#7fd3a0}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--foam);font:1rem/1.5 'Archivo',system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}header b{font-size:1.1rem}header a{color:var(--foam);font-size:.9rem}
main{max-width:900px;margin:0 auto;padding:16px}
h2{font-size:1rem;margin:22px 0 10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
input,select,textarea{font:inherit;color:var(--foam);background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
button{font:700 .9rem 'Archivo',sans-serif;border-radius:999px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--foam)}
button.ok{background:var(--blue);border-color:var(--blue);color:#fff}button.no{border-color:var(--red);color:#ffb3ae}button.in{border-color:var(--ok);color:var(--ok)}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;background:var(--ink2)}.card.hit{border-color:var(--gold)}.card.shut{opacity:.6}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.grid .w{grid-column:1/-1}
label{font-size:.8rem;color:var(--dim);display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.big{font-size:1.25rem;font-weight:800}.meta{font-size:.85rem;color:var(--dim)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--gold)}
table{border-collapse:collapse;width:100%;font-size:.9rem;margin:6px 0}td,th{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}th{color:var(--dim);font-weight:600}td.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{border-radius:99px;padding:1px 8px;font-size:.75rem;font-weight:800}.pill.in{background:rgba(127,211,160,.15);color:var(--ok)}.pill.coming{background:rgba(245,215,110,.15);color:var(--gold)}
#msg{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;padding:8px 12px;border-radius:10px;margin:0 0 10px}#msg:empty{display:none}
details summary{cursor:pointer;color:var(--dim);font-size:.9rem;margin-top:10px}
</style>
</head>
<body>
<header><b>MannaFish Stations</b><a href="/stations/">Public page ›</a></header>
<main>
<div id="msg" role="status"></div>
<div id="keyBox" class="card"><label>Admin password<input id="k" type="password" autocomplete="current-password"></label><div class="row"><button class="ok" id="kGo" type="button">Open</button></div></div>
<div id="app" hidden>
  <h2>Stations</h2><div id="list"></div>
  <h2>Add a Station</h2>
  <div class="card"><div class="grid">
    <label>Name<input id="nName" placeholder="Mailbox Express"></label><label>City<input id="nCity" placeholder="Wilmington, NC"></label>
    <label class="w">Where to pick up (shown to people)<input id="nWhere" placeholder="Ask at the counter"></label>
    <label class="w">A note (optional, shown)<input id="nNote"></label>
    <label>Their email (gets the notice, not shown)<input id="nOwner" type="email"></label><label>Prayers to fill the pond<input id="nTh" type="number" min="10" value="100"></label>
  </div><div class="row"><button class="ok" id="nGo" type="button">Add Station</button></div></div>
</div>
</main>
<script>
(function(){
  function $(i){ return document.getElementById(i); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var K=''; try{ K=localStorage.getItem('mf-admin-key')||''; }catch(e){}
  var ST=[], KINDS=[['decal','Decals'],['card','Cards'],['shirt','Shirts'],['keychain','Key chains'],['mug','Mugs'],['cap','Caps']];
  function say(t){ $('msg').textContent=t||''; if(t) setTimeout(function(){ if($('msg').textContent===t) $('msg').textContent=''; },5000); }
  function api(b){ b.k=K; return fetch('/api/stations/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw j; return j; }); }); }
  function load(){ return fetch('/api/stations/admin?k='+encodeURIComponent(K),{cache:'no-store'}).then(function(r){ if(r.status===403) throw 403; return r.json(); })
    .then(function(j){ try{ localStorage.setItem('mf-admin-key',K); }catch(e){} ST=j.stations||[]; $('keyBox').hidden=true; $('app').hidden=false; draw(); })
    .catch(function(e){ $('keyBox').hidden=false; $('app').hidden=true; if(e===403) say('That password did not work.'); else if(K) say('Could not open the Stations.'); }); }
  function lname(x){ return esc(x.word)+(x.l&&x.l!=='en'?' ('+esc(x.l)+')':''); }
  function draw(){ $('list').innerHTML=ST.map(function(s,i){ var th=s.threshold||100, t=s.total||0, any=s.id==='anywhere';
    return '<div class="card'+(t>=th?' hit':'')+(s.open?'':' shut')+'" data-i="'+i+'"><div class="big">'+esc(s.name)+(s.city?' <span class="meta">· '+esc(s.city)+'</span>':'')+(s.open?'':' <span class="pill coming">closed</span>')+'</div>'
      +'<div class="meta">'+esc(s.where||'')+(s.owner?' · notice to '+esc(s.owner):'')+'</div>'
      +'<div class="bar"><i style="width:'+Math.min(100,Math.round(t*100/th))+'%"></i></div><div class="meta">'+t+' of '+th+' prayers'+(s.notified?' · you were emailed: ready to fill':'')+'</div>'
      +(s.top.length?'<table><tr><th>Fish prayed for</th><th class="n">Praying</th><th></th></tr>'+s.top.map(function(x,j){ return '<tr><td>'+lname(x)+'</td><td class="n">'+x.n+'</td><td style="text-align:right"><button type="button" data-a="pick" data-j="'+j+'">Fill ›</button></td></tr>'; }).join('')+'</table>':'<p class="meta">No prayers here yet.</p>')
      +((s.stock||[]).length?'<table><tr><th>In the pond</th><th>What</th><th class="n">How many</th><th></th></tr>'+s.stock.map(function(x,j){ return '<tr><td>'+lname(x)+'</td><td>'+esc(x.kind)+' <span class="pill '+x.status+'">'+(x.status==='in'?'here':'on the way')+'</span></td><td class="n">'+(x.qty||'')+'</td><td style="text-align:right">'
        +(x.status!=='in'?'<button type="button" class="in" data-a="arrived" data-j="'+j+'">It’s in</button> ':'')+'<button type="button" data-a="unstock" data-j="'+j+'">Take off</button></td></tr>'; }).join('')+'</table>':'')
      +'<details><summary>Fill the pond with a fish</summary><div class="grid" style="margin-top:8px"><label>Fish (M:GATHER, X:X001, Y:W19b …)<input data-f="fish" placeholder="M:GATHER"></label><label>Word<input data-f="word" placeholder="Gather"></label>'
      +'<label>Language<input data-f="l" value="en"></label><label>What<select data-f="kind">'+KINDS.map(function(k){ return '<option value="'+k[0]+'">'+k[1]+'</option>'; }).join('')+'</select></label><label>How many<input data-f="qty" type="number" min="0" value="100"></label></div>'
      +'<div class="row"><button type="button" data-a="coming">On the way</button><button type="button" class="in" data-a="in">It’s in: tell everyone who prayed</button></div></details>'
      +'<details><summary>Change this Station</summary><div class="grid" style="margin-top:8px">'+(any?'':'<label>Name<input data-e="name" value="'+esc(s.name)+'"></label><label>City<input data-e="city" value="'+esc(s.city)+'"></label>')
      +'<label class="w">Where to pick up<input data-e="where" value="'+esc(s.where)+'"></label><label class="w">Note<input data-e="note" value="'+esc(s.note)+'"></label>'
      +(any?'':'<label>Their email<input data-e="owner" type="email" value="'+esc(s.owner)+'"></label>')+'<label>Prayers to fill the pond<input data-e="threshold" type="number" min="10" value="'+th+'"></label></div>'
      +'<div class="row"><button type="button" class="ok" data-a="edit">Save</button>'+(any?'':(s.open?'<button type="button" class="no" data-a="close">Close this Station</button>':'<button type="button" data-a="open">Open it again</button>'))+'</div>'
      +(any?'':'<p class="meta">Link for this Station: <a href="/stations/?station='+esc(s.id)+'">/stations/?station='+esc(s.id)+'</a></p>')+'</details></div>'; }).join(''); }
  $('list').addEventListener('click',function(e){ var b=e.target.closest('[data-a]'); if(!b) return; var c=b.closest('.card'), s=ST[+c.dataset.i], a=b.dataset.a, j=+b.dataset.j;
    function f(n){ var el=c.querySelector('[data-f='+n+']'); return el?el.value.trim():''; }
    if(a==='pick'){ var x=s.top[j], d=c.querySelectorAll('details')[0]; d.open=true; c.querySelector('[data-f=fish]').value=x.fish; c.querySelector('[data-f=word]').value=x.word; c.querySelector('[data-f=l]').value=x.l||'en'; c.querySelector('[data-f=fish]').scrollIntoView({block:'center'}); return; }
    var body={id:s.id};
    if(a==='coming'||a==='in'){ body.action='stock'; body.status=a; body.fish=f('fish'); body.word=f('word'); body.l=f('l')||'en'; body.kind=f('kind'); body.qty=f('qty');
      if(!/^[A-Z]:/.test(body.fish)){ say('Which fish? For example M:GATHER'); return; }
      if(a==='in'&&!confirm('Email everyone who prayed for '+(body.word||body.fish)+' at '+s.name+' that it is in?')) return; }
    else if(a==='arrived'){ var y=s.stock[j]; body={id:s.id,action:'stock',status:'in',fish:y.fish,word:y.word,l:y.l,kind:y.kind,qty:y.qty}; if(!confirm('Email everyone who prayed for '+y.word+' at '+s.name+' that it is in?')) return; }
    else if(a==='unstock'){ body.action='unstock'; body.i=j; }
    else if(a==='edit'){ body.action='edit'; [].forEach.call(c.querySelectorAll('[data-e]'),function(el){ body[el.dataset.e]=el.value.trim(); }); }
    else if(a==='close'){ if(!confirm('Close '+s.name+'? People can no longer pray for fish there.')) return; body.action='close'; }
    else if(a==='open') body.action='open';
    b.disabled=true; api(body).then(function(j){ say(j.told!=null?'Done. '+j.told+' '+(j.told===1?'person was':'people were')+' told it is in.':'Saved.'); return load(); }).catch(function(err){ b.disabled=false; say((err&&err.error)||'That did not work.'); }); });
  $('nGo').addEventListener('click',function(){ var b={action:'create',name:$('nName').value.trim(),city:$('nCity').value.trim(),where:$('nWhere').value.trim(),note:$('nNote').value.trim(),owner:$('nOwner').value.trim(),threshold:$('nTh').value};
    if(!b.name){ say('Give it a name.'); return; } api(b).then(function(){ ['nName','nCity','nWhere','nNote','nOwner'].forEach(function(i){ $(i).value=''; }); say('Added.'); load(); }).catch(function(err){ say((err&&err.error)||'That did not work.'); }); });
  $('kGo').addEventListener('click',function(){ K=$('k').value.trim(); load(); });
  if(K) load();
})();
</script>
</body>
</html>
