<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MannaFish · Sponsored runs</title>
<!-- Ken, 30 Oct: "keep things organized here in this code project ... manage and monitor everything". Every printed run (print/runs/),
     its proof and files, what still needs doing, and how many times each QR code on its cards has been scanned (/q/<code>).
     Scans are behind the admin password (the same one as the edit sheet and feedback). -->
<style>
:root{--bg:#0b0e12;--card:#141a21;--line:rgba(255,255,255,.13);--text:#eaf0f0;--dim:#9fb2b6;--blue:#2a5fb0;--warn:#f0b36a;--ok:#7fd3a0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Archivo,system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:18px max(14px,env(safe-area-inset-right)) 60px max(14px,env(safe-area-inset-left))}
h1{margin:0 0 4px;font-size:1.5rem}.sub{color:var(--dim);margin:0 0 14px}
.key{display:flex;gap:8px;margin:0 0 14px}.key input,.key button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font:inherit}.key input{flex:1}.key button{font-weight:700;cursor:pointer}
.run{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.run .h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.run .h b{font-size:1.05rem}.run .h small{color:var(--dim)}
.st{margin-left:auto;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;background:rgba(240,179,106,.16);color:var(--warn);text-transform:uppercase}.st.ok{background:rgba(127,211,160,.15);color:var(--ok)}
.run img{display:block;width:100%;max-width:640px;border-radius:10px;margin:10px 0;background:#fff}
table{border-collapse:collapse;width:100%;font-size:.92rem;margin:6px 0}td,th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}th{color:var(--dim);font-weight:600}td.n{text-align:right;font-variant-numeric:tabular-nums}
ul.w{margin:6px 0;padding-left:18px;color:var(--warn);font-size:.9rem}.files a{color:#9cc2ff;margin-right:12px;font-size:.9rem}
.empty{color:var(--dim);text-align:center;padding:30px}
</style>
</head>
<body><div class="wrap">
<h1>Sponsored runs</h1><p class="sub">Every printed run: its proof, the printer's files, what still needs doing, and how many times its QR codes have been scanned.</p>
<div class="key" id="key"><input id="k" type="password" placeholder="Admin password, to see scans" autocomplete="current-password"><button id="kGo" type="button">Show scans</button></div>
<div id="list"><p class="empty">Opening…</p></div>
</div>
<script>
(function(){
  function $(i){ return document.getElementById(i); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var K='', RUNS=[], LINKS={}, SCANS=null;
  try{ K=localStorage.getItem('mf-admin-key')||''; }catch(e){}
  function draw(){ if(!RUNS.length){ $('list').innerHTML='<p class="empty">No runs yet.</p>'; return; }
    $('list').innerHTML=RUNS.slice().reverse().map(function(r){ var f='/print/out/'+r.id+'/'+r.id+'-', ok=/approved|ordered|shipped|delivered/.test(r.status);
      var codes=Object.keys(LINKS).filter(function(c){ return LINKS[c].run===r.id; });
      var total=0, rows=codes.map(function(c){ var s=SCANS&&SCANS[c], n=s?s.n:0; total+=n; return '<tr><td>'+esc(c)+'</td><td>'+esc(LINKS[c].what)+'</td><td>'+esc(LINKS[c].to||'not set (manna-fish.com)')+'</td><td class="n">'+(SCANS?n:'·')+'</td></tr>'; }).join('');
      return '<div class="run"><div class="h"><b>'+esc(r.id)+' · '+esc(r.title)+'</b><small>'+esc(r.qty)+' cards'+(r.sponsor?' · '+esc(r.sponsor)+(r.anonymous?' (anonymous)':''):'')+(SCANS?' · '+total+' scans':'')+'</small><span class="st'+(ok?' ok':'')+'">'+esc(r.status)+'</span></div>'
        +'<a href="'+f+'proof.png" target="_blank" rel="noopener"><img src="'+f+'proof.png" alt="Proof for '+esc(r.id)+'" loading="lazy"></a>'
        +'<div class="files"><a href="'+f+'proof.pdf">Proof PDF</a><a href="'+f+'1-decal-white-ink.png">1 Decal</a><a href="'+f+'2-backing-front.pdf">2 Backing front</a><a href="'+f+'3-cut-lines.pdf">3 Cut lines</a><a href="'+f+'4-back.pdf">4 Back</a><a href="'+f+'printer-notes.md">Printer notes</a></div>'
        +'<table><tr><th>QR</th><th>What</th><th>Goes to</th><th>Scans</th></tr>'+rows+'</table>'
        +(r.warn&&r.warn.length?'<ul class="w">'+r.warn.map(function(w){ return '<li>'+esc(w)+'</li>'; }).join('')+'</ul>':'')+'</div>'; }).join(''); }
  function scans(){ if(!K) return; fetch('/api/qr/stats?k='+encodeURIComponent(K),{cache:'no-store'}).then(function(r){ if(r.status===403){ K=''; throw 0; } return r.json(); })
    .then(function(j){ try{ localStorage.setItem('mf-admin-key',K); }catch(e){} SCANS={}; Object.keys(j.codes||{}).forEach(function(c){ SCANS[c]=j.codes[c]; }); $('key').hidden=true; draw(); }).catch(function(){}); }
  $('kGo').addEventListener('click',function(){ K=$('k').value.trim(); scans(); });
  Promise.all([fetch('/print/runs.json',{cache:'no-store'}).then(function(r){ return r.json(); }),fetch('/print/links.json',{cache:'no-store'}).then(function(r){ return r.json(); })])
    .then(function(a){ RUNS=a[0].runs||[]; LINKS=a[1]||{}; draw(); scans(); }).catch(function(){ $('list').innerHTML='<p class="empty">Couldn’t open the list of runs.</p>'; });
})();
</script>
</body>
</html>
