<!-- Ken, 30 Oct: "got a 'picture verse' in mind? Create one here, using OpenAI / ChatGPT? Or upload image here, and overlay scripture with an
     image? Make that a feature on the 3 dots, too, that user can share with others, using any language or version of the bible."
     /picture/?r=Ezekiel+37:9&v=kjv&l=en opens with that verse; ?embed=1 is the devotional's window onto it, ?back=1 came from the Bible.
     The words come from the Bible versions that are free to print (public domain, or the Hindi IRV with its CC BY-SA line); versions under
     copyright (NET, ESV) wait for permission. A picture is made on the server (/api/picture) with a few a day for each person; a photo of
     one's own is drawn here in the browser and never leaves the phone. -->
<style>
@font-face{font-family:'MFHobo';src:url(/fish-lang/hobo.woff2) format('woff2');font-display:block}
:root{--bg:#000;--card:#0d0d0f;--card2:#16171b;--line:rgba(200,215,218,.16);--text:#eaf0f0;--dim:#9fb2b6;--blue:#2a5fb0;--gold:#f5d76e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.5 'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:max(24px,env(safe-area-inset-bottom))}
button,select,input,textarea{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left))}
.bar h1{margin:0;font:600 1.1rem 'Fraunces',Georgia,serif;text-align:center;white-space:nowrap}
.ib{justify-self:start;border:1px solid var(--line);background:none;border-radius:999px;height:40px;padding:0 14px;font-weight:700;font-size:.9rem;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));display:grid;gap:14px}
.stage{position:relative;display:flex;justify-content:center}
canvas{display:block;max-width:100%;max-height:58vh;width:auto;height:auto;border-radius:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.9);touch-action:none;cursor:grab;background:#111}
canvas:active{cursor:grabbing}
.hint{text-align:center;color:var(--dim);font-size:.82rem;margin:-6px 0 0}
.acts{display:flex;gap:10px;justify-content:center}
.btn{border:0;border-radius:999px;height:46px;padding:0 22px;font-weight:700;cursor:pointer;background:#fff;color:#0b0f14}
.btn.alt{background:none;color:var(--text);border:1.5px solid rgba(255,255,255,.4)}
.btn[disabled]{opacity:.5;cursor:default}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;min-width:0}
.sec h2{margin:0;font:800 .74rem 'Archivo',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
input[type=text],textarea,select{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:84px;font:1rem/1.5 'Spectral',Georgia,serif}
select{height:44px;padding:0 10px}
.ref{flex:2 1 180px}.ver{flex:1 1 140px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--card2);border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:7px 13px;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--dim)}
.seg button[aria-pressed=true]{background:#fff;color:#0b0f14}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:42px;height:42px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw button[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
.pane[hidden]{display:none}
label.sl{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--dim)}
label.sl input{flex:1}
.msg{font-size:.88rem;color:var(--gold);margin:0}.msg:empty{display:none}
.left{font-size:.82rem;color:var(--dim)}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.note{font-size:.78rem;color:var(--dim);margin:0}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #93bff5;outline-offset:2px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>

  </section>
</main>
