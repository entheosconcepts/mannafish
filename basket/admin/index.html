<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Basket requests</title>
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<!-- Ken, 21 Oct: "build out the fish basket". Every basket request (for me, a gift, a church or Free Fish Embassy), newest first:
     the fish and how many, where to send them, the note, and where each one is (requested, packed, sent, delivered). The person
     sees the same under You -> Orders. The key is MF_ADMIN_KEY in Netlify (or PROOF_KEY); it is kept on this device after the first time. -->
<style>
:root{--ink:#000;--ink2:#0b1620;--foam:#eaf0f0;--dim:#9fb2b6;--blue:#2a5fb0;--line:rgba(200,215,218,.18);--red:#c8423c;--gold:#f5d76e;--ok:#7fd18b}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--foam);font:1rem/1.5 'Archivo',system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
header b{font-size:1.1rem}header a{color:var(--foam);font-size:.9rem}
main{max-width:860px;margin:0 auto;padding:16px}
.key{display:flex;gap:8px;margin:20px 0}.key input{flex:1;min-width:0}
input,textarea{font:inherit;color:var(--foam);background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
button{font:700 .9rem 'Archivo',sans-serif;border-radius:999px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--foam)}
button.ok{background:var(--blue);border-color:var(--blue);color:#fff}button[aria-pressed="true"]{background:#fff;color:#000}
.tabs{display:flex;gap:8px;margin:6px 0 16px;flex-wrap:wrap}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}.sum div{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}.sum b{display:block;font-size:1.4rem}.sum small{color:var(--dim)}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 14px;background:var(--ink2);display:flex;flex-direction:column;gap:8px}
.meta{font-size:.82rem;color:var(--dim)}.meta b{color:var(--gold);text-transform:uppercase;letter-spacing:.1em;font-size:.72rem}
.who{font-weight:800;font-size:1.05rem}
.fish{margin:0;padding-left:18px}
.addr{white-space:pre-line;background:#000;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:.92rem}
.note{font:italic 1.02rem/1.5 'Spectral',Georgia,serif;white-space:pre-wrap}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.st button.on{background:var(--ok);border-color:var(--ok);color:#06210c}
.empty,.msg{color:var(--dim);text-align:center;padding:20px}
@media print{header,.key,.tabs,.sum,.row,.memo{display:none!important}body{background:#fff;color:#000}.card{border:1px solid #999;background:#fff;break-inside:avoid}.addr{background:#fff;color:#000}}
</style>
</head>
<body>
<header><b>🧺 Basket requests</b><a href="/">MannaFish</a></header>
<main>
  <div class="key" id="keyBox" hidden><input id="key" type="password" placeholder="Admin key (MF_ADMIN_KEY)" autocomplete="current-password"><button class="ok" id="keyGo">Open</button></div>
  <div class="sum" id="sum" hidden></div>
  <div class="tabs" id="tabs" hidden><button data-t="open" aria-pressed="true">To do</button><button data-t="sent" aria-pressed="false">Sent</button><button data-t="all" aria-pressed="false">All</button><button id="print">Print to do</button></div>
  <div id="list"><p class="msg">Opening…</p></div>
</main>
<script>
(function(){
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var K='', ALL=[], TAB='open', ST=['requested','packed','sent','delivered','cancelled'], NM={requested:'Requested',packed:'Packed',sent:'Sent',delivered:'Delivered',cancelled:'Cancelled'};
  var LN={en:'English',es:'Español',tl:'Tagalog',zh:'中文',hi:'हिन्दी',el:'Ελληνικά',de:'Deutsch',ko:'한국어',he:'עברית',ar:'العربية',ru:"Русский"};
  try{ K=localStorage.getItem('mf-admin-k')||''; }catch(e){}
  function load(){ fetch('/api/basket/admin?k='+encodeURIComponent(K)).then(function(r){ if(r.status===403) throw 403; if(!r.ok) throw r.status; return r.json(); })
      .then(function(j){ ALL=j.requests||[]; $('keyBox').hidden=true; $('tabs').hidden=false; $('sum').hidden=false; try{ localStorage.setItem('mf-admin-k',K); }catch(e){} draw(); })
      .catch(function(e){ $('keyBox').hidden=false; $('list').innerHTML='<p class="msg">'+(e===403?(K?'That key did not work.':'Type the admin key to see the requests.'):'Could not load the requests just now.')+'</p>'; }); }
  function n(r){ return (r.items||[]).reduce(function(t,x){ return t+(+x.q||0); },0); }
  function shipTo(r){ return [r.for==='gift'?r.to:r.for==='church'?r.org+' (attn. '+r.name+')':r.name,r.street,r.city+' '+r.zip,r.country&&r.country!=='United States'?r.country:''].filter(Boolean).join('\n'); }
  function draw(){ var open=ALL.filter(function(r){ return r.status==='requested'||r.status==='packed'; });
    $('sum').innerHTML=[['To do',open.length],['Fish to send',open.reduce(function(t,r){ return t+n(r); },0)],['Sent',ALL.filter(function(r){ return r.status==='sent'||r.status==='delivered'; }).length],['All requests',ALL.length]].map(function(x){ return '<div><b>'+x[1]+'</b><small>'+x[0]+'</small></div>'; }).join('');
    var L=TAB==='open'?open:TAB==='sent'?ALL.filter(function(r){ return r.status==='sent'||r.status==='delivered'; }):ALL;
    $('list').innerHTML=L.length?L.map(function(r){ var kind=r.for==='gift'?'Gift for '+r.to:r.for==='church'?'Church: '+r.org+(r.baskets?' · '+r.baskets+' baskets':''):'For themselves';
      return '<div class="card" data-id="'+esc(r.id)+'"><div class="meta"><b>'+esc(NM[r.status]||r.status)+'</b> · '+esc(new Date(r.at).toLocaleString())+' · '+esc(kind)+'</div>'
        +'<div class="who">'+esc(r.name)+' &lt;'+esc(r.email)+'&gt;'+(r.phone?' · '+esc(r.phone):'')+'</div>'
        +'<ul class="fish">'+(r.items||[]).map(function(x){ return '<li>'+x.q+' × <b>'+esc(x.word)+'</b>'+(x.l&&x.l!=='en'?' ('+esc(LN[x.l]||x.l)+')':'')+(x.ref?' · '+esc(x.ref):'')+'</li>'; }).join('')+'</ul>'
        +'<div><b>'+n(r)+' decals</b> · ship to:</div><div class="addr">'+esc(shipTo(r))+'</div>'
        +(r.note?'<div class="note">“'+esc(r.note)+'”</div>':'')
        +'<div class="row"><button data-copy="1">Copy address</button></div>'
        +'<div class="row st">'+ST.map(function(s){ return '<button data-st="'+s+'" class="'+(r.status===s?'on':'')+'">'+NM[s]+'</button>'; }).join('')+'</div>'
        +'<input class="memo" data-memo="1" placeholder="A note for yourself (tracking number, date sent…)" value="'+esc(r.memo||'')+'"></div>'; }).join('')
      :'<p class="empty">'+(TAB==='open'?'Nothing waiting. Every basket is on its way.':'None yet.')+'</p>'; }
  function save(id,body){ body.k=K; body.id=id; return fetch('/api/basket/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){ return r.json(); })
    .then(function(j){ if(!j.ok) throw 0; ALL=ALL.map(function(r){ return r.id===id?j.request:r; }); draw(); }).catch(function(){ alert('Could not save just now.'); }); }
  $('list').addEventListener('click',function(e){ var c=e.target.closest('.card'); if(!c) return; var id=c.dataset.id, b;
    if((b=e.target.closest('[data-st]'))){ save(id,{status:b.dataset.st}); return; }
    if(e.target.closest('[data-copy]')){ var r=ALL.filter(function(x){ return x.id===id; })[0]; (navigator.clipboard?navigator.clipboard.writeText(shipTo(r)):Promise.reject()).then(function(){ e.target.textContent='Copied'; },function(){}); } });
  $('list').addEventListener('change',function(e){ if(!e.target.dataset.memo) return; save(e.target.closest('.card').dataset.id,{memo:e.target.value}); });
  $('tabs').addEventListener('click',function(e){ var b=e.target.closest('[data-t]'); if(b){ TAB=b.dataset.t; [].forEach.call(this.querySelectorAll('[data-t]'),function(x){ x.setAttribute('aria-pressed',String(x===b)); }); draw(); return; }
    if(e.target.id==='print'){ TAB='open'; draw(); setTimeout(function(){ window.print(); },100); } });
  $('keyGo').addEventListener('click',function(){ K=$('key').value.trim(); load(); });
  $('key').addEventListener('keydown',function(e){ if(e.key==='Enter') $('keyGo').click(); });
  load();
})();
</script>
</body>
</html>
