<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MannaFish · Bible</title>
<meta name="description" content="The whole Bible in MannaFish: every book and chapter, highlights, cross references and read-aloud.">
<meta name="theme-color" content="#000000">
<script src="/fish-lang/spell/spell.js" defer onload="MFspell.watch('#aNoteT,#aLinkNote')"></script>
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Spectral:ital,wght@0,400;0,500;1,400&family=Archivo:wght@400;600;700;800&display=swap">
<!-- Ken, 20 Oct: "Definitely not enough access to the bible for cross references, and making this app their go-to for the word of God.
     Would like this to be an alternative to the YouVersion bible app, but more interactive and vision driven."
     The whole Bible: any book and chapter, the versions the site can show in full, verses to highlight (the same highlights as the rest
     of MannaFish: My highlights, and the account when signed in), cross references (OpenBible.info, CC BY), read-aloud, and links to
     share a verse. /bible/?r=John+3:16 opens a verse; ?embed=1 is the devotional's own window onto it. -->
<style>
@font-face{font-family:'MFHobo';src:url(/fish-lang/hobo.woff2) format('woff2');font-display:block}
:root{--bg:#000;--card:#0d0d0f;--card2:#16171b;--line:rgba(200,215,218,.14);--text:#eaf0f0;--dim:#9fb2b6;--blue:#2a5fb0;--blue2:#3370ff;--gold:#f5d76e;--sel:rgba(51,112,255,.28);color-scheme:dark}
:root[data-mode=light]{--bg:#f7f5ef;--card:#fff;--card2:#ece9df;--line:rgba(30,40,50,.14);--text:#1c2228;--dim:#5b6670;--blue:#2a5fb0;--blue2:#2a5fb0;--gold:#a87b00;--sel:rgba(42,95,176,.18);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:17px/1.5 'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 10px}
.brand{font:400 1.45rem/1 'MFHobo',cursive;text-decoration:none;color:#fff;-webkit-text-stroke:.07em #14181d;paint-order:stroke fill;flex:none}.brand b{font-weight:400;color:#448ff1;-webkit-text-stroke:0}
.ib{flex:none;border:1px solid var(--line);background:none;border-radius:999px;height:40px;min-width:40px;padding:0 12px;font-weight:700;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--text)}
.ib[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.where{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:999px;height:40px;padding:0 14px;font:600 1rem 'Fraunces',Georgia,serif;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where::after{content:' ▾';font-size:.8em;opacity:.7}
.ver{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;height:40px;padding:0 8px;font-weight:700;font-size:.85rem;max-width:96px}
.back{display:none}.embed .back{display:inline-flex}.embed .brand,.embed .home{display:none}
main{max-width:760px;margin:0 auto;padding:6px 18px 130px}
h1{font:600 1.7rem 'Fraunces',Georgia,serif;margin:18px 0 4px}
.sub{color:var(--dim);font-size:.85rem;margin:0 0 10px}
.txt{font-family:var(--ff,'Spectral',Georgia,serif);font-size:var(--fs,1.18rem);line-height:var(--lh,1.85)}
.novn .txt .v .vn{display:none}.lines .txt .v{display:block;margin:0 0 .45em}.lines .txt .nis{display:block;margin-top:-.4em}.nomarks .txt .nis{display:none}
.txt .v{cursor:pointer;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone;transition:background .15s}
.txt .v.hl{color:#14181c}
.txt .v.say{outline:2px solid var(--blue2);outline-offset:1px}
.txt .v.flash{animation:fl 2.2s ease}
@keyframes fl{0%,60%{background:rgba(245,215,110,.45)}100%{background:none}}
.pn{display:flex;justify-content:space-between;gap:10px;margin:26px 0 0}
.pn button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;cursor:pointer;font-weight:700;text-align:left}
.pn button:last-child{text-align:right}.pn small{display:block;color:var(--dim);font-weight:600;font-size:.78rem}
.pn button[disabled]{visibility:hidden}
.note{color:var(--dim);font-size:.78rem;margin-top:22px}
.note a{color:var(--dim)}
.msg{color:var(--dim);padding:30px 0;text-align:center}
/* the verse tools (Ken, 20 Oct: "this is the behavior I am looking for with the highlight feature" -- like the Bible App) */
.txt .v .vn{font:700 .66rem 'Archivo',sans-serif;color:var(--dim);vertical-align:super;margin:0 3px 0 2px}
.txt .v.hl .vn{color:#14181c;opacity:.7}
.txt .v.sel .vt{text-decoration:underline dotted 2px;text-underline-offset:6px}
.txt .ni{border:0;background:none;padding:0 2px;margin:0 2px;cursor:pointer;color:var(--dim);vertical-align:-3px}
.txt .ni svg{width:18px;height:18px}
.selbar{position:fixed;top:0;left:0;right:0;z-index:25;background:var(--bg);border-bottom:1px solid var(--line);text-align:center;font-weight:800;font-size:.92rem;padding:max(12px,env(safe-area-inset-top)) 12px 12px;transform:translateY(-110%);transition:transform .2s}
.selbar.on{transform:none}
.act{position:fixed;left:8px;right:8px;bottom:8px;z-index:30;background:var(--card2);border:1px solid var(--line);border-radius:22px;box-shadow:0 -14px 34px -10px rgba(0,0,0,.6);
  transform:translateY(130%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:8px 12px max(10px,env(safe-area-inset-bottom));max-height:78vh;overflow:auto;touch-action:pan-y}
.act.open{transform:none}
.act .in{max-width:760px;margin:0 auto}
.act .grab{display:block;width:44px;height:5px;border-radius:3px;background:var(--dim);opacity:.5;margin:2px auto 10px;border:0;padding:0;cursor:pointer}
.act .top{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.pill{flex:1 1 100%;min-width:0;display:flex;align-items:center;justify-content:space-around;gap:8px;background:var(--card);border-radius:16px;padding:0 10px;height:58px}
.pill button{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer;display:grid;place-items:center;color:#14181c;font-size:1.2rem;font-weight:800}
.pill button[aria-pressed=true]{border-color:var(--text)}
.tile{flex:1;min-width:0;height:58px;border:0;border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:.76rem;cursor:pointer;color:var(--text)}
@media (min-width:640px){.pill{flex:1 1 auto;height:70px}.tile{flex:none;width:76px;height:70px;flex-direction:column;gap:5px;font-size:.82rem}.act .top{flex-wrap:nowrap}}
.tile svg{width:22px;height:22px}.tile[aria-pressed=true]{color:var(--blue2)}
.moreh{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-weight:600;font-size:.88rem;border:0;background:none;width:100%;padding:12px 0 2px;cursor:pointer}
.act .more{display:none;padding-top:6px}.act.big .more{display:block}.act.big .moreh{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 13px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--text)}
.nbox{margin-top:12px}.nbox textarea{width:100%;min-height:96px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px;font:400 1rem/1.5 'Archivo',sans-serif}
.nbox .row{margin-top:8px;justify-content:flex-end}
.xr{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.xr h4{margin:4px 0 6px;font:800 .72rem 'Archivo',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.xr button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 2px;cursor:pointer}
.xr button b{font-weight:700;font-size:.92rem}.xr button span{display:block;font:400 .98rem/1.5 'Spectral',Georgia,serif;color:var(--dim);margin-top:2px}
.txt mark.ph{color:#14181c;border-radius:3px;padding:0 1px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ml{display:flex;gap:6px;align-items:stretch}.ml button:first-child{flex:1}.ml .mdel{flex:none;width:40px;text-align:center;color:var(--dim)}
.xr .ml button span{font:400 .9rem/1.4 'Archivo',sans-serif}
.lk{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:8px}.lk input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 10px;font:inherit;font-weight:400}
.nbox textarea#aLinkNote{min-height:64px}
.linkbar{position:fixed;left:8px;right:8px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:26;max-width:744px;margin:0 auto;background:var(--blue);color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:.9rem}
.linkbar[hidden]{display:none}.linkbar b{flex:1;font-weight:700}.linkbar .chip{color:#fff;border-color:rgba(255,255,255,.6)}
.histb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:22;border:0;border-radius:999px;background:var(--blue);color:#fff;font-weight:800;font-size:.92rem;padding:11px 18px;box-shadow:0 8px 24px -8px rgba(0,0,0,.6);cursor:pointer;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.histb[hidden]{display:none}.histb small{opacity:.8}
.embed .histb,.embed .linkbar{bottom:calc(20px + env(safe-area-inset-bottom))}
.linkbar:not([hidden])~.histb{display:none}
.mine{margin:4px 0 6px}.mine button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;margin:0 0 6px;cursor:pointer}
.mine b{font-size:.92rem}.mine span{display:block;color:var(--dim);font-size:.85rem;margin-top:2px}
/* the book and chapter picker */
.pick{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.pick.open{display:flex}
.pick .hd{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line)}
.pick .hd b{flex:1;font:600 1.15rem 'Fraunces',Georgia,serif;text-align:center}
.pick .body{flex:1;overflow:auto;padding:10px 14px 30px;max-width:760px;width:100%;margin:0 auto}
.pick h5{margin:14px 2px 8px;font:800 .72rem 'Archivo',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.books button,.chs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 8px;cursor:pointer;font-weight:600;font-size:.92rem;text-align:left}
.books button.on,.chs button.on{border-color:var(--blue2);color:var(--blue2)}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.chs button{text-align:center;padding:12px 0}
.find{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font:inherit;color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:700;font-size:.9rem;z-index:60;display:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{display:block}
.act.open~.toast{bottom:auto;top:calc(64px + env(safe-area-inset-top))}
/* the Greek or Hebrew behind the words (Ken, 20 Oct) */
.tile .ogi{font:600 1.3rem/22px 'Spectral',Georgia,serif;height:22px}
.og{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.og h4{margin:4px 0 8px;font:800 .72rem 'Archivo',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.og1{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 8px}
.og1 .ogw{font:500 1.7rem/1.2 'Spectral','SBL Hebrew','Times New Roman',serif}.og1 .ogw small{font:600 .85rem 'Archivo',sans-serif;color:var(--dim);margin-left:8px}
.og1 .ogt{color:var(--dim);font-size:.92rem;margin:2px 0 6px}.og1 .ogt b{color:var(--text)}
.og1 .ogl{font-size:.92rem}.og1 .ogl b{font:500 1.15rem 'Spectral',serif}
.og1 .ogd{margin:6px 0 4px;font:400 .98rem/1.5 'Spectral',Georgia,serif}
.og1 .ogu{color:var(--dim);font-size:.82rem}
.og1 .row{margin-top:8px}
.ogv{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.ogv[dir=rtl]{direction:rtl}
.ogv button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:44px}
.ogv button span{font:500 1.15rem/1.3 'Spectral','Times New Roman',serif}.ogv button small{font-size:.7rem;color:var(--dim);direction:ltr}
.ogv button.on{border-color:var(--blue2);box-shadow:0 0 0 1px var(--blue2)}.ogv button.mt{background:var(--sel)}
.og .cr{color:var(--dim);font-size:.75rem;margin:6px 0 0}.og .cr a{color:var(--dim)}
/* choose highlights to take off (Ken, 20 Oct: "remove all highlights, or click and remove only selected highlights") */
.pace{text-align:center;margin:22px 0 0}.pace .hlm{font-size:.95rem;padding:10px 18px}.pace .hlm[aria-pressed=true]{background:#7fd18b;border-color:#7fd18b;color:#06210c}
.hlm{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--text);margin:0 0 10px}
.hlon .txt .v:not(.hl){opacity:.55}.hlon .txt .v.hl,.hlon .txt mark.ph{outline:2px dashed transparent;outline-offset:2px}
.hlon .txt .v.hl.gone,.hlon .txt mark.ph.gone{outline-color:#e8735c;opacity:.45;text-decoration:line-through}
/* the contents (Ken, 20 Oct: "when someone clicks on the bible, I want the table of contents to open") */
.vchips{display:flex;flex-wrap:wrap;gap:6px}.vchips button,.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-weight:700;font-size:.86rem;cursor:pointer}
.vchips button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.seg{display:flex;gap:6px;margin:12px 0 2px}.seg button{flex:1}
.cont{display:flex;align-items:center;gap:10px;width:100%;margin:12px 0 0;border:1px solid var(--blue2);background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left}
.cont b{flex:1;font:600 1.1rem 'Fraunces',Georgia,serif}.cont small{display:block;color:var(--dim);font:600 .78rem 'Archivo',sans-serif}
.recent{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.recent button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.86rem;cursor:pointer}
.acc{display:block;margin:14px 0 0;border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:12px 14px;color:var(--text);text-decoration:none;font-size:.9rem}.acc b{display:block;font-size:.98rem;margin-bottom:2px}.acc span{color:var(--dim)}
[hidden]{display:none!important}
@media (max-width:420px){.brand{display:none}.txt{font-size:var(--fs,1.12rem)}.embed #mode{display:none}.embed .back .bl{display:none}}
</style>
<script src="/fish-lang/tabbar.js" defer></script>
<script src="/fish-lang/basket.js" defer></script>
<script src="/fish-lang/account.js" defer></script>
</head>
<body>
<div class="bar"><div class="in">
  <button type="button" class="ib back" id="back" aria-label="Back to the devotional">&lsaquo;<span class="bl">&nbsp;Devotional</span></button>
  <a class="brand" href="/">Manna<b>Fish</b></a>
  <button type="button" class="where" id="where" aria-haspopup="dialog">John 1</button>
  <select class="ver" id="ver" aria-label="Bible version"></select>
  <button type="button" class="ib" id="say" aria-pressed="false" aria-label="Listen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
  <button type="button" class="ib" id="mode" aria-label="Light or dark">&#9728;&#xFE0E;</button>
</div></div>
<main id="main">
  <h1 id="title"></h1><p class="sub" id="sub"></p><button type="button" class="hlm" id="hlmBtn" hidden></button>
  <div class="txt" id="txt"><p class="msg">Opening…</p></div>
  <p class="pace" id="paceRow" hidden><button type="button" class="hlm" id="paceBtn" aria-pressed="false"></button></p>
  <div class="pn"><button type="button" id="prev"></button><button type="button" id="next"></button></div>
  <p class="note" id="note"></p>
</main>

<div class="selbar" id="selbar" aria-live="polite"></div>
<div class="linkbar" id="linkbar" hidden><b></b><button type="button" class="chip" id="linkX">Cancel</button></div>
<div class="linkbar" id="hlbar" hidden><b>Tap the ones to remove</b><button type="button" class="chip" id="hlAll">All</button><button type="button" class="chip" id="hlGo" style="background:#e8735c;border-color:#e8735c">Remove</button><button type="button" class="chip" id="hlX">Done</button></div>
<button type="button" class="histb" id="hist" hidden></button>
<div class="act" id="act" role="dialog" aria-label="Verse"><div class="in">
  <button type="button" class="grab" id="aGrab" aria-label="More"></button>
  <div class="top"><div class="pill" id="aDots" role="group" aria-label="Highlight"></div>
    <button type="button" class="tile" id="aSave" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Save</span></button>
    <button type="button" class="tile" id="aNote"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Note</span></button>
    <button type="button" class="tile" id="aPray"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c-1.5 2-2 5-2 8v6l-3 3M12 3c1.5 2 2 5 2 8v6l3 3"/><path d="M10 11l-3 2M14 11l3 2"/></svg><span>Pray</span></button>
    <button type="button" class="tile" id="aLink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>Link</span></button>
    <button type="button" class="tile" id="aOrigT" aria-pressed="false"><span class="ogi" id="aOrigI" aria-hidden="true">&alpha;</span><span id="aOrigL">Greek</span></button>
    <button type="button" class="tile" id="aCopy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><span>Copy</span></button></div>
  <button type="button" class="moreh" id="aMore">&#8963; Swipe up for more</button>
  <div class="more">
    <div class="row"><button type="button" class="chip" id="aShare">Share</button><button type="button" class="chip" id="aSay">&#9654;&#xFE0E; Listen from here</button><button type="button" class="chip" id="aX">Done</button></div>
    <div class="nbox" id="aNoteBox" hidden><textarea id="aNoteT" placeholder="What is God showing you here?"></textarea><div class="row"><button type="button" class="chip" id="aNoteDel" hidden>Delete note</button><button type="button" class="chip" id="aNoteSave" style="background:var(--blue);border-color:var(--blue);color:#fff">Save note</button></div></div>
    <div class="nbox" id="aLinkBox" hidden><label class="lk">Link to <input id="aLinkTo" type="text" placeholder="a verse, like Romans 5:8" autocomplete="off"></label>
      <textarea id="aLinkNote" placeholder="Why these go together (optional)"></textarea><p class="sub" id="aLinkMsg" aria-live="polite"></p>
      <div class="row"><button type="button" class="chip" id="aLinkPick">&#128214;&#xFE0E; Choose in the Bible</button><button type="button" class="chip" id="aLinkSave" style="background:var(--blue);border-color:var(--blue);color:#fff">Save link</button></div></div>
    <div class="og" id="aOrig" hidden></div>
    <div class="xr" id="aMine"></div>
    <div class="xr" id="aXr"></div>
  </div>
</div></div>

        var sp=box.querySelector('span[data-n="'+n+'"]'); if(sp) sp.textContent=w.join(' ')+(to>x[2]+2||x[3]?' …':''); }).catch(function(){}); }); }); }
  $('aXr').addEventListener('click',function(e){ var b=e.target.closest('[data-x]'); if(!b) return; var t=b.dataset.x.split(',').map(Number); HIST.push({b:AT.b,c:AT.c,v:SEL[0]}); go(t[0],t[1],t[2]); backUI(); });
  // ‹ Back to where I started: on screen, above the tabs, until I go back
  function backUI(){ var h=HIST[HIST.length-1], b=$('hist'); if(!h){ b.hidden=true; return; } b.hidden=false; b.innerHTML='&lsaquo; Back to '+esc(plain(h.b,h.c,h.v))+(HIST.length>1?' <small>('+HIST.length+')</small>':''); }
  $('hist').addEventListener('click',function(){ var x=HIST.pop(); if(x) go(x.b,x.c,x.v); backUI(); });

  // ── listen: the device's own voice, verse by verse, following along on the page ──
  var SAY={on:false,i:0};
  function voice(){ var vs=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(function(v){ return /^en/i.test(v.lang); }), want=SET('voice','');
    if(want){ var w=vs.filter(function(v){ return v.voiceURI===want||v.name===want; })[0]; if(w) return w; }
    return vs.filter(function(v){ return /en-(US|GB)/i.test(v.lang)&&/natural|premium|enhanced|samantha|daniel|google/i.test(v.name); })[0]||vs[0]||null; }
  function stopSay(){ SAY.on=false; try{ speechSynthesis.cancel(); }catch(e){} [].forEach.call(document.querySelectorAll('.v.say'),function(s){ s.classList.remove('say'); }); $('say').setAttribute('aria-pressed','false'); }
  function startSay(v){ if(!window.speechSynthesis){ toast('This device cannot read aloud'); return; } stopSay(); SAY={on:true,i:Math.max(0,(v||1)-1)}; $('say').setAttribute('aria-pressed','true'); next(); }
  function next(){ if(!SAY.on) return; var L=[].slice.call($('txt').querySelectorAll('.v')); [].forEach.call(document.querySelectorAll('.v.say'),function(s){ s.classList.remove('say'); });
    var el=L[SAY.i]; if(!el){ var nb=$('next').dataset.to; stopSay(); if(SET('cont',true)&&nb){ AUTOSAY=1; $('next').click(); } return; } el.classList.add('say'); var r=el.getBoundingClientRect(); if(r.top<70||r.bottom>innerHeight-80) window.scrollBy({top:r.top-innerHeight/3,behavior:'smooth'});
    var u=new SpeechSynthesisUtterance((SAY.i===0?B[AT.b][0]+' chapter '+AT.c+'. ':'')+el.querySelector('.vt').textContent), vv=voice(); if(vv){ u.voice=vv; u.lang=vv.lang; } else u.lang='en-US'; u.rate=+SET('rate',0.95)||0.95;
    u.onend=function(){ SAY.i++; next(); }; u.onerror=function(e){ if(e.error!=='interrupted'&&e.error!=='canceled'){ SAY.i++; next(); } }; speechSynthesis.speak(u); }
  $('say').addEventListener('click',function(){ if(SAY.on) stopSay(); else { var L=[].slice.call($('txt').querySelectorAll('.v')), i=L.findIndex(function(s){ return s.getBoundingClientRect().bottom>80; }); startSay(i>=0?i+1:1); } });

  // ── the book and chapter picker ──
  var OM='read'; try{ OM=sessionStorage.getItem('mf-bible-om')||'read'; }catch(e){}
  function openPick(){ $('pick').classList.add('open'); books(); }
  // opened to listen: the device's voice starts with the chapter (a sound now, while the tap counts, so a phone lets it speak later)
  function unlockSay(){ if(OM!=='listen'||!window.speechSynthesis) return; try{ var u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }catch(e){} AUTOSAY=1; }
  function closePick(){ $('pick').classList.remove('open'); }
  $('where').addEventListener('click',openPick); $('pX').addEventListener('click',closePick); $('pBack').addEventListener('click',books);
  function books(q){ $('pTitle').textContent='Books'; $('pBack').hidden=true; q=(q||'').toLowerCase();
    var grid=function(a,z){ return '<div class="books">'+B.slice(a,z).map(function(x,i){ var n=a+i; if(q&&x[0].toLowerCase().indexOf(q)<0&&x[0].toLowerCase().replace(/ /g,'').indexOf(q.replace(/ /g,''))<0) return ''; return '<button type="button" data-b="'+n+'" class="'+(n===AT.b?'on':'')+'">'+esc(x[0])+'</button>'; }).join('')+'</div>'; };
    var sv=q?[]:saved().slice(0,30), nt=q?[]:(function(){ var N=nall(), o=[]; Object.keys(N).forEach(function(k){ if(k.indexOf('BIBLE:')===0) (N[k]||[]).forEach(function(n){ if(n.vs) o.push({ref:k.slice(6),b:n.b,c:n.c,vs:n.vs,text:n.text,at:n.at,ed:n.ed}); }); }); return o.sort(function(a,b){ return (b.ed||b.at)-(a.ed||a.at); }).slice(0,30); })();
    var mine=(sv.length?'<h5>Saved</h5><div class="mine">'+sv.map(function(x){ return '<button type="button" data-go="'+x.b+','+x.c+','+x.v+'"><b>'+esc(x.ref)+'</b><span>'+esc(x.text.slice(0,120))+'</span></button>'; }).join('')+'</div>':'')
      +(nt.length?'<h5>My notes</h5><div class="mine">'+nt.map(function(x){ return '<button type="button" data-go="'+x.b+','+x.c+','+x.vs[0]+'"><b>'+esc(x.ref)+'</b><span>'+esc(x.text.slice(0,140))+'</span></button>'; }).join('')+'</div>':'');
    var H=q?[]:hist().filter(function(x){ return B[x.b]; }).slice(0,12), last=H[0];
    var top=q?'':'<h5>Version</h5><div class="vchips">'+VERS.map(function(v){ return '<button type="button" data-ver="'+v.k+'" aria-pressed="'+(v.k===ver().k)+'" title="'+esc(v.n)+'">'+esc(v.s)+'</button>'; }).join('')+'</div><p class="sub" style="margin:6px 2px 0">'+esc(ver().n)+'</p>'
      +'<div class="seg" role="group" aria-label="Open to"><button type="button" data-om="read" aria-pressed="'+(OM!=='listen')+'">&#128214;&#xFE0E; Read</button><button type="button" data-om="listen" aria-pressed="'+(OM==='listen')+'">&#128266;&#xFE0E; Listen</button></div>'
      +(last?'<button type="button" class="cont" data-go="'+last.b+','+last.c+',0"><b><small>'+(OM==='listen'?'Keep listening':'Continue reading')+'</small>'+esc(B[last.b][0]+' '+last.c)+'</b>&rsaquo;</button>':'')
      +(H.length>1?'<h5>Recent</h5><div class="recent">'+H.slice(1).map(function(x){ return '<button type="button" data-go="'+x.b+','+x.c+',0">'+esc(B[x.b][0]+' '+x.c)+'</button>'; }).join('')+'</div>':'')
      +(EMBED||(window.MFacct&&(MFacct.me()||MFacct.maybe()))?'':'<a class="acc" href="/you/#acct"><b>Free account</b><span>Keep your notes, prayers, highlights and history on every phone and computer. No password.</span></a>');
    $('pBody').innerHTML='<input class="find" id="pFind" type="search" placeholder="Find a book, or type a reference like John 3:16" value="'+esc(q)+'" autocomplete="off">'
      +top+mine+'<h5>Old Testament</h5>'+grid(0,39)+'<h5>New Testament</h5>'+grid(39,66);
    var f=$('pFind'); f.addEventListener('input',function(){ var pos=this.value; books(pos); var g=$('pFind'); g.focus(); g.setSelectionRange(pos.length,pos.length); });
    f.addEventListener('keydown',function(e){ if(e.key!=='Enter') return; var r=parseRef(this.value); if(r){ closePick(); unlockSay(); go(r.b,r.c,r.v); } }); }
  function chapters(b){ $('pTitle').textContent=B[b][0]; $('pBack').hidden=false; var h='<div class="chs">'; for(var c=1;c<=B[b][1];c++) h+='<button type="button" data-c="'+c+'" class="'+(b===AT.b&&c===AT.c?'on':'')+'">'+c+'</button>'; $('pBody').innerHTML=h+'</div>'; $('pBody').dataset.bk=b; }
  $('pBody').addEventListener('click',function(e){ var vb=e.target.closest('[data-ver]'); if(vb){ ls('mf-bible-version',vb.dataset.ver); $('ver').value=vb.dataset.ver; go(AT.b,AT.c,0,true); books(); if(window.MFacct) MFacct.touch('set'); return; }
    var om=e.target.closest('[data-om]'); if(om){ OM=om.dataset.om; try{ sessionStorage.setItem('mf-bible-om',OM); }catch(er){} books(); return; }
    var g=e.target.closest('[data-go]'); if(g){ var t=g.dataset.go.split(',').map(Number); closePick(); unlockSay(); go(t[0],t[1],t[2]); return; } var b=e.target.closest('button[data-b]'); if(b){ var n=+b.dataset.b; if(B[n][1]===1){ closePick(); unlockSay(); go(n,1); } else chapters(n); return; }
    var c=e.target.closest('[data-c]'); if(c){ closePick(); unlockSay(); go(+$('pBody').dataset.bk,+c.dataset.c); } });
  function parseRef(s){ var m=/^\s*(.+?)\s+(\d+)(?::(\d+))?/.exec(String(s||'').replace(/\+/g,' ')); if(!m) return null; var b=bookIdx(m[1]); if(b<0) return null;
    var c=Math.min(+m[2],B[b][1]); return {b:b,c:Math.max(1,c),v:m[3]?+m[3]:0}; }

  function toast(t){ var e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(function(){ e.classList.remove('on'); },2200); }

  // start: a reference in the link, else where this person last read, else John 1
  var r=parseRef(Q.get('r')||''), last=null; try{ last=JSON.parse(ls('mf-bible-last')||'null'); }catch(e){}
  if(r) go(r.b,r.c,r.v); else if(last&&B[last.b]) go(last.b,Math.min(last.c,B[last.b][1])); else go(42,1);
  if(Q.get('toc')==='1'&&!r){ openPick(); try{ history.replaceState(null,'',location.pathname+location.search.replace(/([?&])toc=1&?/,'$1').replace(/[?&]$/,'')); }catch(e){} }
  // signed in: what comes back from the account shows at once; settings changed on the You page (another tab) too
  function refresh(){ applySet(); paint(); marksUI(); if($('pick').classList.contains('open')&&$('pTitle').textContent==='Books') books(($('pFind')||{}).value||''); }
  window.addEventListener('storage',function(e){ if(!e.key||/^mf-(set|hl|notes2|bible-links|bible-hist)$/.test(e.key)) refresh(); });
  (function hook(n){ if(!window.MFacct){ if(n<50) setTimeout(function(){ hook(n+1); },200); return; } MFacct.on(function(u,what){ refresh(); }); })(0);
  window.MFbible={go:function(ref){ var x=parseRef(ref); if(x) go(x.b,x.c,x.v); }};
})();
</script>
