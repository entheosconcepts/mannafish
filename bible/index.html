<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MannaFish · Bible</title>
<meta name="description" content="The whole Bible in MannaFish: every book and chapter, highlights, cross references and read-aloud.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Spectral:ital,wght@0,400;0,500;1,400&family=Archivo:wght@400;600;700;800&display=swap">
<!-- Ken, 20 Oct: "Definitely not enough access to the bible for cross references, and making this app their go-to for the word of God.
     Would like this to be an alternative to the YouVersion bible app, but more interactive and vision driven."
     The whole Bible: any book and chapter, the versions the site can show in full, verses to highlight (the same highlights as the rest
     of MannaFish: My highlights, and the account when signed in), cross references (OpenBible.info, CC BY), read-aloud, and links to
     share a verse. /bible/?r=John+3:16 opens a verse; ?embed=1 is the devotional's own window onto it. -->
<style>
@font-face{font-family:'MFHobo';src:url(/fish-lang/hobo.woff2) format('woff2');font-display:block}
:root{--bg:#000;--card:#0d0d0f;--card2:#16171b;--line:rgba(200,215,218,.14);--text:#eaf0f0;--dim:#9fb2b6;--blue:#2a5fb0;--blue2:#3370ff;--gold:#f5d76e;--sel:rgba(51,112,255,.28);color-scheme:dark}
:root[data-mode=light]{--bg:#f7f5ef;--card:#fff;--card2:#ece9df;--line:rgba(30,40,50,.14);--text:#1c2228;--dim:#5b6670;--blue:#2a5fb0;--blue2:#2a5fb0;--gold:#a87b00;--sel:rgba(42,95,176,.18);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:17px/1.5 'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 10px}
.brand{font:400 1.45rem/1 'MFHobo',cursive;text-decoration:none;color:var(--text);flex:none}.brand b{font-weight:400;color:#3370ff}
.ib{flex:none;border:1px solid var(--line);background:none;border-radius:999px;height:40px;min-width:40px;padding:0 12px;font-weight:700;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--text)}
.ib[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.where{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:999px;height:40px;padding:0 14px;font:600 1rem 'Fraunces',Georgia,serif;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where::after{content:' ▾';font-size:.8em;opacity:.7}
.ver{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;height:40px;padding:0 8px;font-weight:700;font-size:.85rem;max-width:96px}
.back{display:none}.embed .back{display:inline-flex}.embed .brand,.embed .home{display:none}
main{max-width:760px;margin:0 auto;padding:6px 18px 130px}
h1{font:600 1.7rem 'Fraunces',Georgia,serif;margin:18px 0 4px}
.sub{color:var(--dim);font-size:.85rem;margin:0 0 10px}
.txt{font:400 1.18rem/1.85 'Spectral',Georgia,serif}
.txt .vn{font:700 .66rem 'Archivo',sans-serif;color:var(--dim);vertical-align:super;margin:0 3px 0 4px}
.txt .v{cursor:pointer;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone;transition:background .15s}
.txt .v.hl{color:#14181c}
.txt .v.sel{text-decoration:underline dotted 2px;text-underline-offset:5px;background:var(--sel)}
.txt .v.hl.sel{text-decoration-color:#14181c}
.txt .v.say{outline:2px solid var(--blue2);outline-offset:1px}
.txt .v.flash{animation:fl 2.2s ease}
@keyframes fl{0%,60%{background:rgba(245,215,110,.45)}100%{background:none}}
.pn{display:flex;justify-content:space-between;gap:10px;margin:26px 0 0}
.pn button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;cursor:pointer;font-weight:700;text-align:left}
.pn button:last-child{text-align:right}.pn small{display:block;color:var(--dim);font-weight:600;font-size:.78rem}
.pn button[disabled]{visibility:hidden}
.note{color:var(--dim);font-size:.78rem;margin-top:22px}
.note a{color:var(--dim)}
.msg{color:var(--dim);padding:30px 0;text-align:center}
/* the verse tools */
.act{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -14px 34px -10px rgba(0,0,0,.6);
  transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:12px 14px max(14px,env(safe-area-inset-bottom));max-height:72vh;overflow:auto}
.act.open{transform:none}
.act .in{max-width:760px;margin:0 auto}
.act .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.act .hd b{flex:1;font:600 1.05rem 'Fraunces',Georgia,serif}
.dots{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 12px}
.dots button{width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.dots button[aria-pressed=true]{border-color:var(--text);box-shadow:0 0 0 2px var(--bg) inset}
.dots .un{width:auto;border-radius:999px;padding:0 12px;background:none;border:1px solid var(--line);font-weight:700;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 13px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--text)}
.xr{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.xr h4{margin:4px 0 6px;font:800 .72rem 'Archivo',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.xr button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 2px;cursor:pointer}
.xr button b{font-weight:700;font-size:.92rem}.xr button span{display:block;font:400 .98rem/1.5 'Spectral',Georgia,serif;color:var(--dim);margin-top:2px}
/* the book and chapter picker */
.pick{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.pick.open{display:flex}
.pick .hd{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line)}
.pick .hd b{flex:1;font:600 1.15rem 'Fraunces',Georgia,serif;text-align:center}
.pick .body{flex:1;overflow:auto;padding:10px 14px 30px;max-width:760px;width:100%;margin:0 auto}
.pick h5{margin:14px 2px 8px;font:800 .72rem 'Archivo',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.books button,.chs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 8px;cursor:pointer;font-weight:600;font-size:.92rem;text-align:left}
.books button.on,.chs button.on{border-color:var(--blue2);color:var(--blue2)}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.chs button{text-align:center;padding:12px 0}
.find{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font:inherit;color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:700;font-size:.9rem;z-index:60;display:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{display:block}
.act.open~.toast{bottom:auto;top:calc(64px + env(safe-area-inset-top))}
[hidden]{display:none!important}
@media (max-width:420px){.brand{display:none}.txt{font-size:1.12rem}.embed #mode{display:none}.embed .back .bl{display:none}}
</style>
</head>
<body>
<div class="bar"><div class="in">
  <button type="button" class="ib back" id="back" aria-label="Back to the devotional">&lsaquo;<span class="bl">&nbsp;Devotional</span></button>
  <a class="brand" href="/">Manna<b>Fish</b></a>
  <button type="button" class="where" id="where" aria-haspopup="dialog">John 1</button>
  <select class="ver" id="ver" aria-label="Bible version"></select>
  <button type="button" class="ib" id="say" aria-pressed="false" aria-label="Listen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
  <button type="button" class="ib" id="mode" aria-label="Light or dark">&#9728;&#xFE0E;</button>
</div></div>
<main id="main">
  <h1 id="title"></h1><p class="sub" id="sub"></p>
  <div class="txt" id="txt"><p class="msg">Opening…</p></div>
  <div class="pn"><button type="button" id="prev"></button><button type="button" id="next"></button></div>
  <p class="note" id="note"></p>
</main>

<div class="act" id="act" role="dialog" aria-label="Verse"><div class="in">
  <div class="hd"><b id="aRef"></b><button type="button" class="ib" id="aX" aria-label="Close">&#10005;</button></div>
  <div class="dots" id="aDots" role="group" aria-label="Highlight colour"></div>
  <div class="row"><button type="button" class="chip" id="aSay">&#9654;&#xFE0E; Listen from here</button><button type="button" class="chip" id="aCopy">Copy</button><button type="button" class="chip" id="aShare">Share</button></div>
  <div class="xr" id="aXr"></div>
</div></div>

<div class="pick" id="pick" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="hd"><button type="button" class="ib" id="pBack" aria-label="Books" hidden>&lsaquo;</button><b id="pTitle">Books</b><button type="button" class="ib" id="pX" aria-label="Close">&#10005;</button></div>
  <div class="body" id="pBody"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
  var Q=new URLSearchParams(location.search), EMBED=Q.get('embed')==='1'; if(EMBED) document.body.classList.add('embed');
  $('back').addEventListener('click',function(){ try{ parent.postMessage({mf:'bible-close'},location.origin); }catch(e){} });

  // light or dark: the same choice as the main site
  var root=document.documentElement;
  function mode(l){ if(l) root.setAttribute('data-mode','light'); else root.removeAttribute('data-mode'); $('mode').innerHTML=l?'&#9790;&#xFE0E;':'&#9728;&#xFE0E;'; }
  mode(ls('mf-mode')==='light'); $('mode').addEventListener('click',function(){ var l=root.getAttribute('data-mode')!=='light'; ls('mf-mode',l?'light':'dark'); mode(l); });

  var B=[["Genesis",50],["Exodus",40],["Leviticus",27],["Numbers",36],["Deuteronomy",34],["Joshua",24],["Judges",21],["Ruth",4],["1 Samuel",31],["2 Samuel",24],["1 Kings",22],["2 Kings",25],["1 Chronicles",29],["2 Chronicles",36],["Ezra",10],["Nehemiah",13],["Esther",10],["Job",42],["Psalm",150],["Proverbs",31],["Ecclesiastes",12],["Song of Solomon",8],["Isaiah",66],["Jeremiah",52],["Lamentations",5],["Ezekiel",48],["Daniel",12],["Hosea",14],["Joel",3],["Amos",9],["Obadiah",1],["Jonah",4],["Micah",7],["Nahum",3],["Habakkuk",3],["Zephaniah",3],["Haggai",2],["Zechariah",14],["Malachi",4],["Matthew",28],["Mark",16],["Luke",24],["John",21],["Acts",28],["Romans",16],["1 Corinthians",16],["2 Corinthians",13],["Galatians",6],["Ephesians",6],["Philippians",4],["Colossians",4],["1 Thessalonians",5],["2 Thessalonians",3],["1 Timothy",6],["2 Timothy",4],["Titus",3],["Philemon",1],["Hebrews",13],["James",5],["1 Peter",5],["2 Peter",3],["1 John",5],["2 John",1],["3 John",1],["Jude",1],["Revelation",22]];
  var ALIAS={psalms:'Psalm',ps:'Psalm',song:'Song of Solomon','song of songs':'Song of Solomon',songs:'Song of Solomon',canticles:'Song of Solomon'};
  function bookIdx(name){ var n=String(name||'').trim().toLowerCase(); n=ALIAS[n]?ALIAS[n].toLowerCase():n; for(var i=0;i<B.length;i++){ if(B[i][0].toLowerCase()===n) return i; }
    for(i=0;i<B.length;i++){ if(B[i][0].toLowerCase().replace(/ /g,'').indexOf(n.replace(/[ .]/g,''))===0) return i; } return -1; }
  function label(b,c,v,ev){ return B[b][0]+' '+c+(v?':'+v+(ev?'–'+ev:''):''); }
  function plain(b,c,v){ return B[b][0]+' '+c+':'+v; }

  // ── versions: the same list and the same choice as the main site's reader ──
  var VERS=[{k:'kjv',n:'King James Version',s:'KJV'},{k:'web',n:'World English Bible',s:'WEB'},{k:'asv',n:'American Standard Version',s:'ASV'},{k:'ylt',n:'Young’s Literal Translation',s:'YLT'},
    {k:'darby',n:'Darby Translation',s:'Darby'},{k:'bbe',n:'Bible in Basic English',s:'BBE'},{k:'dra',n:'Douay-Rheims',s:'Douay-Rheims'},{k:'net',n:'New English Translation',s:'NET',api:1}];
  function ver(){ var k=ls('mf-bible-version')||'kjv'; return VERS.filter(function(v){ return v.k===k; })[0]||VERS[0]; }
  VERS.forEach(function(v){ var o=document.createElement('option'); o.value=v.k; o.textContent=v.s; o.title=v.n; $('ver').appendChild(o); }); $('ver').value=ver().k;
  fetch('/api/bible?list=1').then(function(r){ return r.ok?r.json():null; }).then(function(j){ if(!j||!(j.versions||[]).includes('esv')) return; VERS.push({k:'esv',n:'English Standard Version',s:'ESV',api:1});
    var o=document.createElement('option'); o.value='esv'; o.textContent='ESV'; $('ver').appendChild(o); $('ver').value=ver().k; }).catch(function(){});
  $('ver').addEventListener('change',function(){ ls('mf-bible-version',this.value); go(AT.b,AT.c,AT.sel,true); });
  var CH={};
  function kjv(b,c){ return fetch('/fish-lang/bible/kjv/'+B[b][0].replace(/ /g,'_')+'-'+c+'.json').then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){ return {t:j.t,note:'King James Version · public domain'}; }); }
  function chapter(b,c,v){ v=v||ver(); var key=v.k+'|'+b+'|'+c; if(CH[key]) return CH[key];
    var p=v.k==='kjv'?kjv(b,c):v.api?fetch('/api/bible?v='+v.k+'&b='+encodeURIComponent(B[b][0])+'&c='+c).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){ return {t:j.t||[],note:j.note||v.n}; })
      :fetch('https://bible-api.com/'+encodeURIComponent(B[b][0]+' '+c)+'?translation='+v.k).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){ var t=[]; (j.verses||[]).forEach(function(x){ t[x.verse-1]=x.text.replace(/\s+/g,' ').trim(); }); return {t:t,note:v.n+' · public domain'}; });
    return CH[key]=p.catch(function(e){ delete CH[key]; if(v.k!=='kjv') return kjv(b,c).then(function(o){ o.note='King James Version (the '+v.s+' could not be reached just now)'; return o; }); throw e; }); }

  // ── highlights: the same store as the rest of MannaFish ──
  var HLC={gold:'#f5d76e',green:'#8ddca4',blue:'#93bff5',pink:'#f5a9cb',orange:'#f8b273'};
  function hls(){ try{ return JSON.parse(localStorage.getItem('mf-hl')||'{}')||{}; }catch(e){ return {}; } }
  function saveHls(h){ try{ localStorage.setItem('mf-hl',JSON.stringify(h)); }catch(e){} }
  function vcode(){ return 'en:'+ver().k; }
  function hkey(b,c,v){ return plain(b,c,v)+'|'+vcode(); }
  function colour(){ var c=ls('mf-hl-color')||'gold'; return HLC[c]?c:'gold'; }
  function paint(){ var h=hls(); [].forEach.call($('txt').querySelectorAll('.v'),function(s){ var x=h[hkey(AT.b,AT.c,+s.dataset.v)], c=x&&(HLC[x.c]?x.c:'gold');
    s.classList.toggle('hl',!!x); s.style.background=x?HLC[c]:''; }); }

  // ── where we are ──
  var AT={b:42,c:1,sel:0}, HIST=[];
  function go(b,c,v,keep){ stopSay(); closeAct(); AT={b:b,c:c,sel:v||0}; ls('mf-bible-last',JSON.stringify({b:b,c:c}));
    $('where').textContent=B[b][0]+' '+c; $('title').textContent=B[b][0]+' '+c; $('sub').textContent=ver().n; document.title=B[b][0]+' '+c+' · MannaFish Bible';
    try{ history.replaceState(null,'','?r='+encodeURIComponent(B[b][0]+' '+c+(v?':'+v:''))+(EMBED?'&embed=1':'')); }catch(e){}
    var pb=c>1?[b,c-1]:b>0?[b-1,B[b-1][1]]:null, nb=c<B[b][1]?[b,c+1]:b<B.length-1?[b+1,1]:null;
    $('prev').disabled=!pb; $('next').disabled=!nb; $('prev').dataset.to=pb?pb.join(','):''; $('next').dataset.to=nb?nb.join(','):'';
    $('prev').innerHTML=pb?'&lsaquo; Previous<small>'+esc(B[pb[0]][0]+' '+pb[1])+'</small>':''; $('next').innerHTML=nb?'Next &rsaquo;<small>'+esc(B[nb[0]][0]+' '+nb[1])+'</small>':'';
    if(!keep) window.scrollTo(0,0); $('txt').innerHTML='<p class="msg">Opening…</p>';
    chapter(b,c).then(function(o){ if(AT.b!==b||AT.c!==c) return; var h='<p>';
      o.t.forEach(function(t,i){ if(!t) return; h+='<span class="vn">'+(i+1)+'</span><span class="v" data-v="'+(i+1)+'">'+esc(t)+'</span> '; });
      $('txt').innerHTML=h+'</p>'; $('note').innerHTML=esc(o.note)+' · Cross references: <a href="https://www.openbible.info/labs/cross-references/" target="_blank" rel="noopener">OpenBible.info</a> (CC BY)'; paint();
      if(v){ var s=$('txt').querySelector('.v[data-v="'+v+'"]'); if(s){ s.classList.add('flash'); setTimeout(function(){ s.scrollIntoView({block:'center',behavior:keep?'auto':'smooth'}); },60); } }
      // the next chapter is ready before it is asked for
      if(nb) chapter(nb[0],nb[1]).catch(function(){}); })
      .catch(function(){ $('txt').innerHTML='<p class="msg">This chapter could not be opened. Check the connection and try again.</p>'; }); }
  $('prev').addEventListener('click',function(){ var t=this.dataset.to.split(',').map(Number); if(t.length===2) go(t[0],t[1]); });
  $('next').addEventListener('click',function(){ var t=this.dataset.to.split(',').map(Number); if(t.length===2) go(t[0],t[1]); });
  document.addEventListener('keydown',function(e){ if(e.target.closest&&e.target.closest('input,select,textarea')) return; if(e.key==='ArrowLeft') $('prev').click(); if(e.key==='ArrowRight') $('next').click(); if(e.key==='Escape'){ closeAct(); closePick(); } });
  (function(){ var x0=null,y0=0; $('main').addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
    $('main').addEventListener('touchend',function(e){ if(x0==null) return; var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
      if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6) (dx<0?$('next'):$('prev')).click(); }); })();

  // ── tap a verse: highlight, listen, copy, share, cross references ──
  var SEL=0;
  $('txt').addEventListener('click',function(e){ var s=e.target.closest('.v'); if(!s) return; var v=+s.dataset.v;
    if(SEL===v&&$('act').classList.contains('open')){ closeAct(); return; } openAct(v); });
  function openAct(v){ SEL=v; [].forEach.call($('txt').querySelectorAll('.v.sel'),function(x){ x.classList.remove('sel'); }); var s=$('txt').querySelector('.v[data-v="'+v+'"]'); if(s) s.classList.add('sel');
    $('aRef').textContent=plain(AT.b,AT.c,v)+' · '+ver().s; dots(); $('act').classList.add('open'); xrefs(v); }
  function closeAct(){ SEL=0; $('act').classList.remove('open'); [].forEach.call(document.querySelectorAll('.v.sel'),function(x){ x.classList.remove('sel'); }); }
  $('aX').addEventListener('click',closeAct);
  function dots(){ var h=hls(), x=h[hkey(AT.b,AT.c,SEL)], on=x&&(x.c||'gold');
    $('aDots').innerHTML=Object.keys(HLC).map(function(c){ return '<button type="button" data-c="'+c+'" aria-label="Highlight '+c+'" aria-pressed="'+(on===c)+'" style="background:'+HLC[c]+'"></button>'; }).join('')+(x?'<button type="button" class="un" data-c="">Remove</button>':''); }
  $('aDots').addEventListener('click',function(e){ var b=e.target.closest('[data-c]'); if(!b||!SEL) return; var c=b.dataset.c, h=hls(), k=hkey(AT.b,AT.c,SEL), s=$('txt').querySelector('.v[data-v="'+SEL+'"]');
    if(!c||(h[k]&&h[k].c===c)){ delete h[k]; toast('Highlight removed'); }
    else { ls('mf-hl-color',c); h[k]={kind:'verse',ref:plain(AT.b,AT.c,SEL),ver:vcode(),k:'',i:0,l:'en',v:SEL,c:c,text:(s?s.textContent:'').slice(0,220),at:Date.now(),bible:1}; toast('Highlighted · saved to My highlights'); }
    saveHls(h); paint(); dots(); });
  function vtext(){ var s=$('txt').querySelector('.v[data-v="'+SEL+'"]'); return s?s.textContent:''; }
  $('aCopy').addEventListener('click',function(){ var t='“'+vtext()+'” '+plain(AT.b,AT.c,SEL)+' ('+ver().s+')';
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){ toast('Copied'); },function(){ toast('Could not copy on this device'); }); });
  $('aShare').addEventListener('click',function(){ var url=location.origin+'/bible/?r='+encodeURIComponent(plain(AT.b,AT.c,SEL)), t='“'+vtext()+'” '+plain(AT.b,AT.c,SEL)+' ('+ver().s+')';
    if(navigator.share) navigator.share({title:'MannaFish · '+plain(AT.b,AT.c,SEL),text:t,url:url}).catch(function(){});
    else (navigator.clipboard?navigator.clipboard.writeText(t+' '+url):Promise.reject()).then(function(){ toast('Link copied'); },function(){}); });
  $('aSay').addEventListener('click',function(){ var v=SEL; closeAct(); startSay(v); });

  // cross references (OpenBible.info, CC BY): each verse's strongest links, the words of each shown (KJV)
  var XR={};
  function xbook(b){ return XR[b]||(XR[b]=fetch('/fish-lang/bible/xref/'+B[b][0].replace(/ /g,'_')+'.json').then(function(r){ return r.ok?r.json():{}; }).catch(function(){ delete XR[b]; return {}; })); }
  function xrefs(v){ var box=$('aXr'), at=AT.b+':'+AT.c+':'+v; box.innerHTML='';
    xbook(AT.b).then(function(J){ if(AT.b+':'+AT.c+':'+SEL!==at) return; var L=J[AT.c+':'+v]||[];
      if(!L.length){ box.innerHTML='<h4>Cross references</h4><p class="sub">None for this verse.</p>'; return; }
      box.innerHTML='<h4>Cross references</h4>'+L.map(function(x,n){ var ec=x[3]||x[1], ev=x[4]; return '<button type="button" data-x="'+x[0]+','+x[1]+','+x[2]+'"><b>'+esc(label(x[0],x[1],x[2])+(ev?(x[3]?'–'+ec+':'+ev:'–'+ev):''))+'</b><span data-n="'+n+'">…</span></button>'; }).join('');
      L.forEach(function(x,n){ kjv(x[0],x[1]).then(function(o){ var to=x[3]?x[2]:(x[4]||x[2]), w=[]; for(var i=x[2];i<=Math.min(to,x[2]+2);i++) if(o.t[i-1]) w.push(o.t[i-1]);
        var sp=box.querySelector('span[data-n="'+n+'"]'); if(sp) sp.textContent=w.join(' ')+(to>x[2]+2||x[3]?' …':''); }).catch(function(){}); }); }); }
  $('aXr').addEventListener('click',function(e){ var b=e.target.closest('[data-x]'); if(!b) return; var t=b.dataset.x.split(',').map(Number); HIST.push({b:AT.b,c:AT.c,v:SEL}); go(t[0],t[1],t[2]); backUI(); });
  function backUI(){ var h=HIST[HIST.length-1]; if(!h){ var o=$('hist'); if(o) o.remove(); return; } var b=$('hist');
    if(!b){ b=document.createElement('button'); b.id='hist'; b.type='button'; b.className='chip'; b.style.margin='14px 0 0'; $('main').insertBefore(b,$('title'));
      b.addEventListener('click',function(){ var x=HIST.pop(); if(x) go(x.b,x.c,x.v); backUI(); }); }
    b.innerHTML='&lsaquo; Back to '+esc(plain(h.b,h.c,h.v)); }

  // ── listen: the device's own voice, verse by verse, following along on the page ──
  var SAY={on:false,i:0};
  function voice(){ var vs=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(function(v){ return /^en/i.test(v.lang); });
    return vs.filter(function(v){ return /en-(US|GB)/i.test(v.lang)&&/natural|premium|enhanced|samantha|daniel|google/i.test(v.name); })[0]||vs[0]||null; }
  function stopSay(){ SAY.on=false; try{ speechSynthesis.cancel(); }catch(e){} [].forEach.call(document.querySelectorAll('.v.say'),function(s){ s.classList.remove('say'); }); $('say').setAttribute('aria-pressed','false'); }
  function startSay(v){ if(!window.speechSynthesis){ toast('This device cannot read aloud'); return; } stopSay(); SAY={on:true,i:Math.max(0,(v||1)-1)}; $('say').setAttribute('aria-pressed','true'); next(); }
  function next(){ if(!SAY.on) return; var L=[].slice.call($('txt').querySelectorAll('.v')); [].forEach.call(document.querySelectorAll('.v.say'),function(s){ s.classList.remove('say'); });
    var el=L[SAY.i]; if(!el){ stopSay(); return; } el.classList.add('say'); var r=el.getBoundingClientRect(); if(r.top<70||r.bottom>innerHeight-80) window.scrollBy({top:r.top-innerHeight/3,behavior:'smooth'});
    var u=new SpeechSynthesisUtterance((SAY.i===0?B[AT.b][0]+' chapter '+AT.c+'. ':'')+el.textContent), vv=voice(); if(vv){ u.voice=vv; u.lang=vv.lang; } else u.lang='en-US'; u.rate=.95;
    u.onend=function(){ SAY.i++; next(); }; u.onerror=function(e){ if(e.error!=='interrupted'&&e.error!=='canceled'){ SAY.i++; next(); } }; speechSynthesis.speak(u); }
  $('say').addEventListener('click',function(){ if(SAY.on) stopSay(); else { var L=[].slice.call($('txt').querySelectorAll('.v')), i=L.findIndex(function(s){ return s.getBoundingClientRect().bottom>80; }); startSay(i>=0?i+1:1); } });

  // ── the book and chapter picker ──
  function openPick(){ $('pick').classList.add('open'); books(); }
  function closePick(){ $('pick').classList.remove('open'); }
  $('where').addEventListener('click',openPick); $('pX').addEventListener('click',closePick); $('pBack').addEventListener('click',books);
  function books(q){ $('pTitle').textContent='Books'; $('pBack').hidden=true; q=(q||'').toLowerCase();
    var grid=function(a,z){ return '<div class="books">'+B.slice(a,z).map(function(x,i){ var n=a+i; if(q&&x[0].toLowerCase().indexOf(q)<0&&x[0].toLowerCase().replace(/ /g,'').indexOf(q.replace(/ /g,''))<0) return ''; return '<button type="button" data-b="'+n+'" class="'+(n===AT.b?'on':'')+'">'+esc(x[0])+'</button>'; }).join('')+'</div>'; };
    $('pBody').innerHTML='<input class="find" id="pFind" type="search" placeholder="Find a book, or type a reference like John 3:16" value="'+esc(q)+'" autocomplete="off">'
      +'<h5>Old Testament</h5>'+grid(0,39)+'<h5>New Testament</h5>'+grid(39,66);
    var f=$('pFind'); f.addEventListener('input',function(){ var pos=this.value; books(pos); var g=$('pFind'); g.focus(); g.setSelectionRange(pos.length,pos.length); });
    f.addEventListener('keydown',function(e){ if(e.key!=='Enter') return; var r=parseRef(this.value); if(r){ closePick(); go(r.b,r.c,r.v); } }); }
  function chapters(b){ $('pTitle').textContent=B[b][0]; $('pBack').hidden=false; var h='<div class="chs">'; for(var c=1;c<=B[b][1];c++) h+='<button type="button" data-c="'+c+'" class="'+(b===AT.b&&c===AT.c?'on':'')+'">'+c+'</button>'; $('pBody').innerHTML=h+'</div>'; $('pBody').dataset.bk=b; }
  $('pBody').addEventListener('click',function(e){ var b=e.target.closest('button[data-b]'); if(b){ var n=+b.dataset.b; if(B[n][1]===1){ closePick(); go(n,1); } else chapters(n); return; }
    var c=e.target.closest('[data-c]'); if(c){ closePick(); go(+$('pBody').dataset.bk,+c.dataset.c); } });
  function parseRef(s){ var m=/^\s*(.+?)\s+(\d+)(?::(\d+))?/.exec(String(s||'').replace(/\+/g,' ')); if(!m) return null; var b=bookIdx(m[1]); if(b<0) return null;
    var c=Math.min(+m[2],B[b][1]); return {b:b,c:Math.max(1,c),v:m[3]?+m[3]:0}; }

  function toast(t){ var e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(function(){ e.classList.remove('on'); },2200); }

  // start: a reference in the link, else where this person last read, else John 1
  var r=parseRef(Q.get('r')||''), last=null; try{ last=JSON.parse(ls('mf-bible-last')||'null'); }catch(e){}
  if(r) go(r.b,r.c,r.v); else if(last&&B[last.b]) go(last.b,Math.min(last.c,B[last.b][1])); else go(42,1);
  window.MFbible={go:function(ref){ var x=parseRef(ref); if(x) go(x.b,x.c,x.v); }};
})();
</script>
</body>
