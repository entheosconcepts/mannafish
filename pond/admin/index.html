<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Fishing excursions · MannaFish</title>
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Ken, 12 Oct: the fishing excursion. A sponsor stocks the pond with N fish; every gift is two MannaFish (one to keep,
     one to give away), one gift per home. Start an excursion, restock it, and see every gift to mail and mark it sent.
     The key is MF_ADMIN_KEY in Netlify (or PROOF_KEY until that is set); it is kept on this device after the first time. -->
<style>
:root{--ink:#000;--ink2:#0b1620;--foam:#eaf0f0;--dim:#9fb2b6;--blue:#2a5fb0;--line:rgba(200,215,218,.18);--red:#c8423c;--gold:#f5d76e}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--foam);font:1rem/1.5 'Archivo',system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
header b{font-size:1.1rem}header a{color:var(--foam);font-size:.9rem}
main{max-width:900px;margin:0 auto;padding:16px}
h2{font-size:1.05rem;margin:22px 0 10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
input,textarea{font:inherit;color:var(--foam);background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
button{font:700 .9rem 'Archivo',sans-serif;border-radius:999px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--foam)}
button.ok{background:var(--blue);border-color:var(--blue);color:#fff}button.no{border-color:var(--red);color:#ffb3ae}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;background:var(--ink2)}
.pond.on{border-color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .w{grid-column:1/-1}
label{font-size:.8rem;color:var(--dim);display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.big{font-size:1.6rem;font-weight:800}.meta{font-size:.85rem;color:var(--dim)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sent{color:#8fe3a1}.msg{color:var(--dim);text-align:center;padding:16px}
.key{display:flex;gap:8px;margin:20px 0}
@media(max-width:640px){.grid{grid-template-columns:1fr}table,thead,tbody,tr,td{display:block}thead{display:none}td{border:0;padding:2px 0}tr{border-bottom:1px solid var(--line);padding:8px 0}}
</style>
</head>
<body>
<header><b>🎣 Fishing excursions</b><a href="/">MannaFish</a></header>
<main>
  <div class="key" id="keyBox" hidden><input id="key" type="password" placeholder="Review key (MF_ADMIN_KEY)" autocomplete="current-password"><button class="ok" id="keyGo">Open</button></div>
  <div id="app" hidden>
    <h2>Current excursion</h2><div id="cur"></div>
    <h2>Start a new excursion</h2>
    <form class="card grid" id="newF">
      <label>Sponsor (shown to everyone)<input name="sponsor" required maxlength="120" placeholder="O’Brien Heating & Air"></label>
      <label>Number of fish (2 per gift)<input name="stocked" type="number" min="2" step="2" required value="300"></label>
      <label>Name of the excursion<input name="name" maxlength="80" placeholder="MannaFish Excursion"></label>
      <label>Sponsor’s website (optional)<input name="url" maxlength="300" placeholder="https://"></label>
      <label class="w">A line from the sponsor (optional)<input name="msg" maxlength="300" placeholder="Warm hearts, warm homes."></label>
      <div class="row w"><button class="ok" type="submit">Stock the pond</button><span class="meta">Starting a new one closes the current one.</span></div>
    </form>
    <h2>Gifts to send <span class="meta" id="cnt"></span></h2>
    <div class="row" style="margin:0 0 10px"><button id="csv">Download for mailing (CSV)</button><button id="reload">↻ Refresh</button></div>
    <div id="claims"></div>
    <h2>Earlier excursions</h2><div id="old"></div>
  </div>
</main>
<script>
(function(){
  var $=function(id){ return document.getElementById(id); }, K='', D={ponds:[],claims:[]};
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  try{ K=localStorage.getItem('mf-admin-k')||''; }catch(e){}
  function api(b){ b.k=K; return fetch('/api/pond/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw j; return j; }); }); }
  function load(){ fetch('/api/pond/admin?k='+encodeURIComponent(K)).then(function(r){ if(r.status===403) throw 403; return r.json(); })
    .then(function(j){ D=j; $('keyBox').hidden=true; $('app').hidden=false; try{ localStorage.setItem('mf-admin-k',K); }catch(e){} draw(); })
    .catch(function(e){ $('keyBox').hidden=false; $('app').hidden=true; if(e===403&&K) alert('That key did not work.'); }); }
  function pondCard(p){ var left=Math.max(0,p.stocked-p.given), pct=p.stocked?Math.round(left/p.stocked*100):0;
    return '<div class="card pond'+(p.active?' on':'')+'" data-id="'+esc(p.id)+'"><div class="big">'+left+' <span class="meta">of '+p.stocked+' fish left · '+Math.floor(left/2)+' gifts</span></div>'
      +'<div class="bar"><i style="width:'+pct+'%"></i></div><div><b>'+esc(p.name)+'</b>, sponsored by <b>'+esc(p.sponsor)+'</b>'+(p.url?' · <a style="color:inherit" href="'+esc(p.url)+'" target="_blank" rel="noopener">website</a>':'')+'</div>'
      +(p.msg?'<div class="meta">“'+esc(p.msg)+'”</div>':'')+'<div class="meta">Started '+esc(new Date(p.at).toLocaleDateString())+(p.active?' · open':' · closed')+'</div>'
      +'<div class="row"><input type="number" min="2" step="2" value="100" style="width:110px" class="add"><button data-a="restock">Restock</button>'
      +(p.active?'<button class="no" data-a="close">Close the pond</button>':'<button data-a="open">Open again</button>')+'</div></div>'; }
  function draw(){ var on=D.ponds.filter(function(p){ return p.active; }), old=D.ponds.filter(function(p){ return !p.active; });
    $('cur').innerHTML=on.length?on.map(pondCard).join(''):'<p class="msg">No pond is stocked right now. Start one below.</p>';
    $('old').innerHTML=old.length?old.map(pondCard).join(''):'<p class="msg">None yet.</p>';
    var waiting=D.claims.filter(function(c){ return !c.shipped; }).length; $('cnt').textContent='('+waiting+' to send, '+(D.claims.length-waiting)+' sent)';
    $('claims').innerHTML=D.claims.length?'<table><thead><tr><th>For</th><th>Address</th><th>From</th><th>Word</th><th></th></tr></thead><tbody>'+D.claims.map(function(c){ var t=c.to||{};
      return '<tr data-c="'+esc(c.id)+'"><td><b>'+esc(t.name)+'</b><div class="meta">'+esc(new Date(c.at).toLocaleString())+'</div>'+(t.email?'<div class="meta">'+esc(t.email)+'</div>':'')+'</td>'
        +'<td>'+esc(t.street)+'<br>'+esc(t.city)+', '+esc(t.region)+'<br>'+esc(t.country)+'</td><td>'+(c.self?'(for themselves)':esc(c.from||'—'))+(c.tier?'<div><b>🎁 '+(c.tier==='t7'?'7 days: decals':'30 days: T-shirt')+'</b></div>':'')+'<div class="meta">'+esc(c.sponsor||'')+(c.waiting?' waiting for stock':'')+'</div></td><td>'+esc(c.word||'')+'</td>'
        +'<td>'+(c.shipped?'<span class="sent">✓ Sent '+esc(new Date(c.shipped).toLocaleDateString())+'</span> <button data-a="unship">Undo</button>':'<button class="ok" data-a="ship">Mark sent</button>')
        +' <button class="no" data-a="forget" title="Lets this home ask again">Remove</button></td></tr>'; }).join('')+'</tbody></table>':'<p class="msg">No gifts requested yet.</p>'; }
  document.addEventListener('click',function(e){ var b=e.target.closest('button[data-a]'); if(!b) return; var a=b.dataset.a, card=b.closest('[data-id]'), row=b.closest('[data-c]'); b.disabled=true;
    var body=card?{action:a,id:card.dataset.id,add:+(card.querySelector('.add')||{}).value||0}:{action:a,claim:row.dataset.c};
    if(a==='forget'&&!confirm('Remove this gift request? That home will be able to ask again.')){ b.disabled=false; return; }
    if(a==='close'&&!confirm('Close this pond? No more gifts can be requested until you open it again.')){ b.disabled=false; return; }
    api(body).then(load).catch(function(){ b.disabled=false; alert('That did not work. Please try again.'); }); });
  $('newF').addEventListener('submit',function(e){ e.preventDefault(); var f=e.target; api({action:'create',sponsor:f.sponsor.value,stocked:+f.stocked.value,name:f.name.value,url:f.url.value,msg:f.msg.value})
    .then(function(){ f.reset(); load(); }).catch(function(j){ alert((j&&j.error)||'That did not work.'); }); });
  $('csv').addEventListener('click',function(){ var q=function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; };
    var rows=[['Name','Street','City','State and ZIP','Country','Email','From','Gift','Word','Sponsor','Requested','Sent']].concat(D.claims.map(function(c){ var t=c.to||{}; return [t.name,t.street,t.city,t.region,t.country,t.email,c.self?'(self)':c.from,c.tier==='t7'?'7-day decals':c.tier==='t30'?'30-day T-shirt':'2 MannaFish',c.word,c.sponsor,c.at,c.shipped||'']; }));
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([rows.map(function(r){ return r.map(q).join(','); }).join('\n')],{type:'text/csv'})); a.download='mannafish-gifts.csv'; a.click(); });
  $('reload').addEventListener('click',load);
  $('keyGo').addEventListener('click',function(){ K=$('key').value.trim(); load(); });
  $('key').addEventListener('keydown',function(e){ if(e.key==='Enter') $('keyGo').click(); });
  load();
})();
</script>
</body>
</html>
